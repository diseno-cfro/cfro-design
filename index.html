function renderAll(){
  saveDB();
  let u=currentUser();
  if(!u){
    // Red de seguridad: si por cualquier motivo se perdió la identidad en memoria,
    // se intenta recuperar desde la sesión guardada en este dispositivo antes de
    // asumir que hay que cerrar sesión.
    const sess=checkSession();
    if(sess){ DB.currentUserId=sess; u=currentUser(); }
  }
  if(!u){ logout(); return; }
  /* checkLicenseAlerts() puede terminar en un saveDB() (y por lo tanto en un envío a
     la nube). Si esto corre en la PRIMERA pantalla, antes de que termine de llegar la
     sincronización inicial, se estaría guardando con lo que había quedado en este
     navegador — que puede estar desactualizado si pasó tiempo desde la última vez.
     Ese guardado, al mezclarse, revive por id cualquier cosa vieja que ya se hubiera
     borrado o cambiado desde entonces. Por eso se espera a que la sincronización
     inicial confirme que ya se tiene la copia real antes de dejar que esto guarde. */
  if(!STATE.licenseAlertsChecked && (!SYNC.client || SYNC.initialPullDone)){ STATE.licenseAlertsChecked=true; checkLicenseAlerts(); }
  const role=normRole(u);
  if(!navAllowed(role,STATE.view)) STATE.view='dashboard';
  withFocusPreserved(()=>{
    try{ renderTopbar(); }catch(e){ console.error('Error en renderTopbar:',e); }
    try{ renderSidebar(); }
    catch(e){
      console.error('Error en renderSidebar:',e);
      const sb=document.getElementById('sidebar');
      if(sb) sb.innerHTML=`<div style="padding:16px;color:var(--red);font-size:11px">${STATE.lang==='en'?'Menu error':'Error en el menú'}: ${esc(e.message)}</div>`;
    }
    const c=document.getElementById('content');
    const map={
      dashboard:viewDashboard, proximas:viewProximas, criticas:viewCriticas, notificaciones:viewNotificaciones,
      actividades:viewActividades, orden_prioridades:viewOrdenPrioridades, calendario:viewCalendario,
      reporte:viewReporte, gestor_ot:viewGestorOT, avance_diseno:viewAvanceDiseno, socializaciones:viewSocializaciones, flujos:viewFlujos, salas:viewSalas, terceros:viewTerceros, contratos:viewContratos, admin:viewAdmin, datos:viewDatos,
    };
    /* Si ALGO específico de una pantalla falla (por un dato inesperado, por ejemplo), esto
       ya NO se queda "pegado" en silencio — se muestra el error exacto en pantalla, con un
       botón para volver al Panel General. Antes, un error aquí dejaba el clic sin ningún
       efecto visible, indistinguible de "no reacciona a nada". */
    try{
      c.innerHTML=(map[STATE.view]||viewDashboard)();
    }catch(e){
      console.error('Error renderizando la vista', STATE.view, e);
      c.innerHTML=`<div class="card" style="margin:20px 0;border-color:var(--red)">
        <div class="section-title" style="color:var(--red)">⚠️ ${STATE.lang==='en'?'Something went wrong loading this screen':'Algo falló al cargar esta pantalla'}</div>
        <p class="hint" style="margin-bottom:10px">${STATE.lang==='en'?'Please copy this message and send it over so it can be fixed:':'Por favor copia este mensaje y envíalo para poder corregirlo:'}</p>
        <pre style="white-space:pre-wrap;background:var(--panel-2);padding:12px;border-radius:8px;font-size:11px;color:var(--red);overflow-x:auto">${STATE.view}: ${esc(e.message)}${e.stack?'\n'+esc(e.stack.split('\n').slice(0,4).join('\n')):''}</pre>
        <button class="btn btn-primary" style="margin-top:12px" onclick="STATE.view='dashboard';STATE.activityId=null;renderAll()">${STATE.lang==='en'?'Go to Dashboard':'Ir al Panel General'}</button>
      </div>`;
    }
  });
}

/* ---- DASHBOARD ---- */
function viewDashboard(){
  const u=currentUser(); const role=normRole(u);
  let html;
  if(role==='profesional') html=dashProfesional(u);
  else if(isLiderRole(role)) html=dashLider(u);
  else html=dashDireccion(u,role);
  return birthdayBanner()+newAssignmentsBanner(u)+html;
}
function birthdayBanner(){
  const bdays=birthdaysToday();
  if(!bdays.length) return '';
  const names=bdays.map(u=>esc(u.name)).join(', ');
  return `<div class="card" style="margin-bottom:14px;background:linear-gradient(90deg,#FFF7E8,#FFFFFF);border-color:var(--amber)">
    <div style="display:flex;align-items:center;gap:10px;font-size:13px">
      <span style="font-size:22px">🎂</span>
      <div><b>${STATE.lang==='en'?'Happy birthday!':'¡Feliz cumpleaños!'}</b> ${STATE.lang==='en'?'Today is the birthday of':'Hoy es el cumpleaños de'} ${names}.</div>
    </div>
  </div>`;
}
function newAssignmentsBanner(u){
  const n=DB.notifications.filter(x=>x.type==='asignacion' && !x.read && x.toUserIds && x.toUserIds.includes(u.id));
  if(!n.length) return '';
  return `<div class="card" style="margin-bottom:14px;background:linear-gradient(90deg,#EAF2FF,#FFFFFF);border-color:var(--accent);cursor:pointer" onclick="STATE.notifTypeFilter='asignacion';setView('notificaciones')">
    <div style="display:flex;align-items:center;gap:10px;font-size:13px">
      <span style="font-size:22px">🔵</span>
      <div><b>${STATE.lang==='en'?'New assignment':'Nueva asignación'}${n.length>1?'s':''}</b> — ${STATE.lang==='en'?`You have ${n.length} new activity assignment(s). Tap to review.`:`Tienes ${n.length} actividad(es) nueva(s) asignada(s). Toca para revisarlas.`}</div>
    </div>
  </div>`;
}
function kpiRow(items){ return `<div class="grid grid-4" style="margin-bottom:20px">${items.map(i=>`<div class="kpi k-${i.k}"><div class="n">${i.n}</div><div class="l">${i.l}</div></div>`).join('')}</div>`; }

function dashDireccion(u,role){
  const acts=DB.activities;
  const total=acts.length, comp=acts.filter(a=>a.status==='completada').length, curso=acts.filter(a=>a.status==='en_curso').length,
    rev=acts.filter(a=>a.status==='en_revision').length, venc=acts.filter(isOverdue).length, block=acts.filter(a=>a.blocked).length,
    p1=acts.filter(a=>a.priority==='P1'&&!['completada','cancelada'].includes(a.status)).length;
  const cumplimiento=total?Math.round(comp/total*100):0;

  const discRows=sortedDisciplines().map(d=>{
    const da=acts.filter(a=>(a.disciplines||[]).includes(d.id));
    const dc=da.filter(a=>a.status==='completada').length;
    const lider=DB.users.find(x=>isLiderRole(normRole(x))&&userHasDisc(x,d.id));
    return {d, total:da.length, pct: da.length?Math.round(dc/da.length*100):100, lider, venc:da.filter(isOverdue).length};
  });
  const areaRows=AREAS.map(ar=>{
    const aa=acts.filter(a=>a.area===ar.id);
    const ac=aa.filter(a=>a.status==='completada').length;
    return {ar, total:aa.length, comp:ac, pct: aa.length?Math.round(ac/aa.length*100):0, venc:aa.filter(isOverdue).length, block:aa.filter(a=>a.blocked&&!['completada','cancelada'].includes(a.status)).length};
  });
  const rq=(STATE.dashRespQuery||'').toLowerCase();
  const eq=(STATE.dashExecQuery||'').toLowerCase();
  const personStats=(list)=>{
    const rc=list.filter(a=>a.status==='completada').length;
    return { total:list.length, pend:list.filter(a=>!['completada','cancelada'].includes(a.status)).length,
      venc:list.filter(isOverdue).length, block:list.filter(a=>a.blocked&&!['completada','cancelada'].includes(a.status)).length,
      pct: list.length?Math.round(rc/list.length*100):0 };
  };
  let respRows=DB.users.filter(us=>DB.activities.some(a=>(a.responsibleIds||[]).includes(us.id))).map(us=>{
    const ra=DB.activities.filter(a=>(a.responsibleIds||[]).includes(us.id));
    return {u:us, ...personStats(ra)};
  }).sort((a,b)=>b.venc-a.venc);
  if(rq) respRows=respRows.filter(r=>r.u.name.toLowerCase().includes(rq)||(r.u.cargo||'').toLowerCase().includes(rq)||userDiscNames(r.u).toLowerCase().includes(rq));
  let execRows=DB.users.filter(us=>(normRole(us)==='profesional'||isLiderRole(normRole(us))) && DB.activities.some(a=>(a.executorIds||[]).includes(us.id))).map(us=>{
    const ea=DB.activities.filter(a=>(a.executorIds||[]).includes(us.id));
    return {u:us, ...personStats(ea)};
  }).sort((a,b)=>b.venc-a.venc);
  if(eq) execRows=execRows.filter(r=>r.u.name.toLowerCase().includes(eq)||(r.u.cargo||'').toLowerCase().includes(eq)||userDiscNames(r.u).toLowerCase().includes(eq));
  const proximos=acts.filter(a=>!['completada','cancelada'].includes(a.status)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,6);
  const interven=acts.filter(a=>a.priority==='P1'&&(isOverdue(a)||a.blocked)).slice(0,6);

  const flujosActivos=acts.filter(a=>a.flujo && !['completada','cancelada'].includes(a.status) && !a.flujo.etapas.every(e=>a.flujo.estados[e.id].estado==='aprobado'));

  return `
  <div class="pagehead"><div><h1>${t('nav_dashboard')}</h1><div class="sub">${roleLabel(role).toUpperCase()} · ${iso(today())}</div></div>
    ${can('create')?`<button class="btn btn-primary" onclick="openNewActivity()">${t('btn_new_activity')}</button>`:''}</div>
  <div class="sig-strip"></div>
  ${kpiRow([
    {n:total,l:t('kpi_total'),k:'accent'},{n:comp,l:t('kpi_completed'),k:'green'},
    {n:curso,l:t('kpi_inprogress'),k:'accent'},{n:rev,l:t('kpi_review'),k:'accent'},
  ])}
  <div class="card" style="margin-bottom:20px">
    <div class="section-title">${STATE.lang==='en'?'By area — Technical Office, Design, Construction':'Por área — Oficina Técnica, Diseño, Construcción'}</div>
    <div class="grid grid-3">
      ${areaRows.map(r=>`<div class="area-card" onclick="filterByArea('${r.ar.id}')">
        <div class="area-card-h">${esc(r.ar.name)}</div>
        <div class="area-card-n">${r.total}</div>
        <div class="area-card-sub">${STATE.lang==='en'?'activities':'actividades'} · ${r.pct}% ${STATE.lang==='en'?'complete':'completado'}</div>
        <div class="progress" style="margin-top:6px"><i style="width:${r.pct}%"></i></div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          ${r.venc?`<span class="badge b-late"><span class="d"></span>${r.venc} ${t('kpi_overdue').toLowerCase()}</span>`:''}
          ${r.block?`<span class="badge b-block"><span class="d"></span>${r.block} ${STATE.lang==='en'?'blocked':'bloqueadas'}</span>`:''}
          ${!r.venc&&!r.block?`<span class="badge b-ok"><span class="d"></span>${STATE.lang==='en'?'on track':'al día'}</span>`:''}
        </div>
      </div>`).join('')}
    </div>
  </div>
  ${flujosActivos.length?`<div class="card" style="margin-bottom:20px">
    <div class="section-title">${STATE.lang==='en'?'Active workflows':'Flujos activos'} <span class="tag">${flujosActivos.length}</span></div>
    ${flujosActivos.slice(0,8).map(a=>{
      const f=a.flujo; const total=f.etapas.length; const done=f.etapas.filter(e=>f.estados[e.id].estado==='aprobado').length;
      const pct=Math.round(done/total*100);
      const disponibles=f.etapas.filter(e=>['disponible','en_revision'].includes(f.estados[e.id].estado)).map(e=>e.nombre);
      return `<div class="alert-line" onclick="setView('actividades','${a.id}')">
        <div class="ic">🔀</div>
        <div style="flex:1">
          <div>${a.code} · ${esc(a.name)} — <span style="color:var(--text-faint)">${esc(f.templateNombre)}</span></div>
          <div class="progress" style="margin-top:4px;margin-bottom:2px"><i style="width:${pct}%"></i></div>
          <div style="font-size:11px;color:var(--text-faint)">${done}/${total} ${STATE.lang==='en'?'stages approved':'etapas aprobadas'}${disponibles.length?' · '+(STATE.lang==='en'?'waiting on: ':'esperando a: ')+disponibles.join(', '):''}</div>
        </div>
      </div>`;
    }).join('')}
    ${flujosActivos.length>8?`<div class="hint" style="margin-top:6px">${STATE.lang==='en'?`+${flujosActivos.length-8} more`:`+${flujosActivos.length-8} más`}</div>`:''}
  </div>`:''}
  ${kpiRow([
    {n:venc,l:t('kpi_overdue'),k:'red'},{n:block,l:t('kpi_blocked'),k:'purple'},
    {n:p1,l:t('kpi_p1'),k:'amber'},{n:cumplimiento+'%',l:t('kpi_compliance'),k:'green'},
  ])}
  <div class="grid grid-2">
    <div class="card">
      <div class="section-title">${STATE.lang==='en'?'Alerts':'Alertas'}</div>
      ${renderAlertList(liveAlerts().filter(a=>a.level==='red'||a.level==='purple'||a.level==='orange').slice(0,7))}
    </div>
    <div class="card">
      <div class="section-title">${STATE.lang==='en'?'Status by discipline':'Estado por disciplina'}</div>
      <div class="tbl-wrap" style="border:none;max-height:340px;overflow-y:auto"><table><thead><tr>
        <th>${t('th_discipline')}</th><th>${t('th_responsible')}</th><th>${t('th_activity')}</th><th>${t('kpi_overdue')}</th><th>%</th></tr></thead><tbody>
      ${discRows.filter(r=>r.total>0).sort((a,b)=>a.pct-b.pct).map(r=>`<tr class="row-click" onclick="filterByDiscipline('${r.d.id}')">
        <td>${esc(r.d.name)}</td><td>${r.lider?userNameCargo(r.lider.id):'—'}</td><td>${r.total}</td>
        <td>${r.venc?`<span class="badge b-late"><span class="d"></span>${r.venc}</span>`:'0'}</td><td>${r.pct}%</td>
      </tr>`).join('') || `<tr><td colspan="5"><div class="empty">${t('empty_generic')}</div></td></tr>`}
      </tbody></table></div>
    </div>
  </div>
  ${(()=>{ const mine=DB.activities.filter(a=>!a.parentId && ((a.responsibleIds||[]).includes(u.id)||(a.executorIds||[]).includes(u.id)) && !['completada','cancelada'].includes(a.status));
    if(!mine.length) return '';
    return `<div class="card" style="margin-top:14px">
      <div class="section-title">${STATE.lang==='en'?'My own assigned activities':'Mis actividades asignadas'} <span class="tag">${mine.length}</span></div>
      <p class="hint" style="margin-bottom:8px">${STATE.lang==='en'?'Activities where you are personally the responsible or executor, on top of your general overview above.':'Actividades donde tú personalmente eres responsable o ejecutor, aparte de la vista general de arriba.'}</p>
      ${mine.sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,8).map(a=>activityMiniRow(a,true)).join('')}
    </div>`;
  })()}
  <div class="card" style="margin-top:14px">
    <div class="section-title">${STATE.lang==='en'?'Status by responsible':'Estado por responsable'}
      <input type="text" id="dashRespSearch" placeholder="${STATE.lang==='en'?'Search…':'Buscar…'}" value="${esc(STATE.dashRespQuery||'')}" oninput="STATE.dashRespQuery=this.value;renderAll()" style="max-width:200px;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12px;color:var(--text);text-transform:none;letter-spacing:0;font-family:var(--font-body)"></div>
    <div class="tbl-wrap" style="border:none;max-height:400px;overflow-y:auto"><table><thead><tr>
      <th>${t('th_responsible')}</th><th>${t('th_role')}</th><th>${t('th_discipline')}</th><th>${STATE.lang==='en'?'Total':'Total'}</th>
      <th>${STATE.lang==='en'?'Pending':'Pendientes'}</th><th>${t('kpi_overdue')}</th><th>${t('kpi_blocked')}</th><th>%</th></tr></thead><tbody>
    ${respRows.map(r=>`<tr class="row-click" onclick="STATE.filters={responsible:'${r.u.id}'};setView('actividades')">
      <td>${esc(userName(r.u.id))}</td><td>${roleLabel(normRole(r.u))}</td><td>${userDiscNames(r.u)}</td>
      <td>${r.total}</td><td>${r.pend}</td><td>${r.venc?`<span class="badge b-late"><span class="d"></span>${r.venc}</span>`:'0'}</td>
      <td>${r.block?`<span class="badge b-block"><span class="d"></span>${r.block}</span>`:'0'}</td><td>${r.pct}%</td></tr>`).join('') || `<tr><td colspan="8"><div class="empty">${t('empty_generic')}</div></td></tr>`}
    </tbody></table></div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="section-title">${STATE.lang==='en'?'Status by executor':'Estado por ejecutor'}
      <input type="text" id="dashExecSearch" placeholder="${STATE.lang==='en'?'Search…':'Buscar…'}" value="${esc(STATE.dashExecQuery||'')}" oninput="STATE.dashExecQuery=this.value;renderAll()" style="max-width:200px;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12px;color:var(--text);text-transform:none;letter-spacing:0;font-family:var(--font-body)"></div>
    <div class="tbl-wrap" style="border:none;max-height:400px;overflow-y:auto"><table><thead><tr>
      <th>${t('th_executor')}</th><th>${t('th_discipline')}</th><th>${STATE.lang==='en'?'Total':'Total'}</th>
      <th>${STATE.lang==='en'?'Pending':'Pendientes'}</th><th>${t('kpi_overdue')}</th><th>${t('kpi_blocked')}</th><th>%</th></tr></thead><tbody>
    ${execRows.map(r=>`<tr class="row-click" onclick="STATE.filters={executor:'${r.u.id}'};setView('actividades')">
      <td>${esc(userName(r.u.id))}</td><td>${userDiscNames(r.u)}</td>
      <td>${r.total}</td><td>${r.pend}</td><td>${r.venc?`<span class="badge b-late"><span class="d"></span>${r.venc}</span>`:'0'}</td>
      <td>${r.block?`<span class="badge b-block"><span class="d"></span>${r.block}</span>`:'0'}</td><td>${r.pct}%</td></tr>`).join('') || `<tr><td colspan="7"><div class="empty">${t('empty_generic')}</div></td></tr>`}
    </tbody></table></div>
  </div>
  <div class="grid grid-2" style="margin-top:14px">
    <div class="card"><div class="section-title">${t('nav_proximas')}</div>
      ${proximos.map(a=>activityMiniRow(a)).join('') || `<div class="empty">${t('empty_generic')}</div>`}</div>
    <div class="card"><div class="section-title">${t('nav_criticas')}</div>
      ${interven.map(a=>activityMiniRow(a)).join('') || `<div class="empty">${t('empty_generic')}</div>`}</div>
  </div>`;
}
function filterByDiscipline(discId){ STATE.filters={discipline:discId}; setView('actividades'); }
function filterByArea(areaId){ STATE.filters={area:areaId}; setView('actividades'); }
function dashLider(u){
  const mine=DB.activities.filter(a=>(a.responsibleIds||[]).includes(u.id));
  const created=mine.filter(a=>a.createdBy===u.id);
  const team=DB.users.filter(x=>userDiscOverlap(x,u) && x.role==='profesional');
  const myObs=otObsAssignedTo(u.id);
  return `
  <div class="pagehead"><div><h1>${userDiscNames(u)}</h1><div class="sub">${esc(userNameCargo(u.id))} · ${roleLabel(normRole(u)).toUpperCase()}</div></div>
    ${can('create')?`<button class="btn btn-primary" onclick="openNewActivity()">${t('btn_new_activity')}</button>`:''}</div>
  <div class="sig-strip"></div>
  ${kpiRow([
    {n:mine.length,l:t('kpi_total'),k:'accent'},{n:mine.filter(isOverdue).length,l:t('kpi_overdue'),k:'red'},
    {n:mine.filter(a=>a.status==='en_revision').length,l:t('kpi_review'),k:'accent'},{n:created.length,l:STATE.lang==='en'?'Created by me':'Creadas por mí',k:'green'},
  ])}
  <div class="grid grid-2">
    <div class="card"><div class="section-title">${STATE.lang==='en'?'Pending & in progress':'Pendientes y en curso'}</div>
      ${mine.filter(a=>!['completada','cancelada'].includes(a.status)).slice(0,8).map(a=>activityMiniRow(a)).join('')||`<div class="empty">${t('empty_generic')}</div>`}</div>
    <div class="card"><div class="section-title">${STATE.lang==='en'?'My team':'Mi equipo'} — ${team.length}</div>
      ${team.map(p=>{
        const pa=DB.activities.filter(a=>(a.executorIds||[]).includes(p.id));
        return `<div class="kv"><b>${esc(userNameCargo(p.id))}${isOnVacation(p)?' 🏖':''}</b><span>${pa.filter(a=>!['completada','cancelada'].includes(a.status)).length} · ${pa.filter(isOverdue).length} ${t('kpi_overdue').toLowerCase()}</span></div>`;
      }).join('')||`<div class="empty">${t('empty_generic')}</div>`}</div>
  </div>
  ${myObs.length?`<div class="card" style="margin-top:14px"><div class="section-title">${STATE.lang==='en'?'OT observations assigned to me':'Observaciones de Oficina Técnica asignadas a mí'} <span class="tag">${myObs.length}</span></div>
    ${myObs.map(({a,o})=>otObsMiniRow(a,o)).join('')}</div>`:''}`;
}
function dashProfesional(u){
  const mine=DB.activities.filter(a=>(a.executorIds||[]).includes(u.id) || (a.responsibleIds||[]).includes(u.id));
  const groups={ [t('kpi_overdue')]:mine.filter(isOverdue), [t('kpi_inprogress')]:mine.filter(a=>a.status==='en_curso'),
    [STATE.lang==='en'?'Upcoming':'Próximas']:mine.filter(a=>!['completada','cancelada'].includes(a.status)&&daysToDue(a)>=0&&daysToDue(a)<=7&&!isOverdue(a)),
    [t('kpi_completed')]:mine.filter(a=>a.status==='completada') };
  const myObs=otObsAssignedTo(u.id);
  return `
  <div class="pagehead"><div><h1>${STATE.lang==='en'?'My activities':'Mis actividades'}</h1><div class="sub">${esc(userNameCargo(u.id))} · ${userDiscNames(u)}</div></div></div>
  <div class="sig-strip"></div>
  ${kpiRow([
    {n:mine.filter(isOverdue).length,l:t('kpi_overdue'),k:'red'},{n:mine.filter(a=>a.status==='en_curso').length,l:t('kpi_inprogress'),k:'accent'},
    {n:mine.filter(a=>!['completada','cancelada'].includes(a.status)&&daysToDue(a)>=0&&daysToDue(a)<=7&&!isOverdue(a)).length,l:STATE.lang==='en'?'Next 7 days':'Próximos 7 días',k:'amber'},
    {n:mine.filter(a=>a.status==='completada').length,l:t('kpi_completed'),k:'green'},
  ])}
  ${Object.entries(groups).map(([label,list])=>list.length?`
    <div class="card" style="margin-bottom:14px"><div class="section-title">${label}</div>${list.map(a=>activityMiniRow(a,true)).join('')}</div>`:'').join('')}
  ${myObs.length?`<div class="card" style="margin-bottom:14px"><div class="section-title">${STATE.lang==='en'?'OT observations assigned to me':'Observaciones de Oficina Técnica asignadas a mí'} <span class="tag">${myObs.length}</span></div>
    ${myObs.map(({a,o})=>otObsMiniRow(a,o)).join('')}</div>`:''}
  ${mine.length===0 && !myObs.length?`<div class="empty"><div class="big">📭</div>${t('empty_generic')}</div>`:''}`;
}
function activityMiniRow(a,detailed){
  const vs=visualStatus(a);
  return `<div class="alert-line ${PRIORITY_CLASS[a.priority]||''}" onclick="setView('actividades','${a.id}')">
    <div class="ic">${a.priority==='P1'?'🔴':a.priority==='P2'?'🟠':a.priority==='P3'?'🔵':'🟢'}</div>
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between;gap:8px">
        <b style="font-size:12.5px">${esc(a.name)}</b>
        <span class="badge ${vs.cls}"><span class="d"></span>${vs.label}</span>
      </div>
      <div style="color:var(--text-faint);font-size:11.3px;font-family:var(--font-mono);margin-top:2px">
        ${a.code} · ${discNames(a.disciplines)} · ${fmtDate(a.dueDate)}${detailed?' · '+responsibleNamesShort(a):''}
      </div>
    </div></div>`;
}
function renderAlertList(list){
  if(!list.length) return `<div class="empty">${t('empty_alerts')}</div>`;
  return list.map(al=>`<div class="alert-line ${PRIORITY_CLASS[al.a.priority]||''}" onclick="setView('actividades','${al.a.id}')">
    <div class="ic">${al.icon}</div><div style="flex:1">${esc(al.text)}
      <div style="font-size:11px;color:var(--text-faint);margin-top:2px">${t('th_responsible')}: ${responsibleNames(al.a)||'—'}</div></div></div>`).join('');

/* Un líder ve, además de lo suyo, las notificaciones de los profesionales de su(s) disciplina(s) a cargo */
function notificationVisibleTo(n,u){
  const role=normRole(u);
  if(role==='subdirector'||role==='coordinador'||role==='visitante') return true;
  if(n.activityId){
    const a=byId(DB.activities,n.activityId);
    if(a){
      if(isLiderRole(role)){
        if((a.responsibleIds||[]).includes(u.id)) return true;
        if((a.disciplines||[]).some(d=>userHasDisc(u,d))) return true;
        if(a.createdBy===u.id) return true;
        const execUsers=(a.executorIds||[]).map(id=>byId(DB.users,id)).filter(Boolean);
        if(execUsers.some(eu=>userDiscOverlap(eu,u))) return true;
        return n.toUserIds? n.toUserIds.includes(u.id) : false;
      }
      if(role==='profesional'){
        return (a.executorIds||[]).includes(u.id) || (a.responsibleIds||[]).includes(u.id);
      }
    }
  }
  return n.toUserIds? n.toUserIds.includes(u.id) : (role==='subdirector'||role==='coordinador');
}

function applyFilters(list){
  const f=STATE.filters;
  const me=currentUser();
  return list.filter(a=>{
    if(f.mine && me && !((a.responsibleIds||[]).includes(me.id) || (a.executorIds||[]).includes(me.id))) return false;
    if(f.recientes){ const created=(a.history&&a.history[0])?a.history[0].date:null; const createdDateOnly=created?created.split(' ')[0]:null; if(!createdDateOnly || diffDays(iso(today()),createdDateOnly)>7) return false; }
    if(f.q){ const q=f.q.toLowerCase(); if(!(a.name.toLowerCase().includes(q)||a.code.toLowerCase().includes(q)||(a.description||'').toLowerCase().includes(q))) return false; }
    if(f.area && a.area!==f.area) return false;
    if(f.discipline && !(a.disciplines||[]).includes(f.discipline)) return false;
    if(f.front && a.front!==f.front) return false;
    if(f.otDocType && a.otDocType!==f.otDocType) return false;
    if(f.responsible && !(a.responsibleIds||[]).includes(f.responsible)) return false;
    if(f.executor && !(a.executorIds||[]).includes(f.executor)) return false;
    if(f.priority && a.priority!==f.priority) return false;
    if(f.status && a.status!==f.status) return false;
    return true;
  });
}

function toggleBulkSelectAct(id,checked){
  if(!STATE.bulkSelectedActs) STATE.bulkSelectedActs=[];
  if(checked){ if(!STATE.bulkSelectedActs.includes(id)) STATE.bulkSelectedActs.push(id); }
  else { STATE.bulkSelectedActs=STATE.bulkSelectedActs.filter(x=>x!==id); }
  renderAll();
}
function toggleBulkSelectAllActs(checked,idsCsv){
  const ids=idsCsv.split(',').filter(Boolean);
  STATE.bulkSelectedActs = checked ? [...new Set([...(STATE.bulkSelectedActs||[]),...ids])] : (STATE.bulkSelectedActs||[]).filter(x=>!ids.includes(x));
  renderAll();
}
function confirmBulkDeleteActivities(){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  const ids=STATE.bulkSelectedActs||[]; if(!ids.length) return;
  if(!confirm((STATE.lang==='en'?`Delete ${ids.length} selected activities (and their subtasks)? This cannot be undone.`:`¿Eliminar ${ids.length} actividades seleccionadas (y sus subtareas)? Esto no se puede deshacer.`))) return;
  const allToRemove=new Set();
  ids.forEach(id=>{ allToRemove.add(id); subtasksOf(id).forEach(s=>allToRemove.add(s.id)); });
  const affectedDiscs=new Set();
  DB.activities.forEach(a=>{ if(allToRemove.has(a.id)) (a.disciplines||[]).forEach(d=>affectedDiscs.add(d)); });
  const removedNotifIds=DB.notifications.filter(n=>n.activityId&&allToRemove.has(n.activityId)).map(n=>n.id);
  DB.activities=DB.activities.filter(a=>!allToRemove.has(a.id));
  DB.activities.forEach(a=>{ a.dependencies=a.dependencies.filter(d=>!allToRemove.has(d.id)); });
  DB.notifications=DB.notifications.filter(n=>!n.activityId||!allToRemove.has(n.activityId));
  markDeleted('activities',[...allToRemove]); markDeleted('notifications',removedNotifIds);
  affectedDiscs.forEach(d=>reindexDiscipline(d));
  STATE.bulkSelectedActs=[];
  saveDB(); toast(STATE.lang==='en'?`${allToRemove.size} activities deleted.`:`${allToRemove.size} actividades eliminadas.`); renderAll();
}
function activityTable(list){
  const {key,dir}=STATE.sort;
  const codeNum=a=>{ const n=parseInt((a.code||'').replace(/\D/g,''),10); return isNaN(n)?-1:n; };
  const sorted=[...list].sort((a,b)=>{ let va=a[key], vb=b[key];
    if(key==='responsibleId'){va=responsibleNames(a);vb=responsibleNames(b);}
    if(key==='discipline'){va=discNames(a.disciplines);vb=discNames(b.disciplines);}
    if(key==='code'||key==='_created'){
      // El código (ACT-0045) es un contador que SOLO avanza y nunca cambia una vez asignado
      // — a diferencia de la fecha de creación, es inmune a que un dispositivo con una
      // versión vieja de la app "revierta" el orden sin querer al sincronizar.
      va=codeNum(a); vb=codeNum(b);
    }
    if(va===undefined) va=''; if(vb===undefined) vb='';
    return va>vb?dir:va<vb?-dir:0; });
  if(!sorted.length) return `<div class="card"><div class="empty"><div class="big">◻</div>${t('empty_activities')}</div></div>`;
  const anyDelCol=sorted.some(a=>canDeleteRecord(a.createdBy));

  return `<div class="tbl-wrap"><table><thead><tr>

    <th onclick="sortBy('_created')" style="cursor:pointer" title="${STATE.lang==='en'?'Click to sort by creation date':'Clic para ordenar por fecha de creación'}">${STATE.lang==='en'?'Created':'Creación'}${sortIndicator('_created')}</th>
    <th onclick="sortBy('discipline')" style="cursor:pointer">${t('th_discipline')}${sortIndicator('discipline')}</th>
    <th onclick="sortBy('front')" style="cursor:pointer">${t('th_front')}</th>
    <th onclick="sortBy('responsibleId')" style="cursor:pointer">${t('th_responsible')}${sortIndicator('responsibleId')}</th>
    <th>${t('th_executor')}</th>

      return `<tr class="row-click" onclick="setView('actividades','${a.id}')">

      const stage=personFlowStage(a,pid); // la más relevante ahora mismo, solo para el estado principal
      const stageState=stage?a.flujo.estados[stage.id].estado:null;
      const estado=personEffectiveEstado(a,pid);
      const lockedByFlow = ['bloqueada','en_revision','aprobado'].includes(stageState);
      const canSet= canSetPersonStatus(a,pid) && !lockedByFlow;
      const canAct = stage && ['disponible','en_revision'].includes(stageState) && canApproveFlowStage(a,stage.id);

          ${stageState==='bloqueada'?`<div class="hint" style="text-align:right;color:var(--red)">🔒 ${STATE.lang==='en'?'Blocked by workflow — waiting on':'Bloqueado por el flujo — esperando a'}: ${flowPendingDepsNames(a,stage).map(esc).join(', ')||'—'}</div>`:''}
          ${stageState==='en_revision'?`<div class="hint" style="text-align:right;color:var(--amber)">🟡 ${STATE.lang==='en'?'In review':'En revisión'}</div>`:''}
          ${canAct?`<span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            ${stageState==='disponible'?`<button class="btn btn-sm btn-ghost" onclick="setFlowStageReview('${a.id}','${stage.id}')">👁 ${STATE.lang==='en'?'Review':'Revisar'}</button>`:''}
            <button class="btn btn-sm btn-primary" onclick="approvePersonFlowStage('${a.id}','${pid}','${stage.id}')">✓ ${STATE.lang==='en'?'Approve':'Aprobar'}</button>
            <button class="btn btn-sm btn-ghost" onclick="openReturnFlowStage('${a.id}','${stage.id}')">↩ ${STATE.lang==='en'?'Return':'Devolver'}</button>
          </span>`
            :(stage&&['disponible','en_revision'].includes(stageState)?`<span class="hint" style="text-align:right">${STATE.lang==='en'?'Only the discipline lead or Direction/Coordination can act here':'Solo el líder de la disciplina o Dirección/Coordinación pueden actuar aquí'}</span>`:'')}
          ${canSet?`<button class="btn btn-sm btn-ghost" onclick="openReassignActivity('${a.id}','${pid}')">🔁 ${STATE.lang==='en'?'Reassign to someone else…':'Reasignar a alguien más…'}</button>`:''}
        </span>
        ${stages.length>1?`<div style="width:100%;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-soft)">
          <div class="hint" style="margin-bottom:6px">${STATE.lang==='en'?`This discipline appears ${stages.length} times in the workflow — every occurrence is tracked and actionable on its own:`:`Esta disciplina participa ${stages.length} veces en el flujo — cada ocurrencia se sigue y se puede accionar por separado:`}</div>
          ${stages.map(st=>{
            const stSt=a.flujo.estados[st.id].estado;
            const ok2=canApproveFlowStage(a,st.id);
            const num=flowEtapaNivel(a.flujo.etapas,st.id,{})+1;
            const badgeCls= stSt==='aprobado'?'b-ok':stSt==='en_revision'?'b-warn':stSt==='disponible'?'b-review':'b-muted';
            return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0;font-size:12px">
              <span class="badge ${badgeCls}" style="min-width:170px"><span class="d"></span>#${num} ${esc(st.nombre)} — ${personEstadoLabel(stSt==='aprobado'?'completado':stSt==='bloqueada'?'bloqueado':stSt)}</span>
              ${['disponible','en_revision'].includes(stSt)?`
                ${stSt==='disponible'?`<button class="btn btn-ghost btn-sm" ${ok2?'':'disabled'} onclick="setFlowStageReview('${a.id}','${st.id}')">👁 ${STATE.lang==='en'?'Review':'Revisar'}</button>`:''}
                <button class="btn btn-sm btn-primary" ${ok2?'':'disabled'} onclick="approvePersonFlowStage('${a.id}','${pid}','${st.id}')">✓ ${STATE.lang==='en'?'Approve':'Aprobar'}</button>
                <button class="btn btn-ghost btn-sm" ${ok2?'':'disabled'} onclick="openReturnFlowStage('${a.id}','${st.id}')">↩ ${STATE.lang==='en'?'Return':'Devolver'}</button>
              `:''}
            </div>`;
          }).join('')}
        </div>`:''}
      </div>`;
    }).join('')}
  </div>`:''}`;
}

/* ---- ACTIVITY ACTIONS ---- */
function updateProgress(id,val){ const a=byId(DB.activities,id); const before=a.progress; a.progress=+val; pushHistory(a,currentUser(),'progress',before+'%',val+'%');
  if(+val!==before) notify(`📈 ${a.code}: ${STATE.lang==='en'?'progress':'avance'} ${before}% → ${val}%`,'nueva',a.id);
  saveDB(); renderTopbar(); }
function flujoBloqueaCompletar(a){ return !!(a.flujo && !a.flujo.etapas.every(e=>a.flujo.estados[e.id].estado==='aprobado')); }
function entregaMetodoLabel(k){
  const m={correo:{es:'Correo electrónico',en:'Email',zh:'电子邮件'},carta:{es:'Carta física',en:'Physical letter',zh:'纸质信函'},otro:{es:'Otro medio',en:'Other',zh:'其他方式'}};
  return (m[k]&&m[k][STATE.lang])||(m[k]&&m[k].es)||k;
}
function requestCompleteActivity(id){
  const a=byId(DB.activities,id);
  const pend=subtasksOf(a.id).filter(s=>s.status!=='completada'&&s.status!=='cancelada');
  if(pend.length){ toast(STATE.lang==='en'?'Cannot complete: pending subtasks remain.':'No se puede completar: existen subtareas pendientes.'); renderAll(); return; }
  if(flujoBloqueaCompletar(a)){ toast(STATE.lang==='en'?'Cannot complete: the workflow has not finished yet.':'No se puede completar: el flujo todavía no ha terminado.'); renderAll(); return; }
  autoMarkOwnPersonStatus(a);
  if(peopleBlockCompletar(a)){ toast(STATE.lang==='en'?'Cannot complete: not everyone involved has marked their part as done.':'No se puede completar: no todos los involucrados han marcado su parte como completada.'); saveDB(); renderAll(); return; }
  openModal(STATE.lang==='en'?'Complete activity':'Completar actividad',`
    <p class="hint" style="margin-bottom:10px">${STATE.lang==='en'?'Optional — how was this delivered or sent, for traceability?':'Opcional — ¿cómo se entregó o envió esto, para trazabilidad?'}</p>
    <div class="form-cols-2">
      <div class="form-row"><label>${STATE.lang==='en'?'Method':'Método'}</label><select id="cmp_metodo">
        <option value="">${STATE.lang==='en'?'— not applicable —':'— no aplica —'}</option>
        <option value="correo">${entregaMetodoLabel('correo')}</option>
        <option value="carta">${entregaMetodoLabel('carta')}</option>
        <option value="otro">${entregaMetodoLabel('otro')}</option>
      </select></div>
      <div class="form-row"><label>${STATE.lang==='en'?'Date':'Fecha'}</label><input type="date" id="cmp_fecha" value="${iso(today())}"></div>
    </div>
    <div class="form-row"><label>${STATE.lang==='en'?'Sent to (who / where)':'Enviado a (quién / dónde)'}</label><input type="text" id="cmp_destinatario" placeholder="${STATE.lang==='en'?'e.g. Interventoría, name, email…':'Ej. Interventoría, nombre, correo…'}"></div>
    <div class="form-row"><label>${STATE.lang==='en'?'Notes':'Notas'}</label><textarea id="cmp_notas"></textarea></div>

function doCompleteActivity(id){
  const a=byId(DB.activities,id); const before=a.status;
  const metodo=document.getElementById('cmp_metodo').value;
  const fecha=document.getElementById('cmp_fecha').value||iso(today());
  const destinatario=document.getElementById('cmp_destinatario').value.trim();
  const notas=document.getElementById('cmp_notas').value.trim();
  a.entrega={metodo,fecha,destinatario,notas};
  a.actualEndDate=iso(today()); a.progress=100; a.status='completada'; a.blocked=false;
  pushHistory(a,currentUser(),'status',before,'completada');
  if(metodo||destinatario) pushHistory(a,currentUser(),'entrega',null,`${metodo?entregaMetodoLabel(metodo):''}${destinatario?' — '+destinatario:''}${fecha?' ('+fmtDate(fecha)+')':''}`);
  notify(`${a.code}: ${statusLabel(before)} → ${statusLabel('completada')}`,'completada',a.id);
  reindexAffected(a); saveDB(); closeModal(); renderAll();
}
function updateStatus(id,val){
  const a=byId(DB.activities,id);
  if(val==='completada' && a.status!=='completada'){ requestCompleteActivity(id); return; }
  const before=a.status;
  if(val==='completada'){
    const pend=subtasksOf(a.id).filter(s=>s.status!=='completada'&&s.status!=='cancelada');
    if(pend.length){ toast(STATE.lang==='en'?'Cannot complete: pending subtasks remain.':'No se puede completar: existen subtareas pendientes.'); renderAll(); return; }
    if(flujoBloqueaCompletar(a)){ toast(STATE.lang==='en'?'Cannot complete: the workflow has not finished yet.':'No se puede completar: el flujo todavía no ha terminado.'); renderAll(); return; }
    autoMarkOwnPersonStatus(a);
    if(peopleBlockCompletar(a)){ toast(STATE.lang==='en'?'Cannot complete: not everyone involved has marked their part as done.':'No se puede completar: no todos los involucrados han marcado su parte como completada.'); renderAll(); return; }
    a.actualEndDate=iso(today()); a.progress=100;
  }
  a.status=val; a.blocked=(val==='bloqueada'); pushHistory(a,currentUser(),'status',before,val);
  notify(`${a.code}: ${statusLabel(before)} → ${statusLabel(val)}`, val==='completada'?'completada':'nueva', a.id);
  if(val==='bloqueada') notify(`🟠 ${a.code} · ${a.name}`,'bloqueo',a.id);
  reindexAffected(a);
  saveDB(); renderAll();
}

  const a=byId(DB.activities,id); if(!a.comments) a.comments=[]; a.comments.push({userId:currentUser().id,text:inp.value.trim(),date:nowStamp()}); saveDB(); renderAll(); }
function addDoc(id){ const n=document.getElementById('docName').value.trim(), u=document.getElementById('docUrl').value.trim();
  if(!n||!u) return; const a=byId(DB.activities,id); if(!a.documents) a.documents=[]; a.documents.push({name:n,url:u}); saveDB(); renderAll(); }
function removeDoc(id,i){ const a=byId(DB.activities,id); a.documents.splice(i,1); saveDB(); renderAll(); }

function doRecalc(id){ const moved=recalcFrom(id); saveDB(); toast((STATE.lang==='en'?'Activities recalculated: ':'Actividades recalculadas: ')+moved); renderAll(); }
function confirmDeleteActivity(id){
  const a=byId(DB.activities,id); if(!a) return;
  if(!canDeleteRecord(a.createdBy)){ toast(t('no_permission')); return; }
  const subs=subtasksOf(id);
  const msg=(STATE.lang==='en'?'Delete activity ':'Eliminar la actividad ')+a.code+(subs.length?(STATE.lang==='en'?` and its ${subs.length} subtasks`:` y sus ${subs.length} subtareas`):'')+'?';
  if(!confirm(msg)) return;
  const idsToRemove=new Set([id,...subs.map(s=>s.id)]);
  const affectedDiscs=new Set(a.disciplines||[]);
  const removedNotifIds=DB.notifications.filter(n=>n.activityId&&idsToRemove.has(n.activityId)).map(n=>n.id);
  DB.activities=DB.activities.filter(x=>!idsToRemove.has(x.id));
  DB.activities.forEach(x=>{ x.dependencies=x.dependencies.filter(d=>!idsToRemove.has(d.id)); });
  DB.notifications=DB.notifications.filter(n=>!n.activityId||!idsToRemove.has(n.activityId)); // una actividad eliminada ya no debe aparecer en notificaciones
  markDeleted('activities',[...idsToRemove]); markDeleted('notifications',removedNotifIds);
  affectedDiscs.forEach(d=>reindexDiscipline(d)); saveDB();
  if(STATE.activityId && idsToRemove.has(STATE.activityId)) STATE.activityId=null;
  toast(STATE.lang==='en'?'Activity deleted.':'Actividad eliminada.'); renderAll();
}

function onNewActivityFlowChange(){

function saveEditActivity(id){
  const a=byId(DB.activities,id); const beforeDue=a.dueDate; const beforeCode=a.code;
  if(canManageUsers() && document.getElementById('e_code')){
    const newCode=document.getElementById('e_code').value.trim();
    if(newCode && newCode!==a.code){
      if(DB.activities.some(x=>x.id!==id && x.code===newCode)){ toast(STATE.lang==='en'?'That code is already in use by another activity.':'Ese código ya lo usa otra actividad.'); return; }
      a.code=newCode;
    }
  }
  a.name=document.getElementById('e_name').value.trim(); a.description=document.getElementById('e_desc').value.trim();
  a.area=document.getElementById('e_area').value;
  a.otDocType= document.getElementById('e_ot_type')?document.getElementById('e_ot_type').value:'';
  a.otConsecutivo= document.getElementById('e_ot_consec')?document.getElementById('e_ot_consec').value.trim():'';
  a.front=document.getElementById('e_front').value; a.disciplines=ppGetValue('e_disc');
  a.type=document.getElementById('e_type').value;
  a.responsibleIds=ppGetValue('e_resp');
  a.executorIds=ppGetValue('e_exec');
  a.startDate=document.getElementById('e_start').value; a.duration=+document.getElementById('e_dur').value;
  a.dueDate=document.getElementById('e_due').value;
  const conflicts=findScheduleConflicts([...a.responsibleIds,...a.executorIds],a.startDate,computedEnd(a),a.id);
  if(conflicts.length){
    const list=conflicts.map(c=>c.code+' ('+c.name+')').join(', ');
    if(!confirm((STATE.lang==='en'?'⚠ Schedule conflict with: ':'⚠ Conflicto de agenda con: ')+list+'. '+(STATE.lang==='en'?'Save anyway?':'¿Guardar de todas formas?'))) return;
  }
  if(a.dueDate!==beforeDue){ pushHistory(a,currentUser(),'dueDate',beforeDue,a.dueDate); notify(`🔵 ${a.code}: ${fmtDate(beforeDue)} → ${fmtDate(a.dueDate)}`,'fecha',a.id); }
  else { pushHistory(a,currentUser(),'edited',null,null); notify(`✏️ ${a.code}: ${STATE.lang==='en'?'activity updated':'actividad actualizada'}`,'nueva',a.id); }
  if(a.code!==beforeCode){ pushHistory(a,currentUser(),'code',beforeCode,a.code); notify(`🔤 ${beforeCode} → ${a.code}: ${STATE.lang==='en'?'code changed':'código cambiado'}`,'nueva',a.id); }
  reindexAffected(a);
  saveDB(); closeModal(); renderAll();
}

    // Vista plana: todas las actividades de esa persona juntas, sin separar por disciplina
    // — así se puede ver y reordenar su cola completa de una sola vez.
    let combined=DB.activities.filter(a=>!a.parentId && !['completada','cancelada'].includes(a.status) && (a.responsibleIds||[]).includes(respFilter));
    if(discFilter) combined=combined.filter(a=>(a.disciplines||[]).includes(discFilter));
    if(frontFilter) combined=combined.filter(a=>a.front===frontFilter);
    if(otFilter) combined=combined.filter(a=>a.otDocType===otFilter);
    const tier=a=> a.blocked?2 : (a.status==='en_revision'?1:0);
    combined.sort((a,b)=> tier(a)-tier(b) || ((((a.priorityOrder||{})[a.disciplines[0]])||9999) - (((b.priorityOrder||{})[b.disciplines[0]])||9999)));
    const idsCsv=combined.map(a=>a.id).join(',');
    return introHtml+filterBarHtml+(combined.length?`<div class="card" style="margin-bottom:14px">
      <div class="section-title">${esc(userName(respFilter))} <span class="tag">${combined.length}</span></div>
      ${combined.map((a,i)=>rowHtml(a,i+1,`moveActivityFiltered('${a.id}',-1,'${a.disciplines[0]}','${idsCsv}')`,`moveActivityFiltered('${a.id}',1,'${a.disciplines[0]}','${idsCsv}')`)).join('')}
    </div>`:`<div class="card"><div class="empty">${t('empty_generic')}</div></div>`);
  }
  let discsToShow = discFilter? DB.disciplines.filter(d=>d.id===discFilter) : sortedDisciplines();
  const u=currentUser(); const role=normRole(u);
  if(isLiderRole(role) && userDiscIds(u).length && !discFilter) discsToShow=DB.disciplines.filter(d=>userDiscIds(u).includes(d.id));
  const sections=discsToShow.map(d=>{
    let list=activePrioritizedByDisc(d.id);
    if(frontFilter) list=list.filter(a=>a.front===frontFilter);
    if(otFilter) list=list.filter(a=>a.otDocType===otFilter);
    return {d,list};
  }).filter(s=>s.list.length);
  return introHtml+filterBarHtml+(sections.length? sections.map(sec=>`
    <div class="card" style="margin-bottom:14px">
      <div class="section-title">${esc(sec.d.name)} <span style="display:flex;gap:8px;align-items:center"><span class="tag">${sec.list.length}</span>${can('edit')?`<button class="btn btn-sm btn-ghost" onclick="sortDisciplineByDueDate('${sec.d.id}')">${STATE.lang==='en'?'↕ Sort by due date':'↕ Ordenar por vencimiento'}</button>`:''}</span></div>
      ${sec.list.map((a,i)=>rowHtml(a,(a.priorityOrder&&a.priorityOrder[sec.d.id])||'—',`moveActivityInDisc('${a.id}',-1,'${sec.d.id}')`,`moveActivityInDisc('${a.id}',1,'${sec.d.id}')`)).join('')}
    </div>`).join('') : `<div class="card"><div class="empty">${t('empty_generic')}</div></div>`);
}

/* ============================ GANTT ============================ */
function viewGantt(){
  const range=STATE.ganttRange;
  const list=applyFilters(scopeForUser(currentUser()).filter(a=>!a.parentId)).slice(0,30);
  const start=addDays(today(),-5); const end=addDays(start,range); const totalDays=diffDays(end,start);
  const todayPct=diffDays(iso(today()),start)/totalDays*100;
  return `<div class="pagehead"><div><h1>${t('nav_gantt')}</h1><div class="sub">${fmtDate(start)} — ${fmtDate(end)}</div></div>
    <div class="filterbar">${[30,45,90].map(r=>`<button class="btn btn-sm ${range===r?'btn-primary':''}" onclick="STATE.ganttRange=${r};renderAll()">${r}d</button>`).join('')}</div></div>
    ${activityFilterBar()}
    <div class="card tight">
    ${list.map(a=>{
      const s=Math.max(0,diffDays(a.startDate,start)); const e=Math.min(totalDays,diffDays(computedEnd(a),start));
      const left=s/totalDays*100, width=Math.max(1,(e-s)/totalDays*100);
      const color= a.status==='completada'?'var(--green)': isOverdue(a)?'var(--red)': a.blocked?'var(--purple)': PRIORITY_COLOR[a.priority]||'var(--accent)';
      return `<div class="gantt-row">
        <div class="gantt-label" onclick="setView('actividades','${a.id}')" style="cursor:pointer">
          ${esc(a.name.length>34?a.name.slice(0,34)+'…':a.name)}<small>${a.code} · ${discNames(a.disciplines)}</small></div>
        <div class="gantt-track"><div class="gantt-grid-lines">${Array.from({length:Math.round(totalDays/7)}).map(()=>'<div></div>').join('')}</div>
          <div class="gantt-today" style="left:${todayPct}%"></div>
          <div class="gantt-bar" style="left:${left}%;width:${width}%;background:${color}" title="${a.name}"><span>${a.progress}%</span></div></div>
      </div>`;
    }).join('') || `<div class="empty">${t('empty_activities')}</div>`}
    </div>`;
}

function viewCalendario(){
  const y=STATE.calYear, m=STATE.calMonth;

  const daysInMonth=new Date(y,m+1,0).getDate(); const cells=[];
  for(let i=0;i<startWeekDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  const monthName=first.toLocaleDateString(STATE_LOCALE(),{month:'long',year:'numeric'});
  const acts=DB.activities.filter(a=>a.status!=='cancelada');
  const dows=STATE.lang==='en'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const showVac=STATE.calShowVacations!==false;
  const vacUserFilter=STATE.calVacUser||'';
  const usersWithVac=DB.users.filter(u=>(u.vacations||[]).length);
  const usersOnVacationOn=(dateStr)=> DB.users.filter(u=> (!vacUserFilter||u.id===vacUserFilter) && isOnVacation(u,dateStr));

      ${showVac?`<select onchange="STATE.calVacUser=this.value;renderAll()"><option value="">${STATE.lang==='en'?'Everyone':'Todos'}</option>${usersWithVac.map(u=>`<option value="${u.id}" ${vacUserFilter===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`:''}
    </div></div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(d=>{ if(!d) return '<div class="cal-cell out"></div>';
        const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const isToday=dateStr===iso(today());
        const dayActs=acts.filter(a=>a.dueDate===dateStr);

          ${onVac.slice(0,2).map(u=>`<div class="cal-dot" style="background:var(--amber-dim);color:var(--amber);font-weight:600" title="${STATE.lang==='en'?'On vacation':'De vacaciones'}: ${esc(u.name)}">🏖 ${esc(u.name.split(' ')[0])}</div>`).join('')}
          ${onVac.length>2?`<div class="cal-dot" style="color:var(--amber)">🏖 +${onVac.length-2}</div>`:''}
          ${socialsToday.map(s=>`<div class="cal-dot" style="background:var(--accent-soft);color:var(--accent);font-weight:600" onclick="event.stopPropagation();openEditSocial('${s.id}')" title="${STATE.lang==='en'?'Community engagement':'Socialización'}: ${esc(s.nombre)}">🗣️ ${esc(s.nombre)}</div>`).join('')}
          ${dayActs.slice(0,3).map(a=>`<div class="cal-dot" style="background:${a.priority==='P1'?'var(--red-dim)':'var(--panel-3)'};color:${a.priority==='P1'?'var(--red)':'var(--text-dim)'}" onclick="setView('actividades','${a.id}')" title="${esc(a.name)}">${esc(a.name)}</div>`).join('')}

/* ============================ GESTIÓN CON TERCEROS ============================ */
function asistenciaEstado(x){
  if(x.estado==='cerrada') return 'cerrada';
  if(x.fechaRespuestaReal) return 'respondida';
  if(x.fechaRespuestaEsperada && iso(today())>x.fechaRespuestaEsperada) return 'vencida';
  return 'enviada';
}
function asistenciaEstadoLabel(key){
  const m={enviada:{es:'Enviada',en:'Sent'},respondida:{es:'Respondida',en:'Responded'},vencida:{es:'Vencida',en:'Overdue'},cerrada:{es:'Cerrada',en:'Closed'}};
  return (m[key]&&m[key][STATE.lang])||(m[key]&&m[key].es)||key;
}
function asistenciaBadgeClass(key){ return {enviada:'b-muted',respondida:'b-ok',vencida:'b-late',cerrada:'b-block'}[key]||'b-muted'; }
function viewTerceros(){
  let list=[...DB.asistencias].sort((a,b)=>{
    const ea=asistenciaEstado(a), eb=asistenciaEstado(b);
    const order={vencida:0,enviada:1,respondida:2,cerrada:3};
    return (order[ea]-order[eb]) || b.fechaEnvio.localeCompare(a.fechaEnvio);
  });
  const vencidas=list.filter(x=>asistenciaEstado(x)==='vencida');
  const fq=STATE.terceroQ||'', fTercero=STATE.terceroFilterId||'';
  if(fTercero) list=list.filter(x=>x.terceroId===fTercero);
  if(fq){ const q=fq.toLowerCase(); list=list.filter(x=>x.consecutivo.toLowerCase().includes(q)||terceroName(x.terceroId).toLowerCase().includes(q)); }
  return `<div class="pagehead"><div><h1>${t('nav_terceros')}</h1><div class="sub">${STATE.lang==='en'?'Requests for technical assistance sent to contractors and entities':'Solicitudes de asistencia técnica enviadas a contratistas y entidades'}</div></div>

/* ============================ GESTOR DE CONTRATOS ============================ */
const CURRENCIES=['COP','USD','EUR'];
function contratoDiasRestantes(c){ if(!c.fechaFin) return null; return diffDays(c.fechaFin, iso(today())); }
function contratoEstadoCalc(c){
  if(c.estado==='liquidado') return 'liquidado';
  if(c.estado==='suspendido') return 'suspendido';
  const d=contratoDiasRestantes(c);
  if(d===null) return 'vigente';
  if(d<0) return 'vencido';
  if(d<=30) return 'por_vencer';
  return 'vigente';
}
function contratoEstadoLabel(key){
  const m={vigente:{es:'Vigente',en:'Active'},por_vencer:{es:'Por vencer',en:'Expiring soon'},vencido:{es:'Vencido',en:'Expired'},
    liquidado:{es:'Liquidado',en:'Settled'},suspendido:{es:'Suspendido',en:'Suspended'}};
  return (m[key]&&m[key][STATE.lang])||(m[key]&&m[key].es)||key;
}
function contratoBadgeClass(key){ return {vigente:'b-ok',por_vencer:'b-warn',vencido:'b-late',liquidado:'b-muted',suspendido:'b-block'}[key]||'b-muted'; }
function fmtMoney(v,curr){
  if(v===null||v===undefined||v==='') return '—';
  curr=curr||'COP';
  const sym={COP:'$',USD:'US$',EUR:'€'}[curr]||curr+' ';
  return sym+Number(v).toLocaleString(STATE_LOCALE());
}
function valoresDisplay(c){ return (c.valores&&c.valores.length)? c.valores.map(v=>fmtMoney(v.monto,v.moneda)).join(' + ') : '—'; }
function valorFinalPorMoneda(c){
  const sums={};
  (c.valores||[]).forEach(v=>{ sums[v.moneda]=(sums[v.moneda]||0)+Number(v.monto||0); });
  return sums;
}
function valorFinalDisplay(c){
  const sums=valorFinalPorMoneda(c); const keys=Object.keys(sums);
  if(!keys.length) return '—';
  return keys.map(k=>fmtMoney(sums[k],k)).join(' + ');
}
function valorTotalTodosContratos(){
  const sums={};
  DB.contratos.forEach(c=>{ (c.valores||[]).forEach(v=>{ sums[v.moneda]=(sums[v.moneda]||0)+Number(v.monto||0); }); });
  return sums;
}
function viewContratos(){
  if(!canManageUsers()) return `<div class="pagehead"><div><h1>${t('nav_contratos')}</h1></div></div><div class="card"><div class="empty">${t('no_permission')}</div></div>`;
  const list=[...DB.contratos].sort((a,b)=>{
    const order={vencido:0,por_vencer:1,vigente:2,suspendido:3,liquidado:4};
    return (order[contratoEstadoCalc(a)]-order[contratoEstadoCalc(b)]) || (a.fechaFin||'').localeCompare(b.fechaFin||'');
  });
  const alertas=list.filter(c=>['por_vencer','vencido'].includes(contratoEstadoCalc(c)));
  const totales=valorTotalTodosContratos(); const totalKeys=Object.keys(totales);
  return `<div class="pagehead"><div><h1>${t('nav_contratos')}</h1><div class="sub">${STATE.lang==='en'?'Direction & Coordination only':'Solo Dirección y Coordinación'}</div></div>
    <button class="btn btn-primary" onclick="openNewContrato()">${STATE.lang==='en'?'+ New contract':'+ Nuevo contrato'}</button></div>
    <div class="grid grid-3" style="margin-bottom:14px">

      ${alertas.map(c=>{ const d=contratoDiasRestantes(c); const est=contratoEstadoCalc(c);
        return `<div class="alert-line"><div class="ic">${est==='vencido'?'🔴':'🟠'}</div><div>${c.consecutivo} · ${terceroName(c.terceroId)} — ${esc(c.objeto)} (${d<0?(STATE.lang==='en'?`expired ${Math.abs(d)}d ago`:`venció hace ${Math.abs(d)}d`):(STATE.lang==='en'?`${d}d left`:`${d}d restantes`)})</div></div>`;
      }).join('')}
      </div>`:''}
    <div class="tbl-wrap"><table><thead><tr><th>${STATE.lang==='en'?'Consecutive':'Consecutivo'}</th><th>${STATE.lang==='en'?'Third party':'Tercero'}</th><th>${STATE.lang==='en'?'Object':'Objeto'}</th>
      <th>${STATE.lang==='en'?'Final value':'Valor final'}</th><th>${STATE.lang==='en'?'Start':'Inicio'}</th><th>${STATE.lang==='en'?'End':'Fin'}</th><th>${STATE.lang==='en'?'Amendments':'Otrosíes'}</th><th>${STATE.lang==='en'?'File':'Enlace'}</th><th>${t('th_status')}</th><th></th></tr></thead><tbody>
    ${list.map(c=>{ const est=contratoEstadoCalc(c);
      return `<tr><td class="tag">${esc(c.consecutivo)}</td><td>${esc(terceroName(c.terceroId))}</td><td>${esc(c.objeto)}</td>
      <td><b>${valorFinalDisplay(c)}</b>${(c.otrosi||[]).some(o=>o.monto)?`<div style="font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono)">${STATE.lang==='en'?'incl. amendments':'incl. otrosíes'}</div>`:''}</td><td>${fmtDate(c.fechaInicio)}</td><td>${fmtDate(c.fechaFin)}</td><td>${(c.otrosi||[]).length}</td>
      <td>${c.enlace?`<a href="${esc(c.enlace)}" target="_blank" rel="noopener">🔗 ${STATE.lang==='en'?'Open':'Abrir'}</a>`:'—'}</td>
      <td><span class="badge ${contratoBadgeClass(est)}"><span class="d"></span>${contratoEstadoLabel(est)}</span></td>
      <td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="openEditContrato('${c.id}')">${t('btn_edit')}</button>
      <button class="btn btn-ghost btn-sm" onclick="openAddOtrosi('${c.id}')">${STATE.lang==='en'?'+ Amendment':'+ Otrosí'}</button>
      ${est==='suspendido'?`<button class="btn btn-ghost btn-sm" onclick="reactivarContrato('${c.id}')">${STATE.lang==='en'?'Reactivate':'Reactivar'}</button>`
        :est!=='liquidado'?`<button class="btn btn-ghost btn-sm" onclick="markSuspendido('${c.id}')">${STATE.lang==='en'?'Suspend':'Suspender'}</button>`:''}
      ${est!=='liquidado'?`<button class="btn btn-ghost btn-sm" onclick="markLiquidado('${c.id}')">${STATE.lang==='en'?'Settle':'Liquidar'}</button>`:''}
      <button class="btn btn-ghost btn-sm" onclick="deleteContrato('${c.id}')">✕</button></td></tr>`;
    }).join('') || `<tr><td colspan="10"><div class="empty">${t('empty_generic')}</div></td></tr>`}
    </tbody></table></div>`;
}

function createContrato(){
  const objeto=document.getElementById('ct_objeto').value.trim(); if(!objeto) return;
  DB.counters.contrato=(DB.counters.contrato||1)+1;
  const monto=+document.getElementById('ct_valor').value||0;
  DB.contratos.push({id:uid('CON'),consecutivo:document.getElementById('ct_consec').value.trim(),terceroId:document.getElementById('ct_tercero').value,
    objeto, valores: monto?[{id:uid('VAL'),monto,moneda:document.getElementById('ct_moneda').value}]:[], fechaInicio:document.getElementById('ct_inicio').value,
    fechaFin:document.getElementById('ct_fin').value, enlace:document.getElementById('ct_enlace').value.trim(), estado:'vigente', notas:'', otrosi:[]});
  saveDB(); closeModal(); toast(STATE.lang==='en'?'Contract created.':'Contrato creado.'); renderAll();
}

function saveOtrosi(id){
  const c=byId(DB.contratos,id);
  const desc=document.getElementById('ot_desc').value.trim(); if(!desc){ toast(STATE.lang==='en'?'Description is required.':'La descripción es obligatoria.'); return; }
  const monto=+document.getElementById('ot_monto').value||0; const moneda=document.getElementById('ot_moneda').value;
  const nuevaFechaFin=document.getElementById('ot_fechafin').value;
  const entry={id:uid('OTR'),fecha:document.getElementById('ot_fecha').value,descripcion:desc,monto:monto||null,moneda:monto?moneda:null,
    nuevaFechaFin:(nuevaFechaFin&&nuevaFechaFin!==c.fechaFin)?nuevaFechaFin:null};
  c.otrosi=c.otrosi||[]; c.otrosi.push(entry);
  if(monto){ c.valores=c.valores||[]; c.valores.push({id:uid('VAL'),monto,moneda}); }
  if(entry.nuevaFechaFin){ c.fechaFin=entry.nuevaFechaFin; if(c.estado==='liquidado'||c.estado==='suspendido') c.estado='vigente'; }
  saveDB(); closeModal(); toast(STATE.lang==='en'?'Amendment recorded.':'Otrosí registrado.'); renderAll();
}

/* ============================ GESTOR OFICINA TÉCNICA ============================ */
function otActivities(){ return DB.activities.filter(a=>!a.parentId && a.area==='oficina_tecnica'); }
function otObsPending(a){ return (a.otObservaciones||[]).filter(o=>!o.atencion).length; }
function rondaEstado(r){ if(r.fechaRespuestaReal) return 'respondida'; if(r.fechaRespuestaEsperada && iso(today())>r.fechaRespuestaEsperada) return 'vencida'; return 'enviada'; }
function otRondaVencidaCount(a){ return ((a.otTracking&&a.otTracking.rondas)||[]).filter(r=>rondaEstado(r)==='vencida').length; }
function otEstadoResumen(a){
  const tk=a.otTracking||{};
  if(a.status==='completada') return {label:STATE.lang==='en'?'Closed':'Cerrado',cls:'b-ok'};
  if(otObsPending(a)>0) return {label:STATE.lang==='en'?'Pending observations':'Con observaciones pendientes',cls:'b-late'};
  if(otRondaVencidaCount(a)>0) return {label:STATE.lang==='en'?'Review round overdue':'Ronda de revisión vencida',cls:'b-late'};
  if(tk.requiereInterventoria){
    const rondas=tk.rondas||[];
    const last=rondas[rondas.length-1];
    if(last && !last.fechaRespuestaReal) return {label:(STATE.lang==='en'?'Round ':'Ronda ')+last.numero+' '+(STATE.lang==='en'?'in review':'en revisión'),cls:'b-review'};
    if(last && last.fechaRespuestaReal) return {label:STATE.lang==='en'?'Reviewed by inspection':'Revisado por interventoría',cls:'b-ok'};
    if(tk.fechaEnvioInterventoria) return {label:STATE.lang==='en'?'Sent to inspection':'Enviado a interventoría',cls:'b-warn'};
  }
  if(tk.fechaEnvioConstruccion) return {label:STATE.lang==='en'?'Sent to construction':'Enviado a construcción',cls:'b-muted'};
  return {label:STATE.lang==='en'?'In progress':'En elaboración',cls:'b-muted'};
}

/* Si la observación ya tiene ejecutor(es) asignado(s), SOLO ellos (o Dirección/Coordinación)
   pueden responderla — el responsable general de la actividad ya no puede hacerlo por otros.
   Si todavía no está asignada, el responsable general puede responder mientras tanto. */
function canRespondObs(a,o){
  const u=currentUser(); const role=normRole(u);
  if(role==='subdirector'||role==='coordinador') return true;
  if((o.executorIds||[]).length) return (o.executorIds||[]).includes(u.id);
  if((a.responsibleIds||[]).includes(u.id)) return true;
  return false;
}
function saveOtAtencion(aid,obsId){

  if(!canRespondObs(a,obs)){ toast(t('no_permission')); return; }
  const val=document.getElementById('ot_at_'+obsId).value.trim();
  obs.atencion=val; obs.fechaAtencion= val? (document.getElementById('ot_atfecha_'+obsId).value||iso(today())) : '';
  obs.atendidoPor= val? currentUser().id : '';
  saveDB(); toast(STATE.lang==='en'?'Response saved.':'Atención guardada.'); renderAll();
}
/* Comprime y reduce el tamaño de una imagen antes de guardarla — las fotos que suben los
   teléfonos pueden pesar varios MB cada una, y como toda la base de datos se transfiere
   completa en cada sincronización, eso es lo que más rápido consume el límite de egress
   de Supabase con muchas personas subiendo fotos. Esto las deja en un tamaño razonable
   para verse bien en pantalla sin pesar de más. */
function compressImageFile(file,maxDim,quality){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        try{ resolve(canvas.toDataURL('image/jpeg',quality)); }catch(err){ resolve(e.target.result); } // si algo falla, se usa la original
      };
      img.onerror=()=>resolve(e.target.result);
      img.src=e.target.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}
function addObsImages(aid,obsId,input){
  const a=byId(DB.activities,aid); const obs=(a.otObservaciones||[]).find(o=>o.id===obsId); if(!obs) return;
  if(!canRespondObs(a,obs)){ toast(t('no_permission')); return; }
  const files=[...input.files]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    compressImageFile(f,1280,0.72).then(dataUrl=>{
      if(dataUrl){ obs.imagenes=obs.imagenes||[]; obs.imagenes.push({id:uid('IMG'),dataUrl,name:f.name}); }
      pending--; if(pending===0){ saveDB(); renderAll(); }
    });
  });
}
function removeObsImage(aid,obsId,imgId){
  const a=byId(DB.activities,aid); const obs=(a.otObservaciones||[]).find(o=>o.id===obsId); if(!obs) return;
  if(!canRespondObs(a,obs)){ toast(t('no_permission')); return; }

function ultimaRespuestaInterventoria(a){
  const rondas=(a.otTracking&&a.otTracking.rondas)||[];
  const answered=rondas.filter(r=>r.fechaRespuestaReal).sort((x,y)=>x.fechaRespuestaReal.localeCompare(y.fechaRespuestaReal));
  return answered.length? answered[answered.length-1].fechaRespuestaReal : '';
}
function addExcelLogoHeader(wb,ws){
  if(!DB.settings.logo) return;
  try{
    const m=DB.settings.logo.match(/^data:image\/(\w+);base64,/);
    const ext=m&&m[1]==='jpeg'?'jpeg':'png';
    const imgId=wb.addImage({base64:DB.settings.logo,extension:ext});
    ws.spliceRows(1,0,[]);
    ws.getRow(1).height=40;
    ws.addImage(imgId,{tl:{col:0,row:0},ext:{width:130,height:36}});
  }catch(e){}
}
async function exportOtReporteExcel(aid){
  const a=byId(DB.activities,aid);
  if(typeof ExcelJS==='undefined'){ toast(STATE.lang==='en'?'Excel library failed to load (check your internet connection).':'No se pudo cargar la librería de Excel (revisa tu conexión a internet).'); return; }
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(STATE.lang==='en'?'Report':'Reporte');
  ws.columns=[
    {header:STATE.lang==='en'?'Observation date':'Fecha de observación',key:'f1',width:16},
    {header:STATE.lang==='en'?'Observation':'Observación',key:'f2',width:42},
    {header:STATE.lang==='en'?'Source':'Fuente',key:'f3',width:14},
    {header:STATE.lang==='en'?'Response date':'Fecha de respuesta',key:'f4',width:16},
    {header:STATE.lang==='en'?'Response owner':'Responsable de respuesta',key:'f5',width:24},
    {header:STATE.lang==='en'?'Response':'Respuesta',key:'f6',width:48},
  ];
  ws.getRow(1).font={bold:true};
  const obsList=a.otObservaciones||[];
  for(let i=0;i<obsList.length;i++){
    const o=obsList[i];
    const row=ws.addRow({f1:fmtDate(o.fecha),f2:o.texto,f3:o.fuente||'',f4:o.fechaAtencion?fmtDate(o.fechaAtencion):'',
      f5:o.atendidoPor?userName(o.atendidoPor):'',f6:o.atencion||''});
    row.alignment={wrapText:true,vertical:'top'};
    if(o.imagenes && o.imagenes.length){
      row.height=72;
      const img=o.imagenes[0];
      const m=img.dataUrl.match(/^data:image\/(\w+);base64,/);
      const ext=m&&m[1]==='jpeg'?'jpeg':'png';
      try{
        const imgId=wb.addImage({base64:img.dataUrl,extension:ext});

/* ============================ AVANCE DE DISEÑO ============================ */
const AV_ESTADOS=['bloqueada','en_revision','proceso_no_objecion','no_objetado'];
const AV_COLOR={bloqueada:'#DC2626',en_revision:'#F59E0B',proceso_no_objecion:'#2563EB',no_objetado:'#16A34A'};
const AV_CLASS={bloqueada:'b-late',en_revision:'b-warn',proceso_no_objecion:'b-review',no_objetado:'b-ok'};
function avEstadoLabel(key){
  const m={
    bloqueada:{es:'Bloqueada',en:'Blocked',zh:'已阻塞'},
    en_revision:{es:'En revisión',en:'In review',zh:'审核中'},
    proceso_no_objecion:{es:'Proceso no objeción',en:'No-objection process',zh:'无异议流程中'},
    no_objetado:{es:'No objetado (aprobado)',en:'No objections (approved)',zh:'无异议（已批准）'},
  };
  return (m[key]&&m[key][STATE.lang])||(m[key]&&m[key].es)||key;
}
function avTipoName(id){ return (byId(DB.avanceTipos,id)||{}).name||'—'; }
function avTipoIcon(id){ return (byId(DB.avanceTipos,id)||{}).icon||'📐'; }
/* El estado de un elemento se calcula a partir de sus disciplinas: si alguna está
   bloqueada, el elemento está bloqueado; si no, si alguna sigue en revisión, etc.
   Solo cuando TODAS sus disciplinas están "No objetado" el elemento llega al 100%. */
function avElementEstado(x){
  const des=x.disciplinasEstado||[];
  if(!des.length) return 'en_revision';
  const order=['bloqueada','en_revision','proceso_no_objecion'];
  for(const k of order) if(des.some(d=>d.estado===k)) return k;
  return 'no_objetado';
}
function avElementPct(x){
  const des=x.disciplinasEstado||[]; if(!des.length) return 0;
  return Math.round(des.filter(d=>d.estado==='no_objetado').length/des.length*100);
}
function avElementLastApprovalDate(x){
  const dates=(x.disciplinasEstado||[]).filter(d=>d.estado==='no_objetado'&&d.fecha).map(d=>d.fecha).sort();
  return dates.length? dates[dates.length-1] : '';
}
function avScopeList(){
  const scope=STATE.avScope||'parcial'; // 'parcial' | 'general'
  let list=[...DB.avanceDiseno];
  if(scope==='parcial') list=list.filter(x=>x.funcionamientoParcial);
  if(STATE.avTipoFilter) list=list.filter(x=>x.tipoId===STATE.avTipoFilter);
  if(STATE.avDiscFilter) list=list.filter(x=>(x.disciplinasEstado||[]).some(d=>d.disciplinaId===STATE.avDiscFilter));
  return list;
}
function avStats(list){
  const counts={}; AV_ESTADOS.forEach(k=>counts[k]=0);
  list.forEach(x=>{ const e=avElementEstado(x); if(counts[e]!==undefined) counts[e]++; });
  const total=list.length;
  const pct={}; AV_ESTADOS.forEach(k=>pct[k]= total? Math.round(counts[k]/total*1000)/10 : 0);
  return {counts,total,pct};
}
function avDonutHtml(stats){
  if(!stats.total) return `<div class="av-donut" style="background:var(--panel-3)"></div>`;
  let acc=0; const stops=[];
  AV_ESTADOS.forEach(k=>{ const start=acc; acc+=stats.pct[k]; stops.push(`${AV_COLOR[k]} ${start}% ${acc}%`); });
  return `<div class="av-donut" style="background:conic-gradient(${stops.join(',')})">
    <div class="av-donut-label"><b>${stats.pct.no_objetado}%</b><span>${STATE.lang==='en'?'approved':STATE.lang==='zh'?'已批准':'aprobado'}</span></div>
  </div>`;
}
function avSelectDisc(cur){ return `<select id="av_disc" multiple size="4">${selOptsMulti(sortedDisciplines(),cur)}</select>`; }
function openManageAvanceTipos(){

function createAvanceItem(){
  const nombre=document.getElementById('av_nombre').value.trim(); if(!nombre) return;
  const estado=document.getElementById('av_estado').value;
  const discIds=[...document.getElementById('av_disc').selectedOptions].map(o=>o.value);
  const mkRow=d=>({id:uid('AVD'),disciplinaId:d,estado,fecha:iso(today()),motivo:estado==='bloqueada'?(STATE.lang==='en'?'Pending':'Pendiente'):''});
  const disciplinasEstado = discIds.length? discIds.map(mkRow) : [mkRow(null)];
  DB.avanceDiseno.push({id:uid('AVI'),tipoId:document.getElementById('av_tipo').value,nombre,
    disciplinasEstado, funcionamientoParcial:document.getElementById('av_scope').value==='true',
    planosEnviadosFirma:false,fechaEnviados:'',planosFirmados:false,fechaFirmados:'',
    notas:'',createdBy:currentUser().id});

function setAvDiscField(itemId,rowId,field,val){

function deleteAvanceItem(id){

  DB.avanceDiseno=DB.avanceDiseno.filter(a=>a.id!==id); markDeleted('avanceDiseno',id); saveDB(); closeModal(); renderAll();
}
function avChip(x){

    <span class="ic">${avTipoIcon(x.tipoId)}</span><span class="nm">${esc(x.nombre)}</span><span class="pct">${pct}%</span></div>`;

/* ============================ SOCIALIZACIONES ============================ */
const SOCIAL_ESTADOS=['programada','realizada','cancelada'];
function socialEstadoLabel(k){
  const m={programada:{es:'Programada',en:'Scheduled',zh:'已安排'},realizada:{es:'Realizada',en:'Held',zh:'已完成'},cancelada:{es:'Cancelada',en:'Cancelled',zh:'已取消'}};
  return (m[k]&&m[k][STATE.lang])||(m[k]&&m[k].es)||k;
}
function socialEstadoClass(k){ return {programada:'b-warn',realizada:'b-ok',cancelada:'b-late'}[k]||'b-muted'; }
function socialEstadoCalc(s){
  if(s.estado==='cancelada'||s.estado==='realizada') return s.estado;
  return s.fecha<iso(today()) ? 'realizada' : 'programada';
}
function viewSocializaciones(){
  const list=[...DB.socializaciones].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const upcoming=list.filter(s=>socialEstadoCalc(s)==='programada');
  return `<div class="pagehead"><div><h1>${t('nav_social')}</h1><div class="sub">${STATE.lang==='en'?'Who is attending community engagement / stakeholder sessions, and when':'Quiénes asisten a socializaciones y cuándo'}</div></div>
    ${can('edit')?`<button class="btn btn-primary" onclick="openNewSocial()">${STATE.lang==='en'?'+ New session':'+ Nueva socialización'}</button>`:''}</div>
    ${upcoming.length?`<div class="card" style="margin-bottom:14px"><div class="section-title">${STATE.lang==='en'?'Upcoming':'Próximas'} <span class="tag">${upcoming.length}</span></div>
      ${upcoming.slice(0,5).map(s=>`<div class="alert-line" onclick="openEditSocial('${s.id}')"><div class="ic">🗣️</div>
        <div style="flex:1">${fmtDate(s.fecha)}${s.hora?' · '+s.hora:''} — ${esc(s.nombre)}${s.lugar?' · '+esc(s.lugar):''}</div>
        <span>${(s.responsables||[]).map(userName).join(', ')||'—'}</span></div>`).join('')}
    </div>`:''}
    <div class="tbl-wrap"><table><thead><tr><th>${STATE.lang==='en'?'Date':'Fecha'}</th><th>${STATE.lang==='en'?'Session':'Socialización'}</th><th>${STATE.lang==='en'?'Place':'Lugar'}</th><th>${STATE.lang==='en'?'Attending':'Asisten'}</th><th>${t('th_status')}</th><th></th></tr></thead><tbody>
    ${list.map(s=>{ const est=socialEstadoCalc(s);
      return `<tr><td class="tag">${fmtDate(s.fecha)}${s.hora?'<br>'+s.hora:''}</td><td>${esc(s.nombre)}</td><td>${esc(s.lugar)||'—'}</td>
      <td>${(s.responsables||[]).map(userName).join(', ')||'—'}</td>
      <td><span class="badge ${socialEstadoClass(est)}"><span class="d"></span>${socialEstadoLabel(est)}</span></td>
      <td style="white-space:nowrap">${can('edit')?`<button class="btn btn-ghost btn-sm" onclick="openEditSocial('${s.id}')">${t('btn_edit')}</button>
      <button class="btn btn-ghost btn-sm" onclick="deleteSocial('${s.id}')">✕</button>`:''}</td></tr>`;
    }).join('') || `<tr><td colspan="6"><div class="empty">${t('empty_generic')}</div></td></tr>`}
    </tbody></table></div>`;
}
function openNewSocial(){
  if(!can('edit')){ toast(t('no_permission')); return; }
  openModal(STATE.lang==='en'?'New community engagement session':'Nueva socialización',`
    <div class="form-row"><label>${STATE.lang==='en'?'Name / subject':'Nombre / tema'}</label><input type="text" id="sc_nombre" placeholder="${STATE.lang==='en'?'e.g. Community meeting — Sector S-3':'Ej. Reunión comunitaria — Sector S-3'}"></div>

/* ============================ FLUJOS DE APROBACIÓN MULTIDISCIPLINARIOS ============================
   Cada etapa está ligada a una disciplina real y depende de 0, 1 o varias etapas anteriores.
   Una etapa sin dependencias (o con todas sus dependencias ya aprobadas) queda "disponible":
   si dos etapas dependen de la misma etapa anterior, ambas se habilitan a la vez (en paralelo). */
function flowAccionLabel(k){
  const m={inicio:{es:'Inicio del flujo',en:'Flow started',zh:'流程开始'},aprobado:{es:'Aprobada',en:'Approved',zh:'已批准'},
    revision:{es:'Puesta en revisión',en:'Marked in review',zh:'已标记为审核中'},
    devuelto:{es:'Devuelta',en:'Returned',zh:'已退回'},reinicio:{es:'Flujo reiniciado',en:'Flow reset',zh:'流程已重置'}};
  return (m[k]&&m[k][STATE.lang])||(m[k]&&m[k].es)||k;
}
function flowEtapaNivel(etapas,etapaId,cache,visiting){
  if(cache[etapaId]!==undefined) return cache[etapaId];
  visiting=visiting||new Set();
  if(visiting.has(etapaId)){ cache[etapaId]=0; return 0; } // dependencia circular por error de datos — no debe congelar la app
  visiting.add(etapaId);
  const e=etapas.find(x=>x.id===etapaId);
  if(!e||!e.dependeDe||!e.dependeDe.length){ cache[etapaId]=0; visiting.delete(etapaId); return 0; }
  const n=1+Math.max(...e.dependeDe.map(d=>flowEtapaNivel(etapas,d,cache,visiting)));
  cache[etapaId]=n; visiting.delete(etapaId); return n;
}
function flowGroupByNivel(etapas){
  const cache={}; const groups={};
  etapas.forEach(e=>{ const n=flowEtapaNivel(etapas,e.id,cache); (groups[n]=groups[n]||[]).push(e); });
  return Object.keys(groups).sort((x,y)=>x-y).map(k=>groups[k]);
}
function initFlowEstados(etapas){
  const estados={};
  etapas.forEach(e=>{ estados[e.id]={estado:(!e.dependeDe||!e.dependeDe.length)?'disponible':'bloqueada',fecha:'',usuario:'',comentario:''}; });
  return estados;
}
/* Solo el líder (o apoyo de líder) de la disciplina de esa etapa puede aprobarla —
   no cualquier miembro de la disciplina — y Coordinación/Dirección pueden en cualquier caso. */
function canApproveFlowStage(a,etapaId){
  const role=normRole(currentUser());
  if(role==='subdirector'||role==='coordinador') return true;
  const etapa=a.flujo.etapas.find(e=>e.id===etapaId); if(!etapa) return false;
  if(!etapa.disciplinaId) return can('edit');
  return isLiderRole(role) && userHasDisc(currentUser(),etapa.disciplinaId);
}
/* Si hay subtareas de esta actividad asignadas a la disciplina de esta etapa y todavía no
   están completadas, la etapa no se puede aprobar — primero hay que resolver esas subtareas. */
function flowStageHasPendingSubtasks(a,etapa){
  if(!etapa.disciplinaId) return false;
  return subtasksOf(a.id).some(s=>(s.disciplines||[]).includes(etapa.disciplinaId) && !['completada','cancelada'].includes(s.status));
}
function flowStagePendingSubtasksList(a,etapa){
  if(!etapa.disciplinaId) return [];
  return subtasksOf(a.id).filter(s=>(s.disciplines||[]).includes(etapa.disciplinaId) && !['completada','cancelada'].includes(s.status));
}
/* El % de avance de la actividad se calcula solo a partir del flujo, en cuanto tiene uno asignado. */
function syncProgressFromFlow(a){
  if(!a.flujo || !a.flujo.etapas.length) return;
  const total=a.flujo.etapas.length;
  const done=a.flujo.etapas.filter(e=>a.flujo.estados[e.id].estado==='aprobado').length;
  a.progress=Math.round(done/total*100);
}
/* Cuando la última etapa se aprueba y el flujo queda completo, la actividad NO se marca
   como completada sola — se avisa a quien la creó para que la cierre él mismo. */
function notifyFlowCompleteIfDone(a){
  if(!a.flujo) return;
  const allDone=a.flujo.etapas.every(e=>a.flujo.estados[e.id].estado==='aprobado');
  if(allDone && a.status!=='completada'){
    notify(`✅ ${a.code}: ${STATE.lang==='en'?'workflow fully approved — please review and close the activity':'flujo totalmente aprobado — te corresponde revisar y cerrar la actividad'}`,'nueva',a.id,[a.createdBy]);
  }
}
function flowGraphHtml(f){
  const groups=flowGroupByNivel(f.etapas);
  return `<div style="display:flex;gap:10px;overflow-x:auto;padding:12px 2px">
    ${groups.map((col,gi)=>`<div style="display:flex;align-items:center;gap:10px">
      <div style="display:flex;flex-direction:column;gap:8px;justify-content:center">
        ${col.map((e,ei)=>{ const st=f.estados[e.id].estado; const cls= st==='aprobado'?'done': st==='en_revision'?'review': st==='disponible'?'current':'pending';
          const num=flowEtapaNivel(f.etapas,e.id,{})+1;
          const preds=flowStagePredecessors(f,e);
          return `<div class="flow-node" style="min-width:118px">
            <div class="flow-dot ${cls}" style="width:auto;height:auto;border-radius:8px;padding:7px 11px;font-size:11px;white-space:nowrap">${st==='aprobado'?'✓ ':''}<span style="opacity:.7">#${num}</span> ${esc(e.nombre)}</div>
            <div class="flow-label ${st==='en_revision'?'review':''}">${e.disciplinaId?esc(discName(e.disciplinaId)):(STATE.lang==='en'?'(no discipline)':'(sin disciplina)')}</div>
            ${preds.length?`<div class="flow-dep-line">↙ ${STATE.lang==='en'?'depends on':'depende de'}: ${preds.map(p=>esc(p.nombre)).join(', ')}</div>`:''}
          </div>`;
        }).join('')}
      </div>
      ${gi<groups.length-1?'<div class="flow-line" style="min-width:26px"></div>':''}
    </div>`).join('')}
  </div>`;
}
function flowStagePredecessors(f,etapa){ return (etapa.dependeDe||[]).map(id=>f.etapas.find(e=>e.id===id)).filter(Boolean); }
