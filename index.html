<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Control · Actividades del Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F6F9; --panel-3:#EBEEF3;
  --border:#E1E5EC; --border-soft:#EDF0F4;
  --text:#1B2431; --text-dim:#5B6675; --text-faint:#8A93A3;
  --accent:#2563EB; --accent-dim:#DCE8FE; --accent-soft:#EEF4FF;
  --green:#16A34A; --green-dim:#E5F6EA;
  --amber:#D97706; --amber-dim:#FEF2E0;
  --orange:#EA580C; --orange-dim:#FDECE2;
  --red:#DC2626; --red-dim:#FCE9E9;
  --purple:#7C3AED; --purple-dim:#F1EAFD;
  --blue2:#2563EB; --blue2-dim:#EAF1FF;
  --radius:10px; --radius-sm:6px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-dim);color:var(--text);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:.2px;}
p{margin:0;}

/* ===== LOGIN ===== */
#loginScreen{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#F4F7FC,#FFFFFF);z-index:500;justify-content:center;padding:6vh 20px 40px;overflow-y:auto;}
body.not-authed #loginScreen{display:flex;align-items:flex-start;}
body.not-authed #topbar,body.not-authed #layout{display:none;}
.login-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:34px 32px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(20,30,50,.10);text-align:center;flex:none;}
.login-card .lg-logo{height:180px;max-width:420px;object-fit:contain;margin-bottom:16px;}
.login-card .lg-mark{width:90px;height:90px;border-radius:18px;background:var(--accent);margin:0 auto 14px;box-shadow:0 0 0 10px var(--accent-soft);}
.login-card h2{font-size:18px;margin-bottom:4px;}
.login-card .sub{color:var(--text-faint);font-size:12.5px;font-family:var(--font-mono);margin-bottom:20px;}
.login-card input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;font-size:13.5px;margin-bottom:12px;color:var(--text);text-align:left;}
.login-card button.btn-primary{width:100%;justify-content:center;padding:11px;font-size:13.5px;}
#loginError{color:var(--red);font-size:12px;margin:-4px 0 10px;min-height:14px;}
.login-hint{margin-top:18px;border-top:1px solid var(--border-soft);padding-top:14px;font-size:11.5px;color:var(--text-faint);text-align:left;}
.login-lang-row{display:flex;justify-content:center;gap:6px;margin-bottom:16px;}
.lang-pill{border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);border-radius:16px;padding:5px 12px;font-size:11.5px;font-weight:600;}
.lang-pill.on{background:var(--accent-soft);border-color:var(--accent-dim);color:var(--accent);}
.login-hint summary{cursor:pointer;font-weight:600;color:var(--text-dim);}
.login-hint table{margin-top:8px;}
.login-hint td{padding:3px 6px;font-family:var(--font-mono);font-size:11px;border:none;}

/* ===== LAYOUT ===== */
#topbar{
  height:58px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:0;z-index:40;
}
#brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:15px;white-space:nowrap;color:var(--text);}
#brand .mark{width:10px;height:10px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
#brand .logo-img{height:30px;max-width:150px;object-fit:contain;}
#brand small{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--text-faint);letter-spacing:1px;}

#board{
  flex:1;display:flex;align-items:center;gap:22px;overflow:hidden;
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
  border-left:1px solid var(--border-soft);border-right:1px solid var(--border-soft);
  padding:0 18px;height:34px;
}
#board .b-item{display:flex;align-items:center;gap:7px;white-space:nowrap;}
#board .b-item b{color:var(--text);font-size:13px;}
#board .dot{width:7px;height:7px;border-radius:50%;flex:none;}
#board .dot.red{background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse 1.6s infinite;}
#board .dot.amber{background:var(--amber);}
#board .dot.green{background:var(--green);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#board .dot.red{animation:none}}

#topbar-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent-dim);}
.lang-btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);border-radius:8px;padding:0 10px;height:34px;font-size:12px;font-weight:700;font-family:var(--font-mono);}
.lang-btn:hover{color:var(--text);border-color:var(--accent-dim);}
.badge-count{
  position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  font-family:var(--font-mono);
}
#userchip{
  display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px 5px 6px;cursor:pointer;
}
#userchip .av{width:24px;height:24px;border-radius:6px;background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-display);}
#userchip .meta{display:flex;flex-direction:column;line-height:1.2;}
#userchip .meta b{font-size:12px;}
#userchip .meta span{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.5px;}

#layout{display:flex;min-height:calc(100vh - 58px);}
#sidebar{
  width:236px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;
}
.nav-group{margin-bottom:14px;}
.nav-group-title{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-faint);
  font-family:var(--font-mono);padding:6px 10px 4px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--text-dim);
  font-size:13px;cursor:pointer;margin-bottom:1px;font-weight:500;
}
.nav-item .ic{width:16px;text-align:center;font-size:13px;flex:none;}
.nav-item .ct{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.nav-item:hover{background:var(--panel-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent);}

#content{flex:1;padding:22px 26px 60px;max-width:1440px;}

/* ===== COMMON COMPONENTS ===== */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.pagehead h1{font-size:20px;}
.pagehead .sub{color:var(--text-faint);font-size:12.5px;margin-top:4px;font-family:var(--font-mono);}
.btn{
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:8px 14px;border-radius:8px;
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--accent-dim);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);background:var(--panel-2);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{border-color:var(--red);color:var(--red);background:#fff;}
.btn-danger:hover{background:var(--red-dim);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}

.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}#content{padding:14px;}}
@media (max-width:900px){
  #hamburgerBtn{display:flex !important;}
  #board{display:none;}
  #topbar{gap:8px;padding:0 10px;}
  #sidebar{position:fixed;top:58px;left:-270px;height:calc(100vh - 58px);z-index:70;transition:left .2s ease;box-shadow:4px 0 24px rgba(20,30,50,.15);}
  #sidebar.open{left:0;}
  #sidebarOverlay{display:none;position:fixed;inset:58px 0 0 0;background:rgba(15,20,30,.4);z-index:65;}
  #sidebarOverlay.open{display:block;}
  #brand small{display:none;}
  #userchip .meta{display:none;}
  .form-cols-2,.form-cols-3{grid-template-columns:1fr;}
  .mini-add{flex-wrap:wrap;}
  .gantt-label{padding:6px 8px;}
  .cal-cell{min-height:60px;}
}
@media (max-width:480px){
  #brand{font-size:12px;}
  .lang-btn{padding:0 7px;font-size:11px;}
  .icon-btn{width:30px;height:30px;font-size:14px;}
  #userchip{padding:4px 6px 4px 4px;}
  .pagehead h1{font-size:17px;}
  .login-card{padding:24px 18px;}
  .login-card .lg-logo{height:110px;max-width:260px;}
  .login-card .lg-mark{width:70px;height:70px;}
  #loginScreen{padding-top:3vh;}
}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(20,30,50,.03);}
.card.tight{padding:12px 14px;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);
  font-family:var(--font-mono);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}

.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
  border-left:3px solid var(--border);}
.kpi .n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;}
.kpi .l{color:var(--text-faint);font-size:11.5px;margin-top:6px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.4px;}
.kpi.k-red{border-left-color:var(--red);} .kpi.k-amber{border-left-color:var(--amber);}
.kpi.k-green{border-left-color:var(--green);} .kpi.k-accent{border-left-color:var(--accent);}
.kpi.k-purple{border-left-color:var(--purple);}
.area-card{background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:14px 16px;cursor:pointer;transition:border-color .15s;}
.area-card:hover{border-color:var(--accent-dim);}
.area-card-h{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;font-family:var(--font-mono);}
.area-card-n{font-family:var(--font-display);font-size:28px;font-weight:700;margin-top:4px;}
.area-card-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-faint);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:500;
  cursor:pointer;user-select:none;background:var(--panel-2);
}
th:hover{color:var(--text-dim);}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr.row-click{cursor:pointer;}
tr.row-click:hover td{background:var(--panel-2);}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);}
.sala-matrix{border-collapse:collapse;width:100%;}
.sala-matrix th,.sala-matrix td{border:1px solid var(--border-soft);text-align:center;padding:0;}
.sala-matrix th{padding:6px 4px;font-size:11px;font-family:var(--font-mono);color:var(--text-dim);background:var(--panel-2);}
.sala-cell{height:34px;min-width:64px;cursor:pointer;font-size:11px;font-weight:600;}
.sala-cell.free{color:var(--border);}
.sala-cell.free:hover{background:var(--accent-soft);color:var(--accent);}
.sala-cell.taken{background:var(--purple-dim);color:var(--purple);}
.sala-cell.taken:hover{background:var(--red-dim);color:var(--red);}
.tbl-wrap table{margin:0;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;
  font-family:var(--font-mono);white-space:nowrap;}
.badge .d{width:6px;height:6px;border-radius:50%;}
.b-p1{background:var(--red-dim);color:var(--red);} .b-p1 .d{background:var(--red);}
.b-p2{background:var(--orange-dim);color:var(--orange);} .b-p2 .d{background:var(--orange);}
.b-p3{background:var(--blue2-dim);color:var(--blue2);} .b-p3 .d{background:var(--blue2);}
.b-p4{background:var(--green-dim);color:var(--green);} .b-p4 .d{background:var(--green);}
.b-ok{background:var(--green-dim);color:var(--green);} .b-ok .d{background:var(--green);}
.b-warn{background:var(--amber-dim);color:var(--amber);} .b-warn .d{background:var(--amber);}
.b-late{background:var(--red-dim);color:var(--red);} .b-late .d{background:var(--red);}
.b-block{background:var(--purple-dim);color:var(--purple);} .b-block .d{background:var(--purple);}
.b-review{background:var(--blue2-dim);color:var(--blue2);} .b-review .d{background:var(--blue2);}
.b-muted{background:var(--panel-3);color:var(--text-dim);} .b-muted .d{background:var(--text-faint);}
.b-site{background:#EAF7EE;color:#0F7A3D;} .b-site .d{background:#0F7A3D;}

.tag{background:var(--panel-3);color:var(--text-dim);padding:2px 8px;border-radius:5px;font-size:11px;font-family:var(--font-mono);}

.progress{height:6px;background:var(--panel-3);border-radius:3px;overflow:hidden;width:70px;}
.progress i{display:block;height:100%;background:var(--accent);}

.empty{padding:34px 16px;text-align:center;color:var(--text-faint);font-size:13px;}
.empty .big{font-size:26px;margin-bottom:8px;}

/* Forms */
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;font-family:var(--font-mono);}
.form-row input[type=text],.form-row input[type=date],.form-row input[type=number],
.form-row input[type=email],.form-row input[type=password],.form-row input[type=file],.form-row select,.form-row textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;color:var(--text);
  padding:9px 10px;font-size:13px;
}
.form-row textarea{min-height:64px;resize:vertical;}
.form-row .hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
.form-cols-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-cols-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.chip-select{display:flex;flex-wrap:wrap;gap:6px;}
.chip-opt{border:1px solid var(--border);background:var(--panel-2);padding:5px 10px;border-radius:16px;font-size:12px;color:var(--text-dim);display:inline-flex;align-items:center;gap:6px;}
.chip-opt.on{background:var(--accent-soft);border-color:var(--accent-dim);color:var(--accent);}
.chip-opt .x{cursor:pointer;color:var(--text-faint);font-weight:700;}
.chip-opt .x:hover{color:var(--red);}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;}
.mini-list{border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:10px;max-height:150px;overflow-y:auto;}
.mini-list-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 4px;font-size:12.3px;border-bottom:1px solid var(--border-soft);}
.mini-list-row:last-child{border-bottom:none;}
.mini-add{display:flex;gap:6px;align-items:flex-end;}
.mini-add > div{flex:1;}
.mini-add label{font-size:10px;color:var(--text-faint);display:block;margin-bottom:3px;font-family:var(--font-mono);text-transform:uppercase;}
.mini-add input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-size:12.5px;}

/* Modal & Drawer */
#modalOverlay{
  position:fixed;inset:0;background:rgba(15,20,30,.45);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow-y:auto;
}
#modalOverlay.hidden{display:none;}
#modalBox{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:640px;
  max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(20,30,50,.18);}
#modalBox.wide{max-width:940px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:15px;}
.modal-body{padding:20px;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.x-close{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab{padding:9px 12px;font-size:12.5px;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;}
.tab.active{color:var(--accent);border-color:var(--accent);}

.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filterbar select,.filterbar input{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:12.5px;
}
.filterbar .sep{width:1px;height:20px;background:var(--border);margin:0 2px;}

.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:#fff;border-left:3px solid var(--accent);border-radius:8px;
  padding:11px 14px;font-size:12.5px;min-width:240px;box-shadow:0 8px 24px rgba(20,30,50,.25);animation:slidein .2s ease;}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

.alert-line{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--border);border-left:4px solid var(--border);margin-bottom:8px;font-size:12.8px;cursor:pointer;}
.alert-line:hover{border-color:var(--accent-dim);}
.alert-line .ic{font-size:15px;flex:none;margin-top:1px;}

.timeline{border-left:2px solid var(--border);margin-left:6px;padding-left:16px;}
.timeline .ev{position:relative;padding-bottom:14px;}
.timeline .ev::before{content:'';position:absolute;left:-21px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
.timeline .ev .t{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.timeline .ev .m{font-size:12.5px;margin-top:2px;}

   CENTRO DE CONTROL — ACTIVIDADES DEL PERSONAL
   Un solo archivo HTML autocontenido. Persistencia: localStorage.
   ========================================================================= */

const DB_KEY='ccd_personal_v3';
const SESSION_KEY='ccd_personal_session_v3';
/* Versión del código — súbela cada vez que subas un cambio a GitHub, así se puede
   confirmar de un vistazo (en el login y en el menú) que se está viendo la versión
   ajustada y no una copia vieja en caché. Convención: v1.xx para ajustes normales;
   pasa a v2.00 cuando haya un cambio grande (rediseño de un módulo, nueva base de
   datos, etc.) y se reinicia el contador (v2.01, v2.02...). */
const APP_VERSION='v2.11';
const today=()=>new Date(new Date().toDateString());
const iso=(d)=>{ if(typeof d==='string') return d; return d.toISOString().slice(0,10); };
const addDays=(d,n)=>{ const x=new Date(typeof d==='string'?d+'T00:00:00':d); x.setDate(x.getDate()+n); return iso(x); };
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000);
const fmtDate=(d)=>{ if(!d) return '—'; const x=new Date(d+'T00:00:00'); return x.toLocaleDateString(STATE_LOCALE(),{day:'2-digit',month:'short'}); };
const fmtDateYear=(d)=>{ if(!d) return '—'; const x=new Date(d+'T00:00:00'); return x.toLocaleDateString(STATE_LOCALE(),{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDateLong=(d)=>{ if(!d) return '—'; const x=new Date(d+'T00:00:00'); return x.toLocaleDateString(STATE_LOCALE(),{day:'2-digit',month:'short',year:'numeric'}); };
const nowStamp=()=>{ const d=new Date(); return d.toLocaleDateString(STATE_LOCALE())+' '+d.toLocaleTimeString(STATE_LOCALE(),{hour:'2-digit',minute:'2-digit'}); };
const uid=(p)=>p+'-'+Math.random().toString(36).slice(2,9);
/* El código de la próxima actividad se calcula SIEMPRE a partir de las actividades que
   existen de verdad — no se confía en un contador guardado aparte (DB.counters.activity),
   que con el tiempo podía quedar desincronizado de la realidad por los bugs de
   sincronización ya corregidos. Empieza en 0001 y busca el primer número que todavía no
   esté en uso — así se van llenando los huecos que hayan quedado (de códigos que se
   corrigieron o nunca se usaron) antes de saltar a números más altos. */
function nextActivityCode(){
  const used=new Set();
  DB.activities.forEach(a=>{ const n=parseInt((a.code||'').replace(/\D/g,''),10); if(!isNaN(n)) used.add(n); });
  let next=1;
  while(used.has(next)) next++;
  DB.counters.activity=next+1; // se mantiene por compatibilidad, pero ya no es la fuente de verdad
  return 'ACT-'+String(next).padStart(4,'0');
}
const esc=(s)=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function STATE_LOCALE(){ return STATE.lang==='en'?'en-US':(STATE.lang==='zh'?'zh-CN':'es-CO'); }
function isWeekend(dateStr){ const d=new Date(dateStr+'T00:00:00'); const day=d.getDay(); return day===0||day===6; }
function addBusinessDays(dateStr,days){
  let d=dateStr; let remaining=Math.round(days);
  if(remaining<=0){ while(remaining<0){ d=addDays(d,-1); if(!isWeekend(d)) remaining++; } return d; }
  while(remaining>0){ d=addDays(d,1); if(!isWeekend(d)) remaining--; }
  return d;
}

function labelForOrder(db,order){

/* ---------------- PRIORITY ORDER ENGINE (per disciplina) ---------------- */
function activePrioritizedByDisc(discId,db){
  db=db||DB;
  const tier=a=> a.blocked?2 : (a.status==='en_revision'?1:0);
  return db.activities.filter(a=>!a.parentId && !['completada','cancelada'].includes(a.status) && (a.disciplines||[]).includes(discId))
    .sort((a,b)=> tier(a)-tier(b) || (((a.priorityOrder||{})[discId])||9999)-(((b.priorityOrder||{})[discId])||9999));
}
function recomputeGlobalPriority(a,db){
  db=db||DB;
  if(!a.disciplines || !a.disciplines.length){ a.priority='P4'; return; }
  const order=['P1','P2','P3','P4']; let best='P4';
  a.disciplines.forEach(d=>{ const lvl=labelForOrder(db,((a.priorityOrder||{})[d])||9999); if(order.indexOf(lvl)<order.indexOf(best)) best=lvl; });
  a.priority=best;
}
function reindexDiscipline(discId,db){
  db=db||DB;
  const list=activePrioritizedByDisc(discId,db);
  list.forEach((a,i)=>{ if(!a.priorityOrder) a.priorityOrder={}; a.priorityOrder[discId]=i+1; });
  list.forEach(a=>recomputeGlobalPriority(a,db));
}
function reindexAllDisciplines(db){
  db=db||DB;
  db.disciplines.forEach(d=>reindexDiscipline(d.id,db));
  db.activities.filter(a=>!a.parentId).forEach(a=>recomputeGlobalPriority(a,db));
}
function reindexAffected(a){ (a.disciplines||[]).forEach(d=>reindexDiscipline(d)); }
/* Encadena fechas: la actividad en la posición i inicia cuando termina la de la posición i-1 (dentro de la disciplina) */
function chainDatesInDisc(discId){
  const list=activePrioritizedByDisc(discId);
  for(let i=1;i<list.length;i++){
    const prev=list[i-1], cur=list[i];
    if(cur.blocked || cur.status==='en_revision') continue; // no forzar fecha de las que están al final por bloqueo/revisión
    const newStart=computedEnd(prev);
    if(newStart!==cur.startDate){
      const beforeDue=cur.dueDate;
      cur.startDate=newStart; cur.dueDate=addBusinessDays(newStart,cur.duration);
      pushHistory(cur,currentUser(),'startDate (encadenado por orden)',null,cur.startDate);
      if(cur.dueDate!==beforeDue) notify(`🔵 ${cur.code}: ${fmtDate(beforeDue)} → ${fmtDate(cur.dueDate)}`,'fecha',cur.id);
    }
  }
}
/* Cuando se filtra por responsable, mover una actividad con las flechas la intercambiaba
   con su vecino inmediato en la cola COMPLETA de la disciplina — que podía ser de otra
   persona. Eso cambiaba fechas (por el encadenado) sin que se viera ningún movimiento en
   la vista filtrada. Esto "salta" la actividad, con varios intercambios de a uno si hace
   falta, hasta quedar junto a su vecino VISIBLE en la lista filtrada — así el movimiento
   sí se ve, y el cambio de fechas es la consecuencia esperada de un movimiento real. */
function moveActivityFiltered(id,dir,discId,filteredIdsCsv){
  const filteredIds=filteredIdsCsv.split(',');
  const idx=filteredIds.indexOf(id); const targetIdx=idx+dir;
  if(idx<0||targetIdx<0||targetIdx>=filteredIds.length) return;
  const neighborId=filteredIds[targetIdx];
  let list=activePrioritizedByDisc(discId);
  let curIdx=list.findIndex(a=>a.id===id); const neighborIdx=list.findIndex(a=>a.id===neighborId);
  if(curIdx<0||neighborIdx<0) return;
  const step=neighborIdx>curIdx?1:-1;
  while(curIdx!==neighborIdx){
    const nextIdx=curIdx+step;
    const tmp=list[curIdx]; list[curIdx]=list[nextIdx]; list[nextIdx]=tmp;
    curIdx=nextIdx;
  }
  list.forEach((a,i)=>{ a.priorityOrder[discId]=i+1; });
  list.forEach(a=>recomputeGlobalPriority(a));
  chainDatesInDisc(discId);
  saveDB(); renderAll();
}
function moveActivityInDisc(id,dir,discId){
  const list=activePrioritizedByDisc(discId); const idx=list.findIndex(a=>a.id===id); const newIdx=idx+dir;
  if(idx<0||newIdx<0||newIdx>=list.length) return;
  const tmp=list[idx]; list[idx]=list[newIdx]; list[newIdx]=tmp;
  list.forEach((a,i)=>{ a.priorityOrder[discId]=i+1; });
  list.forEach(a=>recomputeGlobalPriority(a));
  chainDatesInDisc(discId);
  saveDB(); renderAll();
}
function setActivityPositionInDisc(id,pos,discId){
  let list=activePrioritizedByDisc(discId); const idx=list.findIndex(a=>a.id===id); if(idx<0) return;
  const [item]=list.splice(idx,1);
  const target=Math.max(1,Math.min(list.length+1,pos))-1;
  list.splice(target,0,item);
  list.forEach((a,i)=>{ a.priorityOrder[discId]=i+1; });
  list.forEach(a=>recomputeGlobalPriority(a));
  chainDatesInDisc(discId);
  saveDB();
}
/* Reordena una disciplina completa según la fecha límite más próxima primero (bloqueadas/en revisión igual bajan al final) */
function sortDisciplineByDueDate(discId){
  const list=activePrioritizedByDisc(discId);
  const tier=a=> a.blocked?2 : (a.status==='en_revision'?1:0);
  list.sort((a,b)=> tier(a)-tier(b) || a.dueDate.localeCompare(b.dueDate));
  list.forEach((a,i)=>{ a.priorityOrder[discId]=i+1; });
  list.forEach(a=>recomputeGlobalPriority(a));
  saveDB(); toast(STATE.lang==='en'?'Reordered by due date.':'Reordenado por fecha de vencimiento.'); renderAll();
}

function saveLocalOnly(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function saveDB(){ saveLocalOnly(); if(SYNC.client) scheduleCloudPush(); }
function runMigrations(){
  if(!DB.notifications) DB.notifications=[];
  if(!DB.settings.permissions) DB.settings.permissions=defaultPermissions();
  /* Backfill: instalaciones ya sincronizadas pueden tener el objeto de permisos
     de una versión anterior — sin el rol "visitante" (rompía la Matriz de roles)
     o sin las pestañas nuevas (Gestor OT, Terceros, Contratos, Avance de Diseño). */
  if(!DB.settings.permVersion) DB.settings.permVersion=1;
  if(DB.settings.permVersion<2){
    const defaultsPerm=defaultPermissions();
    ROLES.forEach(r=>{
      if(!DB.settings.permissions[r]){ DB.settings.permissions[r]=defaultsPerm[r]; return; }
      const existingViews=DB.settings.permissions[r].views||[];
      ['gestor_ot','terceros','contratos','avance_diseno'].forEach(v=>{
        if(defaultsPerm[r] && defaultsPerm[r].views.includes(v) && !existingViews.includes(v)) existingViews.push(v);
      });
      DB.settings.permissions[r].views=existingViews;
    });
    DB.settings.permVersion=2;
  }
  if(DB.settings.permVersion<3){
    // Backfill: agrega el rol "Apoyo de líder" (mismas reglas que Líder) si la instalación no lo tenía aún.
    if(!DB.settings.permissions.apoyo_lider){
      const defaultsPerm=defaultPermissions();
      DB.settings.permissions.apoyo_lider = DB.settings.permissions.lider
        ? {...DB.settings.permissions.lider, views:[...DB.settings.permissions.lider.views]}
        : defaultsPerm.apoyo_lider;
    }
    DB.settings.permVersion=3;
  }
  if(DB.settings.permVersion<4){
    // Se retiran Gantt, Carga y Matriz de responsabilidades; se agrega Socializaciones.
    Object.keys(DB.settings.permissions).forEach(r=>{
      const p=DB.settings.permissions[r]; if(!p||!p.views) return;
      p.views=p.views.filter(v=>!['gantt','carga','responsabilidades'].includes(v));
      if(r!=='subdirector' && r!=='coordinador' && !p.views.includes('socializaciones')) p.views.push('socializaciones');
    });
    DB.settings.permVersion=4;
  }
  if(DB.settings.permVersion<5){
    // Se agrega el módulo de Flujos de aprobación (visible para líderes y superiores).
    Object.keys(DB.settings.permissions).forEach(r=>{
      const p=DB.settings.permissions[r]; if(!p||!p.views) return;
      if((r==='lider'||r==='apoyo_lider') && !p.views.includes('flujos')) p.views.push('flujos');
    });
    DB.settings.permVersion=5;
  }
  if(DB.settings.permVersion<6){
    // Backfill: agrega el rol "Especialista" (mismas reglas que Líder) si la instalación no lo tenía aún.
    if(!DB.settings.permissions.especialista){
      DB.settings.permissions.especialista = DB.settings.permissions.lider
        ? {...DB.settings.permissions.lider, views:[...DB.settings.permissions.lider.views]}
        : defaultPermissions().especialista;
    }
    DB.settings.permVersion=6;
  }
  if(DB.settings.permVersion<7){
    // Se agrega el módulo de Reserva de salas, visible para todos los roles.
    Object.keys(DB.settings.permissions).forEach(r=>{
      const p=DB.settings.permissions[r]; if(!p||!p.views) return;
      if(!p.views.includes('salas')) p.views.push('salas');
    });
    DB.settings.permVersion=7;
  }
  /* Alertas de licencia guardadas ANTES de que se empezara a registrar a quién
     pertenecían (subjectUserId) — para esas, la única forma de saber si la persona
     sigue existiendo es leer el nombre directamente del texto de la notificación.
     Esto corre siempre, sin condición, para que se autolimpien sin importar cuándo
     sincronice cada dispositivo. IMPORTANTE: se marca cada una como borrada
     (markDeleted) — si no, el borrado no queda protegido y la próxima sincronización
     con un dispositivo que todavía no tenga esta corrección la trae de vuelta. */
  {
    const toRemoveIds=[];
    DB.notifications=DB.notifications.filter(n=>{
      if(n.type!=='licencia') return true;
      let keep;
      if(n.subjectUserId) keep=DB.users.some(u=>u.id===n.subjectUserId);
      else{
        const m=n.text.match(/vencer: ([^—]+) —/);
        keep = !m || DB.users.some(u=>u.name===m[1].trim()); // si no se pudo leer el nombre, se deja
      }
      if(!keep) toRemoveIds.push(n.id);
      return keep;
    });
    if(toRemoveIds.length) markDeleted('notifications',toRemoveIds);
  }
  /* Alertas de licencias que ya se quitaron o se renovaron (renovar = quitar la vieja y
     crear una con id nuevo, así que la alerta vieja quedaba huérfana para siempre y
     seguía apareciendo aunque ya se hubiera actualizado el software). Se limpia
     cualquiera cuya licencia específica ya no exista en esa persona. */
  {
    const removedIds=[];
    DB.notifications=DB.notifications.filter(n=>{
      if(n.type!=='licencia'||!n.licenseId) return true;
      const u=n.subjectUserId?byId(DB.users,n.subjectUserId):null;
      const keep = u ? (u.licenses||[]).some(l=>l.id===n.licenseId) : true; // sin subjectUserId no se puede verificar por id, se deja
      if(!keep) removedIds.push(n.id);
      return keep;
    });
    if(removedIds.length) markDeleted('notifications',removedIds);
  }
  /* Duplicados de alertas de licencia (dos dispositivos avisando lo mismo casi al mismo
     tiempo, antes de esta corrección) — se conserva solo una por combinación exacta de
     persona + texto. También se marcan como borrados los que se descartan aquí. */
  {
    const seenLic=new Set(); const keep=[]; const removedIds=[];
    [...DB.notifications].sort((a,b)=>a.date<b.date?-1:1).forEach(n=>{
      if(n.type!=='licencia'){ keep.push(n); return; }
      const key=(n.subjectUserId||'')+'|'+n.text;
      if(seenLic.has(key)){ removedIds.push(n.id); return; } // duplicado — se descarta
      seenLic.add(key); keep.push(n);
    });
    if(removedIds.length){ DB.notifications=keep; markDeleted('notifications',removedIds); }
  }
  /* Chequeo incondicional (NO depende de permVersion) — garantiza que TODO rol tenga su
     objeto de permisos, en cada arranque. Esto es lo que evita que "no se pueda entrar a
     ninguna pestaña": si a un rol le faltaba su objeto de permisos (por ejemplo, por una
     sincronización vieja que sobrescribió esta parte antes de las correcciones más
     recientes), antes se quedaba así para siempre porque el número de versión ya era alto
     y esa migración puntual no volvía a correr. Esto sí corre siempre, sin condición. */
  ROLES.forEach(r=>{
    if(!DB.settings.permissions[r]){
      const d=defaultPermissions()[r];
      if(d) DB.settings.permissions[r]={...d,views:[...d.views]};
    }
  });
  /* Verificación defensiva: si dos roles llegaron a compartir por error el MISMO objeto
     de permisos (algo que pudo pasar por una sincronización vieja de antes de las
     correcciones más recientes), marcar una casilla de un rol en la matriz también
     cambiaba la del otro rol, sin ninguna relación entre ellos — porque en realidad
     estaban editando el mismo objeto. Aquí se detecta y se separan siempre, dándole a
     cada rol su propia copia independiente. */

/* Colecciones que se combinan (no se sobrescriben a ciegas) al guardar en la nube. */
const MERGE_COLLECTIONS=['users','activities','asistencias','contratos','avanceDiseno','terceros',
  'disciplines','fronts','types','otDocTypes','avanceTipos','socializaciones','flujoTemplates','notifications','salas','reservasSalas'];
/* "Fotografía" de cómo estaba cada registro la última vez que se confirmó que mi copia
   coincidía con la nube (justo después de traer o de guardar con éxito). Sirve para saber,
   al momento de guardar, cuáles registros TOQUÉ de verdad desde entonces (esos sí deben
   ganar con mi versión) y cuáles simplemente los tengo sin cambios en memoria porque
   estaban ahí (esos NO deben pisar lo que alguien más haya cambiado mientras tanto —
   antes "ganaba lo local" para CUALQUIER id que coincidiera, así no lo hubiera tocado
   yo, y eso era lo que hacía que una aprobación de flujo, o cualquier otro cambio de
   otra persona, se "devolviera sola" cuando yo guardaba algo sin relación). */
let LAST_SYNCED_SNAPSHOT=null;
/* "Huella" liviana para comparar registros: las observaciones de Gestor OT pueden traer
   imágenes en base64 (texto muy pesado). Comparar el texto COMPLETO de cada actividad en
   cada guardado (sin límite de frecuencia) podía congelar el navegador por completo con
   actividades que tuvieran fotos adjuntas — eso era lo que hacía sentir que la app "se
   quedaba pegada" al entrar a una actividad en particular. Aquí se reemplaza cualquier
   texto largo (como una imagen) por su tamaño en vez de su contenido, antes de comparar
   — sigue detectando si algo cambió, sin cargar con el peso real de las imágenes. */
function lightFingerprint(item){
  try{ return JSON.stringify(item,(k,v)=> (typeof v==='string' && v.length>300) ? ('~'+v.length) : v); }catch(e){ return null; }
}
function captureSyncSnapshot(){
  const snap={};
  MERGE_COLLECTIONS.forEach(key=>{
    if(!Array.isArray(DB[key])) return;
    snap[key]={};
    DB[key].forEach(item=>{ if(item&&item.id){ const f=lightFingerprint(item); if(f!==null) snap[key][item.id]=f; } });
  });
  LAST_SYNCED_SNAPSHOT=snap;
}
function recordUnchangedSinceSync(key,item){
  if(!item||!item.id||!LAST_SYNCED_SNAPSHOT||!LAST_SYNCED_SNAPSHOT[key]) return false;
  const prev=LAST_SYNCED_SNAPSHOT[key][item.id];
  if(prev===undefined) return false; // no existía en la última foto -> lo creé/cambié yo -> se trata como tocado
  const cur=lightFingerprint(item);
  return cur!==null && prev===cur;
}
/* Punto único de mezcla — lo usan TANTO traer como guardar. Antes, traer (pullFromCloud)
   reemplazaba mi copia completa a ciegas con lo que llegara de la nube, sin comparar nada
   — a diferencia de guardar, que sí protegía lo que yo hubiera tocado. Si borrabas algo o
   aprobabas un paso de flujo y justo en ese instante llegaba una actualización de otra
   persona (algo frecuente con muchos usuarios activos), tu cambio recién hecho se perdía
   por completo antes de alcanzar a guardarse. Ahora ambos caminos usan la misma regla:
   lo que llega de la nube es la autoridad por defecto; mi copia local solo prevalece para
   lo que de verdad cambié (o creé) desde la última vez que se confirmó sincronía. */
function mergeIncoming(incoming){
  const remoteTombstones=(incoming.settings&&incoming.settings._tombstones)||{};
  const localTombstones=(DB.settings&&DB.settings._tombstones)||{};
  const mergedTombstones={};
  [...new Set([...Object.keys(remoteTombstones),...Object.keys(localTombstones)])].forEach(key=>{
    mergedTombstones[key]={...(remoteTombstones[key]||{}),...(localTombstones[key]||{})};
  });
  const result=JSON.parse(JSON.stringify(incoming));
  MERGE_COLLECTIONS.forEach(key=>{
    const incomingArr=Array.isArray(incoming[key])?incoming[key]:[];
    const localArr=Array.isArray(DB[key])?DB[key]:[];
    const deleted=mergedTombstones[key]||{};
    const incomingById={}; incomingArr.forEach(item=>{ if(item&&item.id) incomingById[item.id]=item; });
    const map=new Map();
    Object.keys(incomingById).forEach(id=>{ if(!deleted[id]) map.set(id,incomingById[id]); });
    localArr.forEach(item=>{
      if(!item||!item.id||deleted[item.id]) return;
      const existedIncoming=incomingById.hasOwnProperty(item.id);
      if(!existedIncoming || !recordUnchangedSinceSync(key,item)) map.set(item.id,item); // nuevo o cambiado de verdad -> gana lo local
    });
    result[key]=Array.from(map.values());
  });
  result.settings=result.settings||{};
  result.settings._tombstones=mergedTombstones;
  // Los contadores de códigos (ACT-0001, etc.) solo avanzan — nunca deben retroceder,
  // porque eso es justo lo que hacía que dos personas generaran el mismo código.
  result.counters=result.counters||{};
  const localCounters=(DB.counters)||{};
  Object.keys(localCounters).forEach(k=>{ result.counters[k]=Math.max(result.counters[k]||0, localCounters[k]||0); });
  /* Aun con el contador protegido, dos personas pueden crear una actividad casi al mismo
     tiempo en dos dispositivos DISTINTOS, antes de que ninguno se haya sincronizado con
     el otro — ambos parten del mismo número y generan el mismo código. Esto lo detecta y
     corrige aquí: la actividad creada primero conserva su código; a la más nueva se le
     asigna el primer número que esté libre (llenando huecos, en vez de saltar a uno
     alto). Al ser parte de la mezcla, esto se corrige solo la próxima vez que cualquier
     dispositivo sincronice — sin que nadie tenga que hacer nada manualmente. */
  if(Array.isArray(result.activities)){
    const usedNums=new Set();
    result.activities.forEach(a=>{ const n=parseInt((a.code||'').replace(/\D/g,''),10); if(!isNaN(n)) usedNums.add(n); });
    const nextFree=()=>{ let n=1; while(usedNums.has(n)) n++; usedNums.add(n); return n; };
    // Se ordena por id (no por fecha) para decidir quién conserva el código original —
    // la fecha puede repetirse o faltar entre varias actividades, lo que hacía que la
    // "ganadora" cambiara de una sincronización a otra y se reasignaran códigos una y
    // otra vez sin necesidad. El id siempre es el mismo, así que el resultado ahora es
    // siempre el mismo también.
    const byId=[...result.activities].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
    const seenCodes={}; let maxAssigned=0;
    byId.forEach(a=>{
      if(!a.code) return;
      if(seenCodes[a.code]){
        const oldCode=a.code; const n=nextFree();
        a.code='ACT-'+String(n).padStart(4,'0'); if(n>maxAssigned) maxAssigned=n;
        if(a.history) a.history.push({date:iso(today())+' '+new Date().toLocaleTimeString(STATE_LOCALE(),{hour:'2-digit',minute:'2-digit'}),user:a.createdBy||'',action:'codigo-corregido (era duplicado)',before:oldCode,after:a.code});
      }
      seenCodes[a.code]=true;
    });
    if(maxAssigned>=(result.counters.activity||1)) result.counters.activity=maxAssigned+1;
  }
  return result;
}
async function pullFromCloud(isInitial){

     a la pestaña), no hay nada nuevo. Antes, cada una de esas revisiones traía la base
     de datos COMPLETA solo para descubrir que no había cambiado nada — eso es lo que
     más pesaba en el egress con 60 personas conectadas. Ahora solo se trae todo cuando
     la versión realmente es distinta. */

  if(vCheck.error){ SYNC.status='error'; SYNC.lastError=syncErrMsg(vCheck.error); console.warn('Error leyendo de la nube',vCheck.error); return; }
  if(vCheck.data && vCheck.data.version===SYNC.version){

    if(!LAST_SYNCED_SNAPSHOT) captureSyncSnapshot();
    SYNC.status='synced'; return;
  }
  const {data,error}=await SYNC.client.from('ccd_app_data').select('*').eq('id',1).maybeSingle();
  if(error){ SYNC.status='error'; SYNC.lastError=syncErrMsg(error); console.warn('Error leyendo de la nube',error); return; }
  SYNC.lastError='';

    /* Una sola lectura "vacía" puede ser un problema pasajero de red, no que la nube
       realmente esté vacía — confundir esto una sola vez fue justo lo que llevó a que se
       ofreciera (y se aceptara) subir datos de ejemplo por encima de la información real
       de todo el equipo. Ahora hace falta ver esto varias veces seguidas antes de
       siquiera considerarlo una nube genuinamente vacía. */
    SYNC.emptyStreak=(SYNC.emptyStreak||0)+1;
    if(SYNC.emptyStreak<3){ SYNC.status='error'; SYNC.lastError=STATE.lang==='en'?'Cloud read looked empty — will retry.':'La lectura de la nube pareció vacía — se reintentará.'; return; }

    // común (abrir o recargar la app sin que nada haya cambiado desde la última vez). Sin
    // esta foto, cualquier guardado posterior no tenía con qué comparar y volvía a tratar
    // TODO lo que tuviera en memoria como "cambiado por mí" — que era exactamente la causa
    // de que un paso de flujo aprobado por otra persona se "devolviera" con mi guardado.
    if(!LAST_SYNCED_SNAPSHOT) captureSyncSnapshot();
    SYNC.status='synced'; return;
  }
  if(data.version<SYNC.version){
    /* La nube trajo una versión MÁS VIEJA que la que ya tenemos en este dispositivo
       — por ejemplo, un eco tardío de una sincronización anterior, o una lectura que
       llegó atrasada. Si esto se aplicara, revertiría cambios recién hechos (una
       actividad eliminada volvería a aparecer, una aprobación del flujo se
       "devolvería" sola). Por eso se ignora sin tocar nada local. */
    SYNC.status='synced'; return;
  }

  const authed=!document.body.classList.contains('not-authed');
  /* Mi identidad en ESTE dispositivo se toma directo de la memoria (no de una
     relectura de localStorage), para que nunca se pierda por una sincronización
     que llegue mientras trabajas — es la causa de los cierres de sesión inesperados. */
  const myId = authed ? DB.currentUserId : null;
  const remoteUsers = (data.data && data.data.users) || [];
  const stillExists = !myId || remoteUsers.some(x=>x.id===myId);

  if(myId && !stillExists){
    SYNC.missingUserStreak=(SYNC.missingUserStreak||0)+1;
    console.warn('Instantánea de la nube sin mi usuario, se ignora (intento '+SYNC.missingUserStreak+')');
    if(SYNC.missingUserStreak<4){ SYNC.status='synced'; return; } // instantánea sospechosa: se ignora, se sigue trabajando normal
  } else {
    SYNC.missingUserStreak=0;
  }

  SYNC.version=data.version;
  DB=mergeIncoming(data.data); runMigrations();
  if(myId && stillExists) DB.currentUserId=myId; // restaura SIEMPRE mi propia sesión, pase lo que pase en la nube
  saveLocalOnly();
  captureSyncSnapshot(); // esta es la copia que sabemos coincide con la nube justo ahora
  SYNC.status='synced';

  if(myId && !stillExists){ logout(); return; } // confirmado varias veces: de verdad ya no existe esta cuenta
  if(authed){
    if(!isInitial) toast(STATE.lang==='en'?'Data updated from the cloud.':'Datos actualizados desde la nube.');
    /* Si justo en ese momento la persona está escribiendo algo en la pantalla (una
       observación, una nota, un campo de búsqueda...), NO se redibuja de inmediato
       — eso es lo que borraba lo que estaba escribiendo. Se espera a que salga de
       ese campo (blur) para aplicar la actualización, sin perder nada. */
    if(isTypingInContent()){
      STATE.pendingRender=true;
      const el=document.activeElement;
      if(el && !el._pendingBlurHandler){
        el._pendingBlurHandler=function(){
          el.removeEventListener('blur',el._pendingBlurHandler); el._pendingBlurHandler=null;
          if(STATE.pendingRender){ STATE.pendingRender=false; renderAll(); }
        };
        el.addEventListener('blur',el._pendingBlurHandler,{once:true});
      }
    } else { renderAll(); }
  }
  else renderLoginScreen();
}
function isTypingInContent(){
  const el=document.activeElement; if(!el) return false;
  if(el.tagName!=='INPUT' && el.tagName!=='TEXTAREA') return false;
  const content=document.getElementById('content');
  return !!(content && content.contains(el));
}
function scheduleCloudPush(){
  if(SYNC.pushTimer) clearTimeout(SYNC.pushTimer);
  if(SYNC.client && !SYNC.initialPullDone){
    /* Todavía no se confirma la copia real desde la nube — si se enviara algo ahora,
       sería con lo que había quedado guardado en este navegador (que puede estar
       desactualizado). Se reintenta cada rato hasta que sí haya llegado la copia
       real; el guardado local (lo que ve la persona en pantalla) no espera nada. */
    SYNC.pushTimer=setTimeout(scheduleCloudPush,400);
    return;
  }
  SYNC.pushTimer=setTimeout(pushToCloud,1800);
}
/* Registro de "esto se borró" — a diferencia de antes, esto vive DENTRO de los datos
   que se sincronizan (DB.settings._tombstones), no en la memoria de una sola pestaña.
   Así, si borras algo en un dispositivo y luego trabajas desde otro (o recargas la
   página antes de que termine de sincronizar), el borrado igual se respeta — antes,
   ese aviso solo existía en la pestaña donde se hizo el borrado y se perdía en
   cualquier otro caso, lo cual seguía permitiendo que reapareciera. */
function markDeleted(collectionKey,ids){
  if(!DB.settings._tombstones) DB.settings._tombstones={};
  DB.settings._tombstones[collectionKey]=DB.settings._tombstones[collectionKey]||{};
  const now=Date.now();
  (Array.isArray(ids)?ids:[ids]).forEach(id=>{ DB.settings._tombstones[collectionKey][id]=now; });
}
function pruneOldTombstones(){
  if(!DB.settings._tombstones) return;
  const cutoff=Date.now()-24*60*60*1000; // 24 horas de margen — de sobra para que todos los dispositivos ya hayan sincronizado
  Object.keys(DB.settings._tombstones).forEach(key=>{
    Object.keys(DB.settings._tombstones[key]).forEach(id=>{ if(DB.settings._tombstones[key][id]<cutoff) delete DB.settings._tombstones[key][id]; });
  });
}
async function pushToCloud(){
  if(!SYNC.client) return;
  /* Con muchas personas guardando a la vez (hasta 60), dos guardados casi
     simultáneos podían pisarse entre sí: cada uno leía la nube, mezclaba con lo
     suyo, y escribía sin comprobar si justo en ese instante alguien más ya
     había guardado algo distinto — el que terminara de escribir último ganaba
     y borraba silenciosamente el cambio del otro (así reaparecía algo borrado,
     o un paso de flujo aprobado "se devolvía" solo). Ahora la escritura es
     "todo o nada": solo se aplica si nadie más escribió mientras tanto; si
     alguien sí lo hizo, se vuelve a leer lo más reciente y se reintenta —
     nunca se sobrescribe a ciegas. */
  pruneOldTombstones();
  for(let attempt=0; attempt<6; attempt++){
    let remote=null;
    try{
      const res=await SYNC.client.from('ccd_app_data').select('data,version').eq('id',1).maybeSingle();
      if(res.error){ SYNC.status='error'; SYNC.lastError=syncErrMsg(res.error); console.warn('Error leyendo antes de guardar',res.error); return; }
      remote=res.data;
    }catch(e){ SYNC.status='error'; SYNC.lastError=syncErrMsg(e); return; }
    const baseVersion = remote ? (remote.version||0) : 0;
    /* Mi sesión (quién soy en este dispositivo) NUNCA viaja a la nube — se quita a propósito
       en cloudPayload() antes de cada guardado, para que nunca se pise la sesión de otra
       persona. Por eso, justo después de mezclar con lo que trae la nube, hay que
       restaurarla siempre — si no, cada guardado (es decir, casi cada clic) me dejaba sin
       usuario en memoria, y entonces cualquier acción posterior parecía "devolverme sola
       al login" aunque mi sesión seguía siendo válida. */
    const myIdBeforeMerge=DB.currentUserId;
    if(remote && remote.data){
      DB=mergeIncoming(remote.data);
      DB.currentUserId=myIdBeforeMerge;
    }
    const newVersion=baseVersion+1;
    let updated=null;
    try{
      const res=await SYNC.client.from('ccd_app_data').update({data:cloudPayload(),version:newVersion,updated_at:new Date().toISOString()})
        .eq('id',1).eq('version',baseVersion).select();
      if(res.error){ SYNC.status='error'; SYNC.lastError=syncErrMsg(res.error); console.warn('Error guardando en la nube',res.error); if(document.getElementById('syncBtn')) renderTopbar(); return; }
      updated=res.data;
    }catch(e){ SYNC.status='error'; SYNC.lastError=syncErrMsg(e); if(document.getElementById('syncBtn')) renderTopbar(); return; }
    if(updated && updated.length>0){
      // Éxito confirmado: nadie más escribió entre medio de mi lectura y mi escritura.
      SYNC.version=newVersion; DB.settings._syncVersion=newVersion; saveLocalOnly();
      captureSyncSnapshot(); // a partir de ahora, esto es lo último que sabemos que coincide con la nube
      SYNC.status='synced'; SYNC.lastError='';
      if(document.getElementById('syncBtn')) renderTopbar();
      return;
    }
    // La versión ya no era la esperada — alguien más guardó justo en medio.
    // Se reintenta desde el principio con la información más reciente.
  }
  SYNC.status='error';
  SYNC.lastError=STATE.lang==='en'?'Could not save — many people saving at once. Please try your action again.':'No se pudo guardar — muchas personas guardando a la vez. Intenta tu acción de nuevo.';
  if(document.getElementById('syncBtn')) renderTopbar();
}
function retrySync(){ toast(STATE.lang==='en'?'Testing connection…':'Probando conexión…'); pullFromCloud(true).then(()=>renderAll()); }
function subscribeRealtime(){
  if(!SYNC.client) return;
  if(SYNC.channel) SYNC.client.removeChannel(SYNC.channel);
  SYNC.channel=SYNC.client.channel('ccd_app_data_changes')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ccd_app_data'},()=>{
      /* Con muchas personas conectadas a la vez, varios cambios de distinta gente
         pueden llegar casi juntos — en vez de recargar todo por cada uno (lento,
         costoso en egress e innecesario con 60 personas activas), se agrupan y se
         hace una sola actualización un rato después del último cambio recibido. */
      if(SYNC.realtimeDebounce) clearTimeout(SYNC.realtimeDebounce);
      SYNC.realtimeDebounce=setTimeout(()=>pullFromCloud(false),6000);
    })
    .subscribe((status)=>{
      /* Si el canal en tiempo real se cae y se reconecta (el celular se bloqueó, cambió
         de red, la pestaña estuvo mucho tiempo en segundo plano...), esto se pone al día
         de inmediato en cuanto vuelve a conectar — sin esperar al sondeo de respaldo. */
      if(status==='SUBSCRIBED'){
        if(SYNC.wasDisconnected) pullFromCloud(false);
        SYNC.wasDisconnected=false;
      } else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        SYNC.wasDisconnected=true;
      }
    });
}
function offerInitialPush(){
  /* Esta es una acción MUY peligrosa: sobrescribe TODA la información compartida sin
     mezclar nada. Antes bastaba un clic en un cuadro de confirmación simple — eso fue
     justo lo que permitió que, por error, se subieran datos de ejemplo por encima de la
     información real de todo el equipo. Ahora: solo Dirección puede verla, y hace falta
     escribir una palabra exacta para confirmar — no un simple "Aceptar". */
  if(!isDirector()){ return; }
  const phrase=STATE.lang==='en'?'UPLOAD':'SUBIR';
  const warning=STATE.lang==='en'
    ? `⚠️ WARNING\n\nThe cloud database looks empty. This is rare — it usually means a connection problem, NOT that this is a brand-new setup.\n\nIf you continue, whatever is saved on THIS device right now will become the ONLY shared data for the whole team, permanently replacing anything currently in the cloud (if there is any).\n\nIf you are not 100% certain this is a genuinely new setup, cancel now.\n\nType ${phrase} (in capital letters) to confirm:`
    : `⚠️ ADVERTENCIA\n\nLa base de datos en la nube parece estar vacía. Esto es poco común — normalmente indica un problema de conexión, NO que esta sea una instalación nueva de verdad.\n\nSi continúas, lo que esté guardado en ESTE dispositivo ahora mismo se convertirá en el ÚNICO dato compartido para todo el equipo, reemplazando para siempre lo que haya en la nube (si hay algo).\n\nSi no estás 100% seguro de que esta es una configuración realmente nueva, cancela ahora.\n\nEscribe ${phrase} (en mayúsculas) para confirmar:`;
  const typed=prompt(warning);
  if(typed!==phrase) return;
  SYNC.version=1;
  SYNC.client.from('ccd_app_data').update({data:cloudPayload(),version:SYNC.version,updated_at:new Date().toISOString()}).eq('id',1)
    .then(({error})=>{ if(error){ toast(STATE.lang==='en'?'Upload failed.':'Falló la subida.'); console.warn(error); } else { SYNC.status='synced'; toast(STATE.lang==='en'?'Local data uploaded to the cloud.':'Datos locales subidos a la nube.'); subscribeRealtime(); } });
}
function sanitizeSupabaseUrl(url){
  url=(url||'').trim().replace(/^["']|["']$/g,''); // quita espacios/saltos y comillas al inicio/fin
  url=url.replace(/\/(rest|realtime|auth|storage)\/v1.*$/i,''); // quita /rest/v1 etc. si lo pegaron por error
  url=url.replace(/\/+$/,''); // quita barra(s) final(es)
  return url;
}
function connectSync(url,key){
  if(!isDirector()){ toast(t('no_permission')); return; }
  url=sanitizeSupabaseUrl(url); key=(key||'').trim().replace(/^["']|["']$/g,'');
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){
    toast(STATE.lang==='en'?'That URL doesn\'t look right. It should look exactly like: https://xxxxxxxxxxxx.supabase.co':'Esa URL no se ve bien. Debe verse exactamente así: https://xxxxxxxxxxxx.supabase.co');
    return;
  }
  saveSyncConfig({url,key}); toast(STATE.lang==='en'?'Connecting…':'Conectando…'); initSync().then(()=>renderAll());
}
function disconnectSync(){
  if(!isDirector()){ toast(t('no_permission')); return; }
  if(SYNC.channel && SYNC.client) SYNC.client.removeChannel(SYNC.channel);
  SYNC=Object.assign(SYNC,{client:null,channel:null,status:'off'});
  clearSyncConfig(); toast(STATE.lang==='en'?'Disconnected. Working locally again.':'Desconectado. Trabajando local de nuevo.'); renderAll();
}
function forcePushLocal(){
  if(!isDirector()){ toast(t('no_permission')); return; }
  if(!SYNC.client) return;
  /* Igual que offerInitialPush(): esto sobrescribe TODO sin mezclar nada. Un simple clic
     en "Aceptar" es demasiado fácil de dar sin pensarlo dos veces, así que ahora también
     hace falta escribir una palabra exacta para confirmar. */
  const phrase=STATE.lang==='en'?'OVERWRITE':'SOBRESCRIBIR';
  const warning=STATE.lang==='en'
    ? `⚠️ This replaces the CLOUD data (shared by everyone) with what is saved on THIS device right now — permanently. Anything others have added that this device doesn't have will be lost.\n\nType ${phrase} (in capital letters) to confirm:`
    : `⚠️ Esto reemplaza los datos de la NUBE (compartidos por todos) con lo que hay guardado en ESTE dispositivo ahora mismo — de forma permanente. Se perderá cualquier cosa que otros hayan agregado y que este dispositivo no tenga.\n\nEscribe ${phrase} (en mayúsculas) para confirmar:`;
  if(prompt(warning)!==phrase) return;
  SYNC.version++;
  DB.settings._syncVersion=SYNC.version; saveLocalOnly();
  SYNC.client.from('ccd_app_data').update({data:cloudPayload(),version:SYNC.version,updated_at:new Date().toISOString()}).eq('id',1)
    .then(({error})=>{ if(error) toast(STATE.lang==='en'?'Failed.':'Falló.'); else toast(STATE.lang==='en'?'Cloud data replaced with your local copy.':'Datos de la nube reemplazados con tu copia local.'); });
}
function forcePullCloud(){
  if(!isDirector()){ toast(t('no_permission')); return; }
  if(!SYNC.client) return;
  if(!confirm(STATE.lang==='en'?'This overwrites your local copy with the cloud data. Continue?':'Esto sobrescribe tu copia local con los datos de la nube. ¿Continuar?')) return;
  SYNC.version=-1; pullFromCloud(false);
}




/* ---------------- DERIVED LOGIC ---------------- */
function computedEnd(a){ if(a.actualEndDate) return a.actualEndDate; return addBusinessDays(a.startDate, a.duration); }
function isOverdue(a){ return a.status!=='completada' && a.status!=='cancelada' && a.dueDate < iso(today()); }
function daysToDue(a){ return diffDays(a.dueDate, iso(today())); }
function slack(a){ return diffDays(a.dueDate, computedEnd(a)); }
function visualStatus(a){
  if(a.status==='completada') return {label:statusLabel('completada'),cls:'b-ok'};
  if(a.status==='cancelada') return {label:statusLabel('cancelada'),cls:'b-muted'};
  if(a.status==='bloqueada') return {label:statusLabel('bloqueada'),cls:'b-block'};
  if(isOverdue(a)) return {label:statusLabel('vencida'),cls:'b-late'};
  if(flujoBloqueaCompletar(a)) return {label:STATE.lang==='en'?'Workflow in progress':'Flujo en curso',cls:'b-review'};
  if(a.status==='en_revision') return {label:statusLabel('en_revision'),cls:'b-review'};
  if(a.status==='devuelta') return {label:statusLabel('devuelta'),cls:'b-warn'};
  const d=daysToDue(a);
  if(d<=1) return {label:statusLabel('proxima'),cls:'b-warn'};
  return {label:statusLabel(a.status),cls:'b-muted'};
}
function riskLevel(a){
  if(a.status==='completada'||a.status==='cancelada') return null;
  if(isOverdue(a)) return 'Crítico';
  if(a.blocked && a.priority==='P1') return 'Crítico';
  const s=slack(a);
  if(a.priority==='P1' && s<=1) return 'Alto';
  if(s<0) return 'Alto';
  if(s<=2) return 'Medio';
  return 'Bajo';
}
function isCritical(a){
  if(a.status==='completada'||a.status==='cancelada') return false;
  return a.priority==='P1' || isOverdue(a) || a.blocked || dependents(a.id).length>=2;
}
/* Estado individual por persona: cada responsable/ejecutor puede marcar SU PARTE como
   pendiente, en curso, en revisión, completada o bloqueada — de forma independiente
   de los demás y del estado general de la actividad. */
const PERSON_ESTADOS=['pendiente','en_curso','en_revision','completado','bloqueado'];
function personEstadoLabel(k){
  const m={pendiente:{es:'Pendiente',en:'Pending',zh:'待处理'},en_curso:{es:'En curso',en:'In progress',zh:'进行中'},
    en_revision:{es:'En revisión',en:'In review',zh:'审核中'},completado:{es:'Completado',en:'Completed',zh:'已完成'},
    bloqueado:{es:'Bloqueado',en:'Blocked',zh:'已阻塞'}};
  return (m[k]&&m[k][STATE.lang])||(m[k]&&m[k].es)||k;
}
function personEstadoClass(k){ return {pendiente:'b-muted',en_curso:'b-warn',en_revision:'b-review',completado:'b-ok',bloqueado:'b-block'}[k]||'b-muted'; }
function personEstadoIcon(k){ return {pendiente:'⚪',en_curso:'🟡',en_revision:'🔵',completado:'🟢',bloqueado:'🟣'}[k]||'⚪'; }
function personStatusInfo(a,userId){ return (a.personStatus&&a.personStatus[userId]) || {estado:'pendiente',reason:'',fecha:''}; }
function personStatusPeople(a){ return [...new Set([...(a.responsibleIds||[]),...(a.executorIds||[])])]; }
/* La actividad no se puede dar por completada en general hasta que CADA responsable y
   ejecutor involucrado haya marcado su propia parte como completada — así nadie la cierra
   por todos sin que el resto haya terminado de verdad. Aplica aunque solo haya una persona:
   si esa persona no ha marcado su parte, la actividad tampoco puede pasar a completada. */
function peopleBlockCompletar(a){
  return personStatusPeople(a).some(pid=>personEffectiveEstado(a,pid)!=='completado');
}
/* Variante para la pantalla: no cuenta mi propia parte como bloqueo, porque marcar
   "Completada" también marca mi parte en el mismo clic — así el control no aparece
   deshabilitado solo porque yo todavía no había pasado por el panel de "Estado por
   persona" a marcarme manualmente. Si alguien MÁS sigue pendiente, sigue bloqueado. */
function peopleBlockCompletarUI(a){
  const me=currentUser();
  return personStatusPeople(a).some(pid=> pid!==(me&&me.id) && personEffectiveEstado(a,pid)!=='completado');
}
/* Si quien está completando la actividad es una de las personas involucradas y su
   propia parte todavía no está marcada, se marca aquí mismo — no hace falta un paso
   aparte por el panel de "Estado por persona" solo para poder completar tu propia tarea. */
function autoMarkOwnPersonStatus(a){
  const me=currentUser(); if(!me) return;
  if(a.flujo) return; // si hay flujo, el estado de la persona lo controla el flujo, no esto
  if(personStatusPeople(a).includes(me.id) && personEffectiveEstado(a,me.id)!=='completado'){
    if(!a.personStatus) a.personStatus={};
    a.personStatus[me.id]={estado:'completado',reason:'',fecha:iso(today())};
  }
}
function multiplePeoplePending(a){ return personStatusPeople(a).filter(pid=>personEffectiveEstado(a,pid)!=='completado'); }
/* Reasignar: cuando alguien termina su parte pero el trabajo depende de un tercero
   dentro de la organización (ej. legal, dirección) para el siguiente paso — se marca la
   parte de quien reasigna como completada, se agrega a la nueva persona como ejecutor
   con su propio estado en cero, y queda registrado en el historial para trazabilidad. */
function openReassignActivity(activityId,fromPersonId){
  const a=byId(DB.activities,activityId);
  if(!canSetPersonStatus(a,fromPersonId)){ toast(t('no_permission')); return; }
  openModal(STATE.lang==='en'?'Reassign':'Reasignar',`
    <p class="hint" style="margin-bottom:8px">${STATE.lang==='en'?'Mark your part as done and hand this off to someone else (e.g. legal, direction) for the next step. This stays visible in the activity history.':'Marca tu parte como terminada y pásale esto a alguien más (ej. legal, dirección) para el siguiente paso. Esto queda visible en el historial de la actividad.'}</p>
    <div class="form-row"><label>${STATE.lang==='en'?'Reassign to':'Reasignar a'}</label>${peoplePicker('reassign_to',DB.users,[],[])}</div>
    <div class="form-row"><label>${STATE.lang==='en'?'Reason (required)':'Motivo (obligatorio)'}</label><textarea id="reassign_reason" placeholder="${STATE.lang==='en'?'e.g. Draft ready — needs legal review':'Ej. Comunicado listo — falta revisión de legal'}"></textarea></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-primary" onclick="doReassignActivity('${activityId}','${fromPersonId}')">${STATE.lang==='en'?'Reassign':'Reasignar'}</button>`);
}
function doReassignActivity(activityId,fromPersonId){
  const a=byId(DB.activities,activityId);
  if(!canSetPersonStatus(a,fromPersonId)){ toast(t('no_permission')); return; }
  const toIds=ppGetValue('reassign_to');
  const reason=document.getElementById('reassign_reason').value.trim();
  if(!toIds.length){ toast(STATE.lang==='en'?'Choose who to reassign to.':'Elige a quién reasignar.'); return; }
  if(!reason){ toast(STATE.lang==='en'?'Please explain the reason.':'Por favor explica el motivo.'); return; }
  if(!a.personStatus) a.personStatus={};
  a.personStatus[fromPersonId]={estado:'completado',reason:'',fecha:iso(today())};
  a.executorIds=a.executorIds||[];
  toIds.forEach(id=>{ if(!a.executorIds.includes(id)) a.executorIds.push(id); if(!a.personStatus[id]) a.personStatus[id]={estado:'pendiente',reason:'',fecha:''}; });
  const toNames=toIds.map(userName).join(', ');
  pushHistory(a,currentUser(),'reasignado',userName(fromPersonId),`${toNames}: ${reason}`);
  notify(`🔁 ${a.code}: ${STATE.lang==='en'?'reassigned to':'reasignada a'} ${toNames} — ${reason}`,'nueva',a.id,toIds);
  saveDB(); closeModal(); renderAll();
}
function personBlockedCount(a){ return personStatusPeople(a).filter(id=>personEffectiveEstado(a,id)==='bloqueado').length; }
/* Solo la propia persona, su líder (de la misma disciplina) o Coordinación/Dirección
   pueden cambiar el estado de alguien más — un líder de otra disciplina no puede tocarlo. */
function canSetPersonStatus(a,targetUserId){
  const me=currentUser(); if(!me) return false;
  if(me.id===targetUserId) return true;
  const role=normRole(me);
  if(role==='subdirector'||role==='coordinador') return true;
  if(isLiderRole(role)){ const target=byId(DB.users,targetUserId); return !!(target && userDiscOverlap(me,target)); }
  return false;
}
/* Si esta persona pertenece a una disciplina que tiene una o varias etapas en el flujo
   de la actividad, su estado se amarra a la etapa que le toca AHORA: bloqueado mientras
   no esté disponible, en revisión / completado según corresponda — sin que nadie tenga
   que actualizarlo a mano. Si su disciplina participa varias veces en el flujo (ej. vuelve
   a Arquitectura después de una segunda revisión de Diseño Geométrico), se muestra siempre
   la ocurrencia que le corresponde actuar en este momento, no solo la primera. */
function personFlowStages(a,personId){
  if(!a.flujo) return [];
  const p=byId(DB.users,personId); if(!p) return [];
  return a.flujo.etapas.filter(e=>e.disciplinaId && userHasDisc(p,e.disciplinaId));
}
function personFlowStage(a,personId){
  const stages=personFlowStages(a,personId); if(!stages.length) return null;
  const actionable=stages.find(e=>['disponible','en_revision'].includes(a.flujo.estados[e.id].estado));
  if(actionable) return actionable;
  const blocked=stages.find(e=>a.flujo.estados[e.id].estado==='bloqueada');
  if(blocked) return blocked;
  return stages[stages.length-1];
}
function personEffectiveEstado(a,personId){
  const stage=personFlowStage(a,personId);
  if(stage){ const st=a.flujo.estados[stage.id].estado;
    if(st==='bloqueada') return 'bloqueado';
    if(st==='en_revision') return 'en_revision';
    if(st==='aprobado') return 'completado';
  }
  return personStatusInfo(a,personId).estado;
}
function flowPendingDepsNames(a,etapa){
  return (etapa.dependeDe||[]).filter(d=>a.flujo.estados[d].estado!=='aprobado')
    .map(d=>{ const de=a.flujo.etapas.find(x=>x.id===d); return de?de.nombre:''; }).filter(Boolean);
}
function approvePersonFlowStage(activityId,personId,etapaId){
  openApproveFlowStage(activityId,etapaId,personId);
}
function setPersonStatus(aid,userId,estado){
  const a=byId(DB.activities,aid);
  if(!canSetPersonStatus(a,userId)){ toast(t('no_permission')); return; }
  a.personStatus=a.personStatus||{};
  if(!a.personStatus[userId]) a.personStatus[userId]={estado:'pendiente',reason:'',fecha:''};
  const before=a.personStatus[userId].estado;
  if(before===estado) return;
  a.personStatus[userId].estado=estado; a.personStatus[userId].fecha=iso(today());
  pushHistory(a,currentUser(),'estado-personal',`${userName(userId)}: ${personEstadoLabel(before)}`,personEstadoLabel(estado));
  notify(`${personEstadoIcon(estado)} ${a.code}: ${userName(userId)} → ${personEstadoLabel(estado)}`,estado==='bloqueado'?'bloqueo':'nueva',a.id);
  saveDB(); renderAll();
}
function setPersonStatusReason(aid,userId,val){
  const a=byId(DB.activities,aid);
  if(!canSetPersonStatus(a,userId)){ toast(t('no_permission')); return; }
  a.personStatus=a.personStatus||{};
  if(!a.personStatus[userId]) a.personStatus[userId]={estado:'pendiente',reason:'',fecha:''};
  a.personStatus[userId].reason=val; saveDB();
}
function normRole(u){ if(!u) return 'visitante'; return u.role && u.role.trim ? u.role.trim() : u.role; }
/* Si el objeto de permisos de un rol llegara a faltar (por ejemplo, por una sincronización
   vieja que sobrescribió DB.settings antes de las correcciones más recientes), esto ya NO
   se queda simplemente "sin permiso para nada" — se autocura al vuelo con los permisos por
   defecto de ese rol. Antes, un rol sin su objeto de permisos hacía que TODAS las pestañas
   parecieran bloqueadas (siempre rebotaba a "Panel general"), que es justo lo que se sentía
   como "no me deja entrar a ninguna pestaña". */
function ensureRolePerms(role){
  let p=DB.settings.permissions[role];
  if(!p){ const d=defaultPermissions()[role]; if(d){ p=DB.settings.permissions[role]={...d,views:[...d.views]}; saveDB(); } }
  return p;
}
function perm(role,key){ const p=ensureRolePerms(role); return p ? p[key] : false; }
function navAllowed(role,viewId){ const p=ensureRolePerms(role); return p && p.views.includes(viewId); }
function can(action){ const u=currentUser(); return u && perm(normRole(u),action); }
function canManageUsers(){ const r=normRole(currentUser()); return r==='subdirector'||r==='coordinador'; }
/* Un líder solo puede eliminar registros creados por él mismo o por alguien de su propia disciplina (su equipo) */
function canDeleteRecord(creatorId){
  const u=currentUser(); const role=normRole(u);
  if(role==='subdirector'||role==='coordinador') return can('delete');
  if(isLiderRole(role)){
    if(!perm(role,'delete')) return false;
    if(!creatorId) return false;
    if(creatorId===u.id) return true;
    const creator=byId(DB.users,creatorId);
    return !!(creator && userDiscOverlap(creator,u));
  }
  return can('delete');
}
function scopeForUser(u){
  if(!u) return [];
  const role=normRole(u);
  if(role==='subdirector'||role==='coordinador'||role==='visitante') return DB.activities;
  if(isLiderRole(role)) return DB.activities.filter(a=> (a.responsibleIds||[]).includes(u.id) || (a.disciplines||[]).some(d=>userHasDisc(u,d)) || a.createdBy===u.id);
  return DB.activities.filter(a=> (a.executorIds||[]).includes(u.id) || (a.responsibleIds||[]).includes(u.id));
}
function currentUser(){ return byId(DB.users, DB.currentUserId); }

/* ---------------- CONFLICTOS DE AGENDA ---------------- */
function peopleOf(a){ return [...(a.responsibleIds||[]),...(a.executorIds||[])]; }
function findScheduleConflicts(peopleIds,start,end,excludeId){
  if(!peopleIds||!peopleIds.length) return [];
  return DB.activities.filter(a=> a.id!==excludeId && !a.parentId && !['completada','cancelada'].includes(a.status)
    && peopleOf(a).some(p=>peopleIds.includes(p)) && !(computedEnd(a)<start || a.startDate>end));
}

/* ---------------- NOTIFICATIONS ---------------- */
function pushHistory(a,user,action,before,after){
  a.history.push({date:iso(today())+' '+new Date().toLocaleTimeString(STATE_LOCALE(),{hour:'2-digit',minute:'2-digit'}),user:user.id,action,before,after});
}
function notify(text,type,activityId,toUserIds,systemGenerated,subjectUserId,licenseId){
  const actor=currentUser();
  DB.notifications.unshift({id:uid('N'),text,type,activityId:activityId||null,date:nowStamp(),read:false,toUserIds:toUserIds||null,actorId:systemGenerated?null:(actor?actor.id:null),subjectUserId:subjectUserId||null,licenseId:licenseId||null});
  /* Con 60 personas trabajando a la vez, este arreglo crecería sin límite — cada
     guardado (de cualquiera) envía TODA la base de datos, así que dejarlo crecer
     sin tope haría cada guardado más pesado y lento para todos con el tiempo. */
  if(DB.notifications.length>500) DB.notifications.length=500;
}
function unreadCount(){ const u=currentUser(); if(!u) return 0; return DB.notifications.filter(n=> !n.read && n.type!=='licencia' && notificationVisibleTo(n,u)).length; }
function liveAlerts(){
  const alerts=[]; const [d7]=DB.settings.alertDays;
  DB.activities.filter(a=>!['completada','cancelada'].includes(a.status)).forEach(a=>{
    const d=daysToDue(a);
    if(isOverdue(a)) alerts.push({level:'red',icon:'🔴',text:`${a.code} · ${a.name}`,a});
    else if(d<=1) alerts.push({level:'orange',icon:'🟠',text:`${a.code} · ${a.name}`,a});
    else if(d<=3) alerts.push({level:'amber',icon:'🟡',text:`${a.code} · ${a.name}`,a});
    else if(d<=d7) alerts.push({level:'green',icon:'🟢',text:`${a.code} · ${a.name}`,a});
    if(a.blocked) alerts.push({level:'purple',icon:'🟣',text:`${a.code} · ${a.name}`,a});
  });
  return alerts;
}
function escalationAlerts(){
  const out=[];
  DB.activities.filter(a=>isOverdue(a)&&!['completada','cancelada'].includes(a.status)).forEach(a=>{
    const d=Math.abs(daysToDue(a)); let escTo=roleLabel('lider');
    if(d>=DB.settings.escalationDaysSubdirector || a.priority==='P1') escTo=roleLabel('subdirector');
    else if(d>=DB.settings.escalationDaysCoordinador) escTo=roleLabel('coordinador');
    out.push({a,escTo,dias:d});
  });
  return out;
}

/* ---------------- DEPENDENCY / SCHEDULE ENGINE ---------------- */
function impactOf(activityId){
  const seen=new Set(); const queue=[activityId]; const affected=[];
  while(queue.length){ const cur=queue.shift();
    dependents(cur).forEach(dep=>{ if(!seen.has(dep.id)){ seen.add(dep.id); affected.push(dep); queue.push(dep.id); } });
  }
  const p1Hit=affected.filter(a=>a.priority==='P1').length;
  return {affected,p1Hit};
}
function recalcFrom(activityId){
  const start=byId(DB.activities,activityId); const queue=[start]; let moved=0;
  while(queue.length){
    const cur=queue.shift(); const end=computedEnd(cur);
    dependents(cur.id).forEach(dep=>{
      const rel=dep.dependencies.find(d=>d.id===cur.id); let newStart=dep.startDate;
      if(rel.type==='FS') newStart=end; else if(rel.type==='SS') newStart=cur.startDate;
      else if(rel.type==='FF') newStart=addBusinessDays(end,-dep.duration); else if(rel.type==='SF') newStart=addBusinessDays(cur.startDate,-dep.duration);
      if(newStart!==dep.startDate){ dep.startDate=newStart; dep.dueDate=addBusinessDays(newStart,dep.duration); moved++; queue.push(dep); }
    });
  }
  return moved;
}

     guardada — así que si algo disparaba un renderAll() antes de terminar de cambiar

     posterior con "Cannot read properties of undefined". Ahora se limpia primero, y no

  DB.currentUserId=null; saveLocalOnly();

/* Preserva foco/cursor de inputs (buscadores) al re-renderizar, para poder escribir letra por letra */
function withFocusPreserved(renderFn){
  const active=document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart==='number')? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd==='number')? active.selectionEnd : null;
  renderFn();
  if(activeId){
    const el=document.getElementById(activeId);
    if(el){ el.focus({preventScroll:true}); if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart,selEnd); }catch(e){} } }
  }
}
