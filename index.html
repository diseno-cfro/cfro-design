function openAssignFlow(activityId){
  if(!can('edit')){ toast(t('no_permission')); return; }
  if(!DB.flujoTemplates.length){ toast(STATE.lang==='en'?'Create a template first, in Flujos.':'Primero crea una plantilla, en Flujos.'); return; }
  openModal(STATE.lang==='en'?'Assign workflow':'Asignar flujo',`
    <div class="form-row"><label>${STATE.lang==='en'?'Template':'Plantilla'}</label><select id="fl_template">${DB.flujoTemplates.map(tp=>`<option value="${tp.id}">${esc(tp.nombre)} (${esc(tp.contexto)})</option>`).join('')}</select></div>
    <p class="hint">${STATE.lang==='en'?'The same template can be reused on as many similar activities as needed (e.g. every station).':'La misma plantilla se puede reutilizar en tantas actividades similares como necesites (ej. cada estación).'}</p>
  `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-primary" onclick="doAssignFlow('${activityId}')">${STATE.lang==='en'?'Assign':'Asignar'}</button>`);
}
function doAssignFlow(activityId){
  const a=byId(DB.activities,activityId); const tpl=byId(DB.flujoTemplates,document.getElementById('fl_template').value); if(!tpl||!tpl.etapas.length) return;
  const etapas=tpl.etapas.map(e=>({id:e.id,nombre:e.nombre,disciplinaId:e.disciplinaId,dependeDe:[...(e.dependeDe||[])]}));
  const estados=initFlowEstados(etapas);
  const primeras=etapas.filter(e=>!e.dependeDe.length);
  a.flujo={templateId:tpl.id,templateNombre:tpl.nombre,etapas,estados,
    historial:primeras.map(e=>({fecha:iso(today()),etapaId:e.id,etapaNombre:e.nombre,accion:'inicio',usuario:currentUser().id,comentario:''}))};
  pushHistory(a,currentUser(),'flujo-asignado',null,tpl.nombre);
  notify(`🔀 ${a.code}: ${STATE.lang==='en'?'workflow assigned':'flujo asignado'} "${tpl.nombre}"`,'nueva',a.id);
  syncProgressFromFlow(a);
  saveDB(); closeModal(); renderAll();
}
function setFlowStageReview(activityId,etapaId){
  const a=byId(DB.activities,activityId); const f=a.flujo; if(!f) return;
  if(!canApproveFlowStage(a,etapaId)){ toast(t('no_permission')); return; }
  const st=f.estados[etapaId]; if(st.estado!=='disponible') return;
  st.estado='en_revision'; st.usuario=currentUser().id;
  const etapa=f.etapas.find(e=>e.id===etapaId);
  f.historial.push({fecha:iso(today()),etapaId,etapaNombre:etapa.nombre,accion:'revision',usuario:currentUser().id,comentario:''});
  pushHistory(a,currentUser(),'flujo-etapa-revision',null,etapa.nombre);
  saveDB(); renderAll();
}
/* Aprobar SIEMPRE pide el motivo — queda en el historial de auditoría. */
function openApproveFlowStage(activityId,etapaId,personId){
  const a=byId(DB.activities,activityId);
  if(!canApproveFlowStage(a,etapaId)){ toast(t('no_permission')); return; }
  const etapa=a.flujo.etapas.find(e=>e.id===etapaId);
  openModal((STATE.lang==='en'?'Approve — ':'Aprobar — ')+esc(etapa.nombre),`
    <div class="form-row"><label>${STATE.lang==='en'?'Reason / comments (required)':'Motivo / comentarios (obligatorio)'}</label><textarea id="fl_comment" placeholder="${STATE.lang==='en'?'Why is this being approved?':'¿Por qué se aprueba?'}"></textarea></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-primary" onclick="doApproveFlowStage('${activityId}','${etapaId}'${personId?`,'${personId}'`:''})">${STATE.lang==='en'?'Approve':'Aprobar'}</button>`);
}
function doApproveFlowStage(activityId,etapaId,personId){
  const comentario=document.getElementById('fl_comment').value.trim();
  if(!comentario){ toast(STATE.lang==='en'?'Please explain the reason.':'Por favor explica el motivo.'); return; }
  const a=byId(DB.activities,activityId); const f=a.flujo; if(!f) return;
  if(!canApproveFlowStage(a,etapaId)){ toast(t('no_permission')); return; }
  const st=f.estados[etapaId]; if(!st||!['disponible','en_revision'].includes(st.estado)) return;
  const etapa=f.etapas.find(e=>e.id===etapaId);
  if(flowStageHasPendingSubtasks(a,etapa)){
    const names=flowStagePendingSubtasksList(a,etapa).map(s=>s.code).join(', ');
    toast(STATE.lang==='en'?`Cannot approve — pending subtask(s): ${names}`:`No se puede aprobar — hay subtarea(s) pendiente(s): ${names}`);
    return;
  }
  st.estado='aprobado'; st.fecha=iso(today()); st.usuario=currentUser().id; st.comentario=comentario;
  f.historial.push({fecha:iso(today()),etapaId,etapaNombre:etapa.nombre,accion:'aprobado',usuario:currentUser().id,comentario});
  // desbloquea etapas cuyas dependencias quedaron TODAS aprobadas (posible paralelismo)
  f.etapas.forEach(e=>{
    if(f.estados[e.id].estado==='bloqueada' && e.dependeDe && e.dependeDe.includes(etapaId)){
      if(e.dependeDe.every(d=>f.estados[d].estado==='aprobado')) f.estados[e.id].estado='disponible';
    }
  });
  pushHistory(a,currentUser(),'flujo-etapa-aprobada',null,etapa.nombre);
  notify(`🔀 ${a.code}: "${etapa.nombre}" ${STATE.lang==='en'?'approved':'aprobada'}`,'nueva',a.id);
  if(personId && a.personStatus && a.personStatus[personId]){ a.personStatus[personId].estado='completado'; a.personStatus[personId].fecha=iso(today()); }
  syncProgressFromFlow(a);
  notifyFlowCompleteIfDone(a);
  saveDB(); closeModal(); renderAll();
}
function flowCascadeReset(f,etapaId,visited){
  visited=visited||new Set();
  f.etapas.forEach(e=>{
    if(visited.has(e.id)) return;
    if(e.dependeDe && e.dependeDe.includes(etapaId) && f.estados[e.id].estado!=='bloqueada'){
      f.estados[e.id]={estado:'bloqueada',fecha:'',usuario:'',comentario:''};
      visited.add(e.id);
      flowCascadeReset(f,e.id,visited);
    }
  });
}
/* Devolver funciona en dos casos distintos:
   - La etapa todavía NO se ha aprobado (disponible/en revisión): la disciplina que la
     recibió la rechaza — se devuelve a la etapa anterior que se la entregó, esa etapa
     anterior vuelve a "disponible" (se deshace su aprobación) y esta se bloquea de nuevo.
   - La etapa YA estaba aprobada: se deshace la propia aprobación (se reabre esta etapa). */
function openReturnFlowStage(activityId,etapaId){
  const a=byId(DB.activities,activityId); const f=a.flujo; if(!f) return;
  if(!canApproveFlowStage(a,etapaId)){ toast(t('no_permission')); return; }
  const etapa=f.etapas.find(e=>e.id===etapaId); const st=f.estados[etapaId].estado;
  if(st==='disponible'||st==='en_revision'){
    const preds=flowStagePredecessors(f,etapa);
    if(!preds.length){ toast(STATE.lang==='en'?'This is the first stage — there is nothing to return it to.':'Esta es la primera etapa — no hay a quién devolverla.'); return; }
    openModal((STATE.lang==='en'?'Return — ':'Devolver — ')+esc(etapa.nombre),`
      ${preds.length>1?`<div class="form-row"><label>${STATE.lang==='en'?'Return to':'Devolver a'}</label><select id="fl_return_target">${preds.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></div>`
        :`<input type="hidden" id="fl_return_target" value="${preds[0].id}"><p class="hint">${STATE.lang==='en'?'Will be returned to':'Se devolverá a'}: <b>${esc(preds[0].nombre)}</b></p>`}
      <div class="form-row"><label>${STATE.lang==='en'?'Reason (required)':'Motivo (obligatorio)'}</label><textarea id="fl_comment" placeholder="${STATE.lang==='en'?"What's wrong / what needs fixing?":'¿Qué está mal o qué falta ajustar?'}"></textarea></div>
    `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-primary" onclick="doRejectFlowStage('${activityId}','${etapaId}')">${STATE.lang==='en'?'Return':'Devolver'}</button>`);
  } else if(st==='aprobado'){
    openModal((STATE.lang==='en'?'Undo approval — ':'Deshacer aprobación — ')+esc(etapa.nombre),`
      <div class="form-row"><label>${STATE.lang==='en'?'Reason (required)':'Motivo (obligatorio)'}</label><textarea id="fl_comment" placeholder="${STATE.lang==='en'?'Why is this being undone?':'¿Por qué se deshace?'}"></textarea></div>
      <p class="hint">${STATE.lang==='en'?'Any later stage that already moved forward because of this one will be reverted too.':'Cualquier etapa posterior que ya había avanzado gracias a esta también se revertirá.'}</p>
    `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-primary" onclick="doUndoFlowStage('${activityId}','${etapaId}')">${STATE.lang==='en'?'Undo':'Deshacer'}</button>`);
  }
}
function doRejectFlowStage(activityId,etapaId){
  const comentario=document.getElementById('fl_comment').value.trim();
  if(!comentario){ toast(STATE.lang==='en'?'Please explain the reason.':'Por favor explica el motivo.'); return; }
  const a=byId(DB.activities,activityId); const f=a.flujo;
  const targetId=document.getElementById('fl_return_target').value;

/* Devolver a un paso específico (no solo al inmediatamente anterior). Si el destino no es
   la etapa anterior ni la siguiente inmediata, se genera una alerta grande — un salto así
   normalmente implica que hace falta reunir a todas las disciplinas del flujo. */
function openReturnToStepFlow(activityId){
  const a=byId(DB.activities,activityId); const f=a.flujo; if(!f) return;
  if(!can('edit')){ toast(t('no_permission')); return; }
  openModal(STATE.lang==='en'?'Return to a specific step':'Devolver a un paso específico',`
    <div class="form-row"><label>${STATE.lang==='en'?'Return to step':'Devolver al paso'}</label><select id="fl_to">${f.etapas.map((e)=>`<option value="${e.id}">#${flowEtapaNivel(f.etapas,e.id,{})+1} ${esc(e.nombre)}</option>`).join('')}</select></div>
    <div class="form-row"><label>${STATE.lang==='en'?'Reason (required)':'Motivo (obligatorio)'}</label><textarea id="fl_comment" placeholder="${STATE.lang==='en'?'Why does it need to go back this far?':'¿Por qué hay que devolverlo tan atrás?'}"></textarea></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-primary" onclick="doReturnToStepFlow('${activityId}')">${STATE.lang==='en'?'Return':'Devolver'}</button>`);
}
function doReturnToStepFlow(activityId){
  const comentario=document.getElementById('fl_comment').value.trim();
  if(!comentario){ toast(STATE.lang==='en'?'Please explain the reason.':'Por favor explica el motivo.'); return; }
  const a=byId(DB.activities,activityId); const f=a.flujo;
  const toId=document.getElementById('fl_to').value;
  const cache={};
  // El punto de partida se determina solo: la etapa más avanzada que esté activa ahora
  // mismo (o, si ninguna lo está, la más avanzada ya aprobada) — no hace falta preguntarlo.
  const accionables=f.etapas.filter(e=>['disponible','en_revision'].includes(f.estados[e.id].estado));
  const masAvanzada=(list)=>list.reduce((best,e)=>flowEtapaNivel(f.etapas,e.id,cache)>flowEtapaNivel(f.etapas,best.id,cache)?e:best,list[0]);
  const fromE = accionables.length ? masAvanzada(accionables) : (f.etapas.some(e=>f.estados[e.id].estado==='aprobado') ? masAvanzada(f.etapas.filter(e=>f.estados[e.id].estado==='aprobado')) : f.etapas[0]);
  const fromId=fromE.id;
  if(fromId===toId) return;
  const toE=f.etapas.find(e=>e.id===toId);
  const fromN=flowEtapaNivel(f.etapas,fromId,cache), toN=flowEtapaNivel(f.etapas,toId,cache);
  const isAdjacent = Math.abs(fromN-toN)<=1 || (fromE.dependeDe||[]).includes(toId) || (toE.dependeDe||[]).includes(fromId);
  // Vuelve a "disponible" el destino y todo lo que quedaba entre medio, y bloquea de nuevo lo posterior al destino.
  f.estados[toId]={estado:'disponible',fecha:'',usuario:'',comentario:''};
  flowCascadeReset(f,toId);
  const toNum=flowEtapaNivel(f.etapas,toId,{})+1;
  f.historial.push({fecha:iso(today()),etapaId:toId,etapaNombre:toE.nombre,accion:'devuelto',usuario:currentUser().id,
    comentario:`${STATE.lang==='en'?'Returned to step':'Devuelto al paso'} #${toNum} (${toE.nombre}): ${comentario}`});
  pushHistory(a,currentUser(),'flujo-etapa-devuelta',fromE.nombre,toE.nombre);
  notify(`↩️ ${a.code}: ${STATE.lang==='en'?'returned to step':'devuelto al paso'} #${toNum} "${toE.nombre}" — ${comentario}`,'bloqueo',a.id);
  if(!isAdjacent){
    notify(`🔴🔴 ${a.code}: ${STATE.lang==='en'?'BIG JUMP in the workflow — a meeting with everyone in the workflow is recommended':'SALTO GRANDE en el flujo — se recomienda reunión con todos los del flujo'} ("${toE.nombre}")`,'bloqueo',a.id);
  }
  syncProgressFromFlow(a);
  saveDB(); closeModal();
  if(!isAdjacent){
    // Alerta grande e inmediata — no basta con dejarla guardada para verla después en Notificaciones.
    openModal(`🔴 ${STATE.lang==='en'?'BIG JUMP IN THE WORKFLOW':'SALTO GRANDE EN EL FLUJO'}`,`
      <div style="background:var(--red-dim);border:1px solid var(--red);border-radius:10px;padding:14px;color:var(--red);font-weight:600;margin-bottom:10px">
        ${a.code} · ${esc(a.name)}<br>
        ${STATE.lang==='en'?'Returned to step':'Devuelto al paso'} #${toNum} "${esc(toE.nombre)}".
      </div>
      <p class="hint">${STATE.lang==='en'?'This is not a return to the immediately previous/next step — it is strongly recommended to hold a meeting with everyone involved in this workflow before continuing.':'No es una devolución al paso inmediatamente anterior/siguiente — se recomienda fuertemente reunir a todos los involucrados en este flujo antes de continuar.'}</p>
      <p style="margin-top:8px"><b>${STATE.lang==='en'?'Reason given':'Motivo dado'}:</b> ${esc(comentario)}</p>
    `,`<button class="btn btn-primary" onclick="closeModal()">${STATE.lang==='en'?'Understood':'Entendido'}</button>`);
  } else {
    renderAll();
  }
}

function saveEditFlowStage(tplId,stageId){
  const tpl=byId(DB.flujoTemplates,tplId); const e=tpl.etapas.find(x=>x.id===stageId); if(!e) return;
  const nombre=document.getElementById('ftx_name').value.trim(); if(!nombre) return;
  e.nombre=nombre;
  e.disciplinaId=document.getElementById('ftx_disc').value||null;
  const newDeps=[...document.getElementById('ftx_deps').selectedOptions].map(o=>o.value);
  // Evita que una etapa termine dependiendo (directa o indirectamente) de sí misma.
  const wouldCycle=(targetId,startId,visited)=>{
    visited=visited||new Set(); if(targetId===startId) return true; if(visited.has(targetId)) return false; visited.add(targetId);
    const t2=tpl.etapas.find(x=>x.id===targetId); if(!t2) return false;
    return (t2.dependeDe||[]).some(d=>wouldCycle(d,startId,visited));
  };
  e.dependeDe=newDeps.filter(d=>!wouldCycle(d,stageId));
  saveDB(); closeModal(); openEditFlowTemplate(tplId);
}
function deleteFlowTemplate(id){

  DB.flujoTemplates=DB.flujoTemplates.filter(t2=>t2.id!==id); markDeleted('flujoTemplates',id); saveDB(); closeModal(); renderAll();
}

function mondayOf(dateStr){
  const d=new Date(dateStr+'T00:00:00'); const day=d.getDay(); const diff=(day===0)?-6:(1-day);

}

function addSala(){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  const name=document.getElementById('sala_name').value.trim(); if(!name) return;
  DB.salas.push({id:uid('SALA'),name}); saveDB(); openManageSalas();
}
function removeSala(id){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  if(DB.reservasSalas.some(r=>r.salaId===id)){ toast(STATE.lang==='en'?'This room has existing bookings — cancel them first.':'Esta sala tiene reservas — cancélalas primero.'); return; }
  if(!confirm(STATE.lang==='en'?'Delete this room?':'¿Eliminar esta sala?')) return;
  DB.salas=DB.salas.filter(s=>s.id!==id); markDeleted('salas',id); saveDB(); openManageSalas();
}
function openBookSala(salaId,fecha,slot){
  openModal(STATE.lang==='en'?'Book room':'Reservar sala',`
    <p class="hint" style="margin-bottom:8px">${fmtDate(fecha)} · ${slot}</p>
    <div class="form-row"><label>${STATE.lang==='en'?'Reason (optional)':'Motivo (opcional)'}</label><input type="text" id="sala_motivo" placeholder="${STATE.lang==='en'?'e.g. Team meeting':'Ej. Reunión de equipo'}"></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-primary" onclick="doBookSala('${salaId}','${fecha}','${slot}')">${STATE.lang==='en'?'Book':'Reservar'}</button>`);
}
function doBookSala(salaId,fecha,slot){
  if(DB.reservasSalas.some(r=>r.salaId===salaId&&r.fecha===fecha&&r.slot===slot)){ toast(STATE.lang==='en'?'That slot was just taken — pick another.':'Ese horario se acaba de ocupar — elige otro.'); closeModal(); renderAll(); return; }
  const motivo=document.getElementById('sala_motivo').value.trim();
  DB.reservasSalas.push({id:uid('RES'),salaId,fecha,slot,userId:currentUser().id,motivo,createdAt:iso(today())});
  saveDB(); closeModal(); toast(STATE.lang==='en'?'Room booked.':'Sala reservada.'); renderAll();
}
function cancelReservaSala(id){
  const r=byId(DB.reservasSalas,id); if(!r) return;
  if(!(currentUser().id===r.userId || canManageUsers())){ toast(t('no_permission')); return; }
  DB.reservasSalas=DB.reservasSalas.filter(x=>x.id!==id); markDeleted('reservasSalas',id); saveDB(); renderAll();
}

function saveEditUser(id){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  const u=byId(DB.users,id);
  const newUsername=document.getElementById('eu_username').value.trim()||u.username;
  if(DB.users.some(x=>x.id!==id && (x.username||'').toLowerCase()===newUsername.toLowerCase())){ toast(STATE.lang==='en'?'Username already exists.':'Ese usuario ya existe.'); return; }
  u.name=document.getElementById('eu_name').value.trim()||u.name;
  u.cargo=document.getElementById('eu_cargo').value.trim();
  u.role=document.getElementById('eu_role').value;
  u.disciplinaIds=[...document.getElementById('eu_disc').selectedOptions].map(o=>o.value);
  u.especialistaDeId= u.role==='especialista' ? (document.getElementById('eu_especialista_de').value||null) : null;
  u.email=document.getElementById('eu_email').value.trim();
  u.hireDate=document.getElementById('eu_hire').value||'';

}
function addVacation(userId){
  const s=document.getElementById('vac_start').value, e=document.getElementById('vac_end').value;
  if(!s||!e||e<s) return;
  const u=byId(DB.users,userId); u.vacations=u.vacations||[]; u.vacations.push({id:uid('VAC'),start:s,end:e});
  saveDB(); openEditUser(userId);
}
function removeVacation(userId,vacId){ const u=byId(DB.users,userId); u.vacations=(u.vacations||[]).filter(v=>v.id!==vacId); saveDB(); openEditUser(userId); }
function addLicense(userId){
  const n=document.getElementById('lic_name').value.trim(), e=document.getElementById('lic_expiry').value;
  if(!n||!e) return;
  const u=byId(DB.users,userId); u.licenses=u.licenses||[]; u.licenses.push({id:uid('LIC'),name:n,expiry:e});
  saveDB(); openEditUser(userId);
}
function removeLicense(userId,licId){
  const u=byId(DB.users,userId); u.licenses=(u.licenses||[]).filter(l=>l.id!==licId);
  // Al quitar/renovar una licencia, su alerta ya no aplica — se limpia con ella.
  const staleIds=DB.notifications.filter(n=>n.type==='licencia'&&n.licenseId===licId).map(n=>n.id);
  if(staleIds.length){ DB.notifications=DB.notifications.filter(n=>!staleIds.includes(n.id)); markDeleted('notifications',staleIds); }
  saveDB(); openEditUser(userId);
}
function toggleLicenseExempt(userId,val){ const u=byId(DB.users,userId); u.licenseExempt=val; saveDB(); openEditUser(userId); }
function deleteUser(id){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  const used=DB.activities.some(a=>(a.responsibleIds||[]).includes(id)||(a.executorIds||[]).includes(id));
  const msg=used?(STATE.lang==='en'?'This person is referenced in activities. Delete anyway?':'Esta persona está referenciada en actividades. ¿Eliminar de todas formas?'):(STATE.lang==='en'?'Delete this user?':'¿Eliminar este usuario?');
  if(!confirm(msg)) return;
  DB.users=DB.users.filter(u=>u.id!==id); markDeleted('users',id);
  // Al eliminar a alguien, cualquier alerta de licencia sobre esa persona ya no tiene sentido.
  const removedNotifIds=DB.notifications.filter(n=>n.subjectUserId===id).map(n=>n.id);
  DB.notifications=DB.notifications.filter(n=>n.subjectUserId!==id); markDeleted('notifications',removedNotifIds);
  saveDB(); renderAll();
}

async function exportLicensesExcel(){
  if(typeof ExcelJS==='undefined'){ toast(STATE.lang==='en'?'Excel library failed to load (check your internet connection).':'No se pudo cargar la librería de Excel (revisa tu conexión a internet).'); return; }
  const wb=new ExcelJS.Workbook(); const ws=wb.addWorksheet(STATE.lang==='en'?'Licenses':'Licencias');
  ws.columns=[
    {header:t('th_name'),key:'f1',width:24},{header:t('th_role'),key:'f2',width:18},{header:t('th_discipline'),key:'f3',width:22},
    {header:STATE.lang==='en'?'License':'Licencia',key:'f4',width:22},{header:STATE.lang==='en'?'Expires':'Vence',key:'f5',width:14},
    {header:STATE.lang==='en'?'Status':'Estado',key:'f6',width:16},
  ];
  ws.getRow(1).font={bold:true};
  DB.users.forEach(u=>{
    if(!(u.licenses||[]).length){ ws.addRow({f1:u.name,f2:roleLabel(normRole(u)),f3:userDiscNames(u),f4:'—',f5:'—',f6:STATE.lang==='en'?'No license':'Sin licencia'}); return; }
    u.licenses.forEach(l=>{ const d=diffDays(l.expiry,iso(today())); const est=d<0?(STATE.lang==='en'?'Expired':'Vencida'):d<=30?(STATE.lang==='en'?`${d}d left`:`${d}d restantes`):(STATE.lang==='en'?'OK':'Vigente');
      ws.addRow({f1:u.name,f2:roleLabel(normRole(u)),f3:userDiscNames(u),f4:l.name,f5:fmtDateYear(l.expiry),f6:est}); });
  });
  addExcelLogoHeader(wb,ws);
  const buf=await wb.xlsx.writeBuffer(); const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob); const link=document.createElement('a'); link.href=url; link.download='licencias.xlsx'; link.click();
  toast(STATE.lang==='en'?'Excel downloaded.':'Excel descargado.');
}
/* Alerta a Dirección/Coordinación 30 días antes de que venza una licencia (una sola vez por licencia) */
function checkLicenseAlerts(){
  let changed=false;
  const managers=DB.users.filter(x=>normRole(x)==='subdirector'||normRole(x)==='coordinador').map(x=>x.id);
  DB.users.forEach(u=>{
    (u.licenses||[]).forEach(l=>{
      const d=diffDays(l.expiry,iso(today()));
      /* Antes se usaba una bandera guardada en la propia licencia para saber "¿ya avisé?"
         — pero con varios dispositivos revisando casi al mismo tiempo, dos podían decidir
         "no, avisa tú" antes de que ninguno supiera que el otro ya lo había hecho, y ambos
         generaban su propia notificación (duplicados). Ahora se revisa directamente si ya
         existe una notificación para ESTA licencia específica antes de crear otra. */
      const yaAvisado=DB.notifications.some(n=>n.type==='licencia'&&n.licenseId===l.id);
      if(!yaAvisado && !isNaN(d) && d<=30 && d>=0){
        notify(`🟡 ${STATE.lang==='en'?'License expiring soon':'Licencia próxima a vencer'}: ${u.name} — ${l.name} (${fmtDate(l.expiry)})`,'licencia',null,managers,true,u.id,l.id);
        l.alertEnviada=true; changed=true;
      }
      if(l.alertEnviada && (isNaN(d)||d>30)) l.alertEnviada=false;
    });
  });
  if(changed) saveDB();
}

function togglePermView(role,view,checked){
  if(!canEditRoleColumn(role)){ toast(t('no_permission')); return; }
  const p=DB.settings.permissions[role];
  if(checked){ if(!p.views.includes(view)) p.views.push(view); } else { p.views=p.views.filter(v=>v!==view); }
  saveDB(); renderAll();
}

  compressImageFile(f,400,0.85).then(dataUrl=>{ if(dataUrl){ DB.settings.logo=dataUrl; saveDB(); renderAll(); toast(STATE.lang==='en'?'Logo updated.':'Logo actualizado.'); } });
}
function removeLogo(){ DB.settings.logo=null; saveDB(); renderAll(); }
function adminNotifPrefs(){
  const u=currentUser();
  const prefs=[['nuevas',STATE.lang==='en'?'New activities':'Nuevas actividades'],['vencimientos',STATE.lang==='en'?'Due dates':'Vencimientos'],
    ['bloqueos',STATE.lang==='en'?'Blocks':'Bloqueos'],['prioridad',STATE.lang==='en'?'Priority changes':'Cambios de prioridad'],
    ['fechas',STATE.lang==='en'?'Date changes':'Cambios de fecha']];
  return `<div class="card"><div class="section-title">${STATE.lang==='en'?'Notification preferences — ':'Preferencias de notificación — '}${esc(u.name)}</div>

function toggleNotifPref(k,val){ const u=currentUser(); u.notifPrefs=u.notifPrefs||{}; u.notifPrefs[k]=val; saveDB(); }

/* Nombres exactos que genera seed() — así se puede identificar con precisión qué es
   dato de ejemplo, incluso si ya quedó mezclado con información real. */
const SEED_USER_NAMES=['Marcela Rojas','Andrés Molano',
  'Camila Duarte','Julián Restrepo','Paula Nieto','Santiago Uribe','Diana Cárdenas','Felipe Vargas','Laura Peña',
  'Mauricio Salas','Natalia Ríos','Óscar Barrera','Valentina Cruz','Ricardo Gómez','Sandra Higuera','Tomás Lara','Adriana Puentes','Kevin Zapata','Isabel Mora','Hugo Cifuentes',
  'Juan Pérez','Ana Silva','Carlos Torres','María Gómez','Luis Fernández','Sofía Castro','Pedro Ramírez','Elena Vásquez',
  'Miguel Ortiz','Camilo Rey','Daniela Suárez','Jorge Aguilar','Lina Beltrán','Esteban Rico','Paola Medina'];
const SEED_TERCERO_NAMES=['Constructora Vial S.A.S.','Interventoría Andina Ltda.','Entidad Ferroviaria Regional'];
const SEED_FLUJO_NAMES=['Diseño de Estaciones','Diseño de Corredor','Diseño de Intersecciones'];
const SEED_SALA_NAMES=['Sala de Juntas 1','Sala de Juntas 2'];
function findSeedData(){
  const users=DB.users.filter(u=>SEED_USER_NAMES.includes(u.name));
  const userIds=new Set(users.map(u=>u.id));
  const terceros=DB.terceros.filter(t=>SEED_TERCERO_NAMES.includes(t.name));
  const terceroIds=new Set(terceros.map(t=>t.id));
  const activities=DB.activities.filter(a=>userIds.has(a.createdBy));
  const avanceDiseno=DB.avanceDiseno.filter(x=>userIds.has(x.createdBy));
  const contratos=DB.contratos.filter(c=>terceroIds.has(c.terceroId));
  const asistencias=DB.asistencias.filter(x=>terceroIds.has(x.terceroId));
  const flujoTemplates=DB.flujoTemplates.filter(t=>SEED_FLUJO_NAMES.includes(t.nombre));
  const salas=DB.salas.filter(s=>SEED_SALA_NAMES.includes(s.name));
  const notifications=DB.notifications.filter(n=>n.activityId&&activities.some(a=>a.id===n.activityId));
  return {users,terceros,activities,avanceDiseno,contratos,asistencias,flujoTemplates,salas,notifications};
}
function openCleanupSeedPreview(){
  const found=findSeedData();
  const total=found.users.length+found.activities.length+found.avanceDiseno.length+found.contratos.length+found.asistencias.length+found.flujoTemplates.length+found.salas.length;
  if(!total){ toast(STATE.lang==='en'?'No demo data found — everything looks like real data.':'No se encontró información de ejemplo — todo parece ser información real.'); return; }
  openModal(STATE.lang==='en'?'Review demo data before deleting':'Revisar datos de ejemplo antes de borrar',`
    <p class="hint" style="margin-bottom:10px">${STATE.lang==='en'?'Uncheck anything you recognize as real before deleting. This cannot be undone.':'Desmarca cualquier cosa que reconozcas como real antes de borrar. Esto no se puede deshacer.'}</p>
    ${found.users.length?`<div class="check-row"><input type="checkbox" id="cln_users" checked><label for="cln_users" style="margin:0;text-transform:none;font-weight:600;color:var(--text)">${STATE.lang==='en'?'Sample people':'Personas de ejemplo'} (${found.users.length})</label></div>
      <p class="hint" style="margin:2px 0 8px 24px">${found.users.map(u=>esc(u.name)).join(', ')}</p>`:''}
    ${found.activities.length?`<div class="check-row"><input type="checkbox" id="cln_acts" checked><label for="cln_acts" style="margin:0;text-transform:none;font-weight:600;color:var(--text)">${STATE.lang==='en'?'Sample activities (created by sample people)':'Actividades de ejemplo (creadas por personas de ejemplo)'} (${found.activities.length})</label></div>`:''}
    ${found.avanceDiseno.length?`<div class="check-row"><input type="checkbox" id="cln_avance" checked><label for="cln_avance" style="margin:0;text-transform:none;font-weight:600;color:var(--text)">${STATE.lang==='en'?'Sample design progress elements':'Elementos de ejemplo en Avance de Diseño'} (${found.avanceDiseno.length})</label></div>`:''}
    ${SEED_TERCERO_NAMES.some(n=>DB.terceros.some(t=>t.name===n))?`<div class="check-row"><input type="checkbox" id="cln_terceros" checked><label for="cln_terceros" style="margin:0;text-transform:none;font-weight:600;color:var(--text)">${STATE.lang==='en'?'Sample third parties':'Terceros de ejemplo'}</label></div>
      <p class="hint" style="margin:2px 0 8px 24px">${SEED_TERCERO_NAMES.join(', ')}</p>`:''}
    ${found.contratos.length?`<div class="check-row"><input type="checkbox" id="cln_contratos" checked><label for="cln_contratos" style="margin:0;text-transform:none;font-weight:600;color:var(--text)">${STATE.lang==='en'?'Sample contracts':'Contratos de ejemplo'} (${found.contratos.length})</label></div>`:''}
    ${found.asistencias.length?`<div class="check-row"><input type="checkbox" id="cln_asist" checked><label for="cln_asist" style="margin:0;text-transform:none;font-weight:600;color:var(--text)">${STATE.lang==='en'?'Sample third-party requests':'Solicitudes de ejemplo con terceros'} (${found.asistencias.length})</label></div>`:''}
    ${found.flujoTemplates.length?`<div class="check-row"><input type="checkbox" id="cln_flujos" checked><label for="cln_flujos" style="margin:0;text-transform:none;font-weight:600;color:var(--text)">${STATE.lang==='en'?'Sample workflow templates':'Plantillas de flujo de ejemplo'}</label></div>
      <p class="hint" style="margin:2px 0 8px 24px">${SEED_FLUJO_NAMES.join(', ')}</p>`:''}
    ${found.salas.length?`<div class="check-row"><input type="checkbox" id="cln_salas" checked><label for="cln_salas" style="margin:0;text-transform:none;font-weight:600;color:var(--text)">${STATE.lang==='en'?'Sample meeting rooms':'Salas de ejemplo'}</label></div>
      <p class="hint" style="margin:2px 0 8px 24px">${SEED_SALA_NAMES.join(', ')}</p>`:''}
  `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-danger" onclick="doCleanupSeed()">${STATE.lang==='en'?'Delete selected':'Eliminar lo seleccionado'}</button>`,true);
}
function doCleanupSeed(){
  const found=findSeedData();
  const chk=id=>{ const el=document.getElementById(id); return el?el.checked:false; };
  let removed=0;
  if(chk('cln_users') && found.users.length){ const ids=found.users.map(u=>u.id);
    DB.users=DB.users.filter(u=>!ids.includes(u.id)); markDeleted('users',ids);
    const licNotifIds=DB.notifications.filter(n=>n.subjectUserId&&ids.includes(n.subjectUserId)).map(n=>n.id);
    DB.notifications=DB.notifications.filter(n=>!n.subjectUserId||!ids.includes(n.subjectUserId)); markDeleted('notifications',licNotifIds);
    removed+=ids.length; }
  if(chk('cln_acts') && found.activities.length){ const ids=found.activities.map(a=>a.id); DB.activities=DB.activities.filter(a=>!ids.includes(a.id)); markDeleted('activities',ids); removed+=ids.length; }
  if(chk('cln_avance') && found.avanceDiseno.length){ const ids=found.avanceDiseno.map(x=>x.id); DB.avanceDiseno=DB.avanceDiseno.filter(x=>!ids.includes(x.id)); markDeleted('avanceDiseno',ids); removed+=ids.length; }
  if(chk('cln_terceros') && found.terceros.length){ const ids=found.terceros.map(t=>t.id); DB.terceros=DB.terceros.filter(t=>!ids.includes(t.id)); markDeleted('terceros',ids); removed+=ids.length; }
  if(chk('cln_contratos') && found.contratos.length){ const ids=found.contratos.map(c=>c.id); DB.contratos=DB.contratos.filter(c=>!ids.includes(c.id)); markDeleted('contratos',ids); removed+=ids.length; }
  if(chk('cln_asist') && found.asistencias.length){ const ids=found.asistencias.map(x=>x.id); DB.asistencias=DB.asistencias.filter(x=>!ids.includes(x.id)); markDeleted('asistencias',ids); removed+=ids.length; }
  if(chk('cln_flujos') && found.flujoTemplates.length){ const ids=found.flujoTemplates.map(t=>t.id); DB.flujoTemplates=DB.flujoTemplates.filter(t=>!ids.includes(t.id)); markDeleted('flujoTemplates',ids); removed+=ids.length; }
  if(chk('cln_salas') && found.salas.length){ const ids=found.salas.map(s=>s.id); DB.salas=DB.salas.filter(s=>!ids.includes(s.id)); markDeleted('salas',ids); removed+=ids.length; }
  if(found.notifications.length){ const ids=found.notifications.map(n=>n.id); DB.notifications=DB.notifications.filter(n=>!ids.includes(n.id)); markDeleted('notifications',ids); }
  saveDB(); closeModal(); toast((STATE.lang==='en'?'Removed ':'Se eliminaron ')+removed+(STATE.lang==='en'?' demo record(s).':' registro(s) de ejemplo.')); renderAll();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='centro-control-personal-backup-'+iso(today())+'.json'; a.click();
  toast(STATE.lang==='en'?'Backup downloaded.':'Respaldo descargado.');
}
function importJSON(){
  const f=document.getElementById('importFile').files[0]; if(!f){ toast(STATE.lang==='en'?'Choose a file first.':'Selecciona un archivo primero.'); return; }
  const reader=new FileReader();
  reader.onload=e=>{ try{ DB=JSON.parse(e.target.result); if(!DB.settings.permissions) DB.settings.permissions=defaultPermissions();
      DB.activities.forEach(a=>{ if(!a.responsibleIds){ a.responsibleIds=a.responsibleId?[a.responsibleId]:[]; delete a.responsibleId; } if(a.readyForSite===undefined) a.readyForSite=false; });
      DB.users.forEach(u=>{ if(!u.username) u.username=(u.email||u.name).split('@')[0]; if(!u.password) u.password='1234';
        if(!u.hireDate) u.hireDate=''; if(!u.vacations) u.vacations=[]; if(!u.licenses) u.licenses=[];
        if(!u.disciplinaIds){ u.disciplinaIds=u.disciplinaId?[u.disciplinaId]:[]; delete u.disciplinaId; } });
      reindexAllDisciplines(DB); saveDB();
      if(!checkSession()){ toast(STATE.lang==='en'?'Data imported. Please sign in again.':'Datos importados. Inicia sesión nuevamente.'); logout(); return; }
      toast(STATE.lang==='en'?'Data imported.':'Datos importados.'); renderAll(); }
    catch(err){ toast(STATE.lang==='en'?'Invalid file.':'Archivo inválido.'); } };
  reader.readAsText(f);
}
function resetSeed(){
  if(!isDirector()){ toast(t('no_permission')); return; }
  const phrase=STATE.lang==='en'?'ERASE':'BORRAR';
  const warning=STATE.lang==='en'
    ? `⚠️ This erases everything on THIS device and starts fresh with only the base catalogs and one admin account. If this device is connected to the shared cloud, the real data will safely come back the next time it syncs (this does not delete anyone else's information) — this is only useful for a completely fresh, disconnected setup.\n\nType ${phrase} (in capital letters) to confirm:`
    : `⚠️ Esto borra todo en ESTE dispositivo y arranca de cero solo con los catálogos base y una cuenta de administrador. Si este dispositivo está conectado a la nube compartida, la información real volverá sola la próxima vez que sincronice (esto no borra la información de nadie más) — solo es útil para una configuración nueva y completamente desconectada.\n\nEscribe ${phrase} (en mayúsculas) para confirmar:`;
  if(prompt(warning)!==phrase) return;
  localStorage.removeItem(DB_KEY); localStorage.removeItem(SESSION_KEY);
  DB=seed(); saveLocalOnly();
  document.body.classList.add('not-authed'); document.body.classList.remove('authed');
  STATE={view:'dashboard',filters:{},sort:{key:'dueDate',dir:1},lang:STATE.lang,orderDisc:''};
  renderLoginScreen(); toast(STATE.lang==='en'?'Reset. Please sign in.':'Reiniciado. Inicia sesión.');
}
function openWipeConfirm(){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  openModal(STATE.lang==='en'?'⚠ Delete all activity data':'⚠ Borrar todos los datos de actividades',`
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:14px">${STATE.lang==='en'?'This cannot be undone. Enter your password to confirm.':'Esta acción no se puede deshacer. Escribe tu contraseña para confirmar.'}</p>
    <div class="form-row"><label>${t('th_password')}</label><input type="password" id="wipe_pass"></div>
    <div id="wipeError" style="color:var(--red);font-size:12px"></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-danger" onclick="doWipeAll()">${STATE.lang==='en'?'Delete everything':'Borrar todo'}</button>`);
}
function doWipeAll(){
  const pass=document.getElementById('wipe_pass').value;
  if(pass!==currentUser().password){ document.getElementById('wipeError').textContent=t('login_error'); return; }
  DB.activities=[]; DB.notifications=[]; DB.counters.activity=1;
  saveDB(); closeModal(); STATE.activityId=null; STATE.filters={};
  toast(STATE.lang==='en'?'All activity data deleted.':'Todos los datos de actividades fueron eliminados.'); renderAll();
}

/* ============================ INIT ============================ */
document.documentElement.lang=STATE.lang;
const sessUserId=checkSession();
if(sessUserId){ DB.currentUserId=sessUserId; document.body.classList.remove('not-authed'); document.body.classList.add('authed'); renderAll(); }
else { renderLoginScreen(); }
/* Al volver a una pestaña que estuvo un rato en segundo plano, la conexión en tiempo
   real pudo haberse quedado dormida sin avisar — esto la pone al día de inmediato en
   ese momento, en vez de esperar minutos a que llegue el próximo sondeo de respaldo.
   Se limita a como mucho una vez cada 15 segundos, para no disparar una lectura cada
   vez que la persona simplemente cambia de pestaña y vuelve rápido. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible' || !SYNC.client) return;
  const now=Date.now();
  if(SYNC.lastVisiblePull && now-SYNC.lastVisiblePull<15000) return;
  SYNC.lastVisiblePull=now;
  pullFromCloud(false);
});
captureSyncSnapshot(); // base de comparación de respaldo, por si acaso, antes de que arranque la sincronización
initSync();
</script>
