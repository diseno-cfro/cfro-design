<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Control · Actividades del Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F6F9; --panel-3:#EBEEF3;
  --border:#E1E5EC; --border-soft:#EDF0F4;
  --text:#1B2431; --text-dim:#5B6675; --text-faint:#8A93A3;
  --accent:#2563EB; --accent-dim:#DCE8FE; --accent-soft:#EEF4FF;
  --green:#16A34A; --green-dim:#E5F6EA;
  --amber:#D97706; --amber-dim:#FEF2E0;
  --orange:#EA580C; --orange-dim:#FDECE2;
  --red:#DC2626; --red-dim:#FCE9E9;
  --purple:#7C3AED; --purple-dim:#F1EAFD;
  --blue2:#2563EB; --blue2-dim:#EAF1FF;
  --radius:10px; --radius-sm:6px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-dim);color:var(--text);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:.2px;}
p{margin:0;}

/* ===== LOGIN ===== */
#loginScreen{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#F4F7FC,#FFFFFF);z-index:500;justify-content:center;padding:6vh 20px 40px;overflow-y:auto;}
body.not-authed #loginScreen{display:flex;align-items:flex-start;}
body.not-authed #topbar,body.not-authed #layout{display:none;}
.login-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:34px 32px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(20,30,50,.10);text-align:center;flex:none;}
.login-card .lg-logo{height:180px;max-width:420px;object-fit:contain;margin-bottom:16px;}
.login-card .lg-mark{width:90px;height:90px;border-radius:18px;background:var(--accent);margin:0 auto 14px;box-shadow:0 0 0 10px var(--accent-soft);}
.login-card h2{font-size:18px;margin-bottom:4px;}
.login-card .sub{color:var(--text-faint);font-size:12.5px;font-family:var(--font-mono);margin-bottom:20px;}
.login-card input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;font-size:13.5px;margin-bottom:12px;color:var(--text);text-align:left;}
.login-card button.btn-primary{width:100%;justify-content:center;padding:11px;font-size:13.5px;}
#loginError{color:var(--red);font-size:12px;margin:-4px 0 10px;min-height:14px;}
.login-hint{margin-top:18px;border-top:1px solid var(--border-soft);padding-top:14px;font-size:11.5px;color:var(--text-faint);text-align:left;}
.login-lang-row{display:flex;justify-content:center;gap:6px;margin-bottom:16px;}
.lang-pill{border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);border-radius:16px;padding:5px 12px;font-size:11.5px;font-weight:600;}
.lang-pill.on{background:var(--accent-soft);border-color:var(--accent-dim);color:var(--accent);}
.login-hint summary{cursor:pointer;font-weight:600;color:var(--text-dim);}
.login-hint table{margin-top:8px;}
.login-hint td{padding:3px 6px;font-family:var(--font-mono);font-size:11px;border:none;}

/* ===== LAYOUT ===== */
#topbar{
  height:58px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:0;z-index:40;
}
#brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:15px;white-space:nowrap;color:var(--text);}
#brand .mark{width:10px;height:10px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
#brand .logo-img{height:30px;max-width:150px;object-fit:contain;}
#brand small{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--text-faint);letter-spacing:1px;}

#board{
  flex:1;display:flex;align-items:center;gap:22px;overflow:hidden;
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
  border-left:1px solid var(--border-soft);border-right:1px solid var(--border-soft);
  padding:0 18px;height:34px;
}
#board .b-item{display:flex;align-items:center;gap:7px;white-space:nowrap;}
#board .b-item b{color:var(--text);font-size:13px;}
#board .dot{width:7px;height:7px;border-radius:50%;flex:none;}
#board .dot.red{background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse 1.6s infinite;}
#board .dot.amber{background:var(--amber);}
#board .dot.green{background:var(--green);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#board .dot.red{animation:none}}

#topbar-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent-dim);}
.lang-btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);border-radius:8px;padding:0 10px;height:34px;font-size:12px;font-weight:700;font-family:var(--font-mono);}
.lang-btn:hover{color:var(--text);border-color:var(--accent-dim);}
.badge-count{
  position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  font-family:var(--font-mono);
}
#userchip{
  display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px 5px 6px;cursor:pointer;
}
#userchip .av{width:24px;height:24px;border-radius:6px;background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-display);}
#userchip .meta{display:flex;flex-direction:column;line-height:1.2;}
#userchip .meta b{font-size:12px;}
#userchip .meta span{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.5px;}

#layout{display:flex;min-height:calc(100vh - 58px);}
#sidebar{
  width:236px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;
}
.nav-group{margin-bottom:14px;}
.nav-group-title{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-faint);
  font-family:var(--font-mono);padding:6px 10px 4px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--text-dim);
  font-size:13px;cursor:pointer;margin-bottom:1px;font-weight:500;
}
.nav-item .ic{width:16px;text-align:center;font-size:13px;flex:none;}
.nav-item .ct{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.nav-item:hover{background:var(--panel-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent);}

#content{flex:1;padding:22px 26px 60px;max-width:1440px;}

/* ===== COMMON COMPONENTS ===== */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.pagehead h1{font-size:20px;}
.pagehead .sub{color:var(--text-faint);font-size:12.5px;margin-top:4px;font-family:var(--font-mono);}
.btn{
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:8px 14px;border-radius:8px;
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--accent-dim);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);background:var(--panel-2);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{border-color:var(--red);color:var(--red);background:#fff;}
.btn-danger:hover{background:var(--red-dim);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}

.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}#content{padding:14px;}}
@media (max-width:900px){
  #hamburgerBtn{display:flex !important;}
  #board{display:none;}
  #topbar{gap:8px;padding:0 10px;}
  #sidebar{position:fixed;top:58px;left:-270px;height:calc(100vh - 58px);z-index:70;transition:left .2s ease;box-shadow:4px 0 24px rgba(20,30,50,.15);}
  #sidebar.open{left:0;}
  #sidebarOverlay{display:none;position:fixed;inset:58px 0 0 0;background:rgba(15,20,30,.4);z-index:65;}
  #sidebarOverlay.open{display:block;}
  #brand small{display:none;}
  #userchip .meta{display:none;}
  .form-cols-2,.form-cols-3{grid-template-columns:1fr;}
  .mini-add{flex-wrap:wrap;}
  .gantt-label{padding:6px 8px;}
  .cal-cell{min-height:60px;}
}
@media (max-width:480px){
  #brand{font-size:12px;}
  .lang-btn{padding:0 7px;font-size:11px;}
  .icon-btn{width:30px;height:30px;font-size:14px;}
  #userchip{padding:4px 6px 4px 4px;}
  .pagehead h1{font-size:17px;}
  .login-card{padding:24px 18px;}
  .login-card .lg-logo{height:110px;max-width:260px;}
  .login-card .lg-mark{width:70px;height:70px;}
  #loginScreen{padding-top:3vh;}
}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(20,30,50,.03);}
.card.tight{padding:12px 14px;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);
  font-family:var(--font-mono);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}

.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
  border-left:3px solid var(--border);}
.kpi .n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;}
.kpi .l{color:var(--text-faint);font-size:11.5px;margin-top:6px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.4px;}
.kpi.k-red{border-left-color:var(--red);} .kpi.k-amber{border-left-color:var(--amber);}
.kpi.k-green{border-left-color:var(--green);} .kpi.k-accent{border-left-color:var(--accent);}
.kpi.k-purple{border-left-color:var(--purple);}
.area-card{background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:14px 16px;cursor:pointer;transition:border-color .15s;}
.area-card:hover{border-color:var(--accent-dim);}
.area-card-h{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;font-family:var(--font-mono);}
.area-card-n{font-family:var(--font-display);font-size:28px;font-weight:700;margin-top:4px;}
.area-card-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-faint);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:500;
  cursor:pointer;user-select:none;background:var(--panel-2);
}
th:hover{color:var(--text-dim);}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr.row-click{cursor:pointer;}
tr.row-click:hover td{background:var(--panel-2);}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);}
.tbl-wrap table{margin:0;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;
  font-family:var(--font-mono);white-space:nowrap;}
.badge .d{width:6px;height:6px;border-radius:50%;}
.b-p1{background:var(--red-dim);color:var(--red);} .b-p1 .d{background:var(--red);}
.b-p2{background:var(--orange-dim);color:var(--orange);} .b-p2 .d{background:var(--orange);}
.b-p3{background:var(--blue2-dim);color:var(--blue2);} .b-p3 .d{background:var(--blue2);}
.b-p4{background:var(--green-dim);color:var(--green);} .b-p4 .d{background:var(--green);}
.b-ok{background:var(--green-dim);color:var(--green);} .b-ok .d{background:var(--green);}
.b-warn{background:var(--amber-dim);color:var(--amber);} .b-warn .d{background:var(--amber);}
.b-late{background:var(--red-dim);color:var(--red);} .b-late .d{background:var(--red);}
.b-block{background:var(--purple-dim);color:var(--purple);} .b-block .d{background:var(--purple);}
.b-review{background:var(--blue2-dim);color:var(--blue2);} .b-review .d{background:var(--blue2);}
.b-muted{background:var(--panel-3);color:var(--text-dim);} .b-muted .d{background:var(--text-faint);}
.b-site{background:#EAF7EE;color:#0F7A3D;} .b-site .d{background:#0F7A3D;}

.tag{background:var(--panel-3);color:var(--text-dim);padding:2px 8px;border-radius:5px;font-size:11px;font-family:var(--font-mono);}

.progress{height:6px;background:var(--panel-3);border-radius:3px;overflow:hidden;width:70px;}
.progress i{display:block;height:100%;background:var(--accent);}

.empty{padding:34px 16px;text-align:center;color:var(--text-faint);font-size:13px;}
.empty .big{font-size:26px;margin-bottom:8px;}

/* Forms */
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;font-family:var(--font-mono);}
.form-row input[type=text],.form-row input[type=date],.form-row input[type=number],
.form-row input[type=email],.form-row input[type=password],.form-row input[type=file],.form-row select,.form-row textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;color:var(--text);
  padding:9px 10px;font-size:13px;
}
.form-row textarea{min-height:64px;resize:vertical;}
.form-row .hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
.form-cols-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-cols-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.chip-select{display:flex;flex-wrap:wrap;gap:6px;}
.chip-opt{border:1px solid var(--border);background:var(--panel-2);padding:5px 10px;border-radius:16px;font-size:12px;color:var(--text-dim);display:inline-flex;align-items:center;gap:6px;}
.chip-opt.on{background:var(--accent-soft);border-color:var(--accent-dim);color:var(--accent);}
.chip-opt .x{cursor:pointer;color:var(--text-faint);font-weight:700;}
.chip-opt .x:hover{color:var(--red);}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;}
.mini-list{border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:10px;max-height:150px;overflow-y:auto;}
.mini-list-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 4px;font-size:12.3px;border-bottom:1px solid var(--border-soft);}
.mini-list-row:last-child{border-bottom:none;}
.mini-add{display:flex;gap:6px;align-items:flex-end;}
.mini-add > div{flex:1;}
.mini-add label{font-size:10px;color:var(--text-faint);display:block;margin-bottom:3px;font-family:var(--font-mono);text-transform:uppercase;}
.mini-add input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-size:12.5px;}

/* Modal & Drawer */
#modalOverlay{
  position:fixed;inset:0;background:rgba(15,20,30,.45);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow-y:auto;
}
#modalOverlay.hidden{display:none;}
#modalBox{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:640px;
  max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(20,30,50,.18);}
#modalBox.wide{max-width:940px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:15px;}
.modal-body{padding:20px;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.x-close{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab{padding:9px 12px;font-size:12.5px;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;}
.tab.active{color:var(--accent);border-color:var(--accent);}

.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filterbar select,.filterbar input{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:12.5px;
}
.filterbar .sep{width:1px;height:20px;background:var(--border);margin:0 2px;}

.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:#fff;border-left:3px solid var(--accent);border-radius:8px;
  padding:11px 14px;font-size:12.5px;min-width:240px;box-shadow:0 8px 24px rgba(20,30,50,.25);animation:slidein .2s ease;}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

.alert-line{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--border);border-left:4px solid var(--border);margin-bottom:8px;font-size:12.8px;cursor:pointer;}
.alert-line:hover{border-color:var(--accent-dim);}
.alert-line .ic{font-size:15px;flex:none;margin-top:1px;}

.timeline{border-left:2px solid var(--border);margin-left:6px;padding-left:16px;}
.timeline .ev{position:relative;padding-bottom:14px;}
.timeline .ev::before{content:'';position:absolute;left:-21px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
.timeline .ev .t{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.timeline .ev .m{font-size:12.5px;margin-top:2px;}

.gantt-row{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid var(--border-soft);}
.gantt-label{padding:8px 10px;font-size:12px;border-right:1px solid var(--border-soft);display:flex;flex-direction:column;justify-content:center;gap:2px;}
.gantt-label small{color:var(--text-faint);font-family:var(--font-mono);font-size:10px;}
.gantt-track{position:relative;padding:8px 0;}
.gantt-bar{position:absolute;height:16px;border-radius:4px;top:10px;display:flex;align-items:center;overflow:hidden;}
.gantt-bar span{font-size:9.5px;padding-left:6px;color:#fff;font-weight:700;white-space:nowrap;font-family:var(--font-mono);}
.gantt-grid-lines{position:absolute;inset:0;display:flex;}
.gantt-grid-lines div{flex:1;border-right:1px dashed var(--border-soft);}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:2;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-align:center;padding-bottom:4px;text-transform:uppercase;}
.cal-cell{min-height:78px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--panel-2);}
.cal-cell.out{opacity:.35;}
.cal-cell.today{border-color:var(--accent);}
.cal-cell .dn{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:4px;}
.cal-dot{font-size:10px;background:var(--panel-3);border-radius:5px;padding:2px 5px;margin-bottom:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.workload-bar{height:8px;border-radius:4px;background:var(--panel-3);overflow:hidden;width:100%;}
.workload-bar i{display:block;height:100%;}

.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border-soft);}
.kv b{color:var(--text-dim);font-weight:500;}
.kv span{text-align:right;word-break:break-word;}

.sig-strip{height:3px;background:linear-gradient(90deg,var(--red),var(--amber),var(--green),var(--accent));border-radius:3px;margin-bottom:18px;}

.rank-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--panel);cursor:pointer;}
.rank-row.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-dim);}

.org-wrap{display:flex;flex-direction:column;align-items:center;}
.org-level{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;width:100%;}
.org-level-groups{align-items:flex-start;}
.org-arrow{font-size:18px;color:var(--text-faint);margin:6px 0;}
.org-node{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:150px;text-align:center;box-shadow:0 1px 2px rgba(20,30,50,.04);}

.org-node .av2{width:34px;height:34px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 6px;font-family:var(--font-display);font-size:12px;}

.org-profs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;justify-content:center;}

const addDays=(d,n)=>{ const x=new Date(typeof d==='string'?d+'T00:00:00':d); x.setDate(x.getDate()+n); return iso(x); };
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000);

function STATE_LOCALE(){ return STATE.lang==='en'?'en-US':(STATE.lang==='zh'?'zh-CN':'es-CO'); }
function isWeekend(dateStr){ const d=new Date(dateStr+'T00:00:00'); const day=d.getDay(); return day===0||day===6; }
function addBusinessDays(dateStr,days){
  let d=dateStr; let remaining=Math.round(days);
  if(remaining<=0){ while(remaining<0){ d=addDays(d,-1); if(!isWeekend(d)) remaining++; } return d; }
  while(remaining>0){ d=addDays(d,1); if(!isWeekend(d)) remaining--; }
  return d;
}

function labelForOrder(db,order){
  const th=(db||DB).settings.priorityThresholds;

/* ---------------- PRIORITY ORDER ENGINE (per disciplina) ---------------- */
function activePrioritizedByDisc(discId,db){
  db=db||DB;
  const tier=a=> a.blocked?2 : (a.status==='en_revision'?1:0);
  return db.activities.filter(a=>!a.parentId && !['completada','cancelada'].includes(a.status) && (a.disciplines||[]).includes(discId))
    .sort((a,b)=> tier(a)-tier(b) || (((a.priorityOrder||{})[discId])||9999)-(((b.priorityOrder||{})[discId])||9999));
}
function recomputeGlobalPriority(a,db){
  db=db||DB;
  if(!a.disciplines || !a.disciplines.length){ a.priority='P4'; return; }
  const order=['P1','P2','P3','P4']; let best='P4';
  a.disciplines.forEach(d=>{ const lvl=labelForOrder(db,((a.priorityOrder||{})[d])||9999); if(order.indexOf(lvl)<order.indexOf(best)) best=lvl; });
  a.priority=best;
}
function reindexDiscipline(discId,db){
  db=db||DB;
  const list=activePrioritizedByDisc(discId,db);
  list.forEach((a,i)=>{ if(!a.priorityOrder) a.priorityOrder={}; a.priorityOrder[discId]=i+1; });
  list.forEach(a=>recomputeGlobalPriority(a,db));
}
function reindexAllDisciplines(db){
  db=db||DB;
  db.disciplines.forEach(d=>reindexDiscipline(d.id,db));
  db.activities.filter(a=>!a.parentId).forEach(a=>recomputeGlobalPriority(a,db));
}
function reindexAffected(a){ (a.disciplines||[]).forEach(d=>reindexDiscipline(d)); }
/* Encadena fechas: la actividad en la posición i inicia cuando termina la de la posición i-1 (dentro de la disciplina) */
function chainDatesInDisc(discId){
  const list=activePrioritizedByDisc(discId);
  for(let i=1;i<list.length;i++){
    const prev=list[i-1], cur=list[i];
    if(cur.blocked || cur.status==='en_revision') continue; // no forzar fecha de las que están al final por bloqueo/revisión
    const newStart=computedEnd(prev);
    if(newStart!==cur.startDate){
      const beforeDue=cur.dueDate;
      cur.startDate=newStart; cur.dueDate=addBusinessDays(newStart,cur.duration);
      pushHistory(cur,currentUser(),'startDate (encadenado por orden)',null,cur.startDate);
      if(cur.dueDate!==beforeDue) notify(`🔵 ${cur.code}: ${fmtDate(beforeDue)} → ${fmtDate(cur.dueDate)}`,'fecha',cur.id);
    }

}
function moveActivityInDisc(id,dir,discId){
  const list=activePrioritizedByDisc(discId); const idx=list.findIndex(a=>a.id===id); const newIdx=idx+dir;
  if(idx<0||newIdx<0||newIdx>=list.length) return;
  const tmp=list[idx]; list[idx]=list[newIdx]; list[newIdx]=tmp;
  list.forEach((a,i)=>{ a.priorityOrder[discId]=i+1; });
  list.forEach(a=>recomputeGlobalPriority(a));
  chainDatesInDisc(discId);
  saveDB(); renderAll();
}
function setActivityPositionInDisc(id,pos,discId){
  let list=activePrioritizedByDisc(discId); const idx=list.findIndex(a=>a.id===id); if(idx<0) return;
  const [item]=list.splice(idx,1);
  const target=Math.max(1,Math.min(list.length+1,pos))-1;
  list.splice(target,0,item);
  list.forEach((a,i)=>{ a.priorityOrder[discId]=i+1; });
  list.forEach(a=>recomputeGlobalPriority(a));
  chainDatesInDisc(discId);
  saveDB();
}
/* Reordena una disciplina completa según la fecha límite más próxima primero (bloqueadas/en revisión igual bajan al final) */
function sortDisciplineByDueDate(discId){
  const list=activePrioritizedByDisc(discId);
  const tier=a=> a.blocked?2 : (a.status==='en_revision'?1:0);
  list.sort((a,b)=> tier(a)-tier(b) || a.dueDate.localeCompare(b.dueDate));
  list.forEach((a,i)=>{ a.priorityOrder[discId]=i+1; });
  list.forEach(a=>recomputeGlobalPriority(a));
  saveDB(); toast(STATE.lang==='en'?'Reordered by due date.':'Reordenado por fecha de vencimiento.'); renderAll();
}

      if(!DB.settings.permissions[r]){ DB.settings.permissions[r]=defaultsPerm[r]; return; }
      const existingViews=DB.settings.permissions[r].views||[];
      ['gestor_ot','terceros','contratos','avance_diseno'].forEach(v=>{
        if(defaultsPerm[r] && defaultsPerm[r].views.includes(v) && !existingViews.includes(v)) existingViews.push(v);
      });

    });
    DB.settings.permVersion=2;

  DB.activities.forEach(a=>{ if(typeof a.priorityOrder==='number' || !a.priorityOrder){ const num=a.priorityOrder; const obj={}; (a.disciplines||[]).forEach(d=>obj[d]=num||9999); a.priorityOrder=obj; } });
  DB.activities.forEach(a=>{ if(!a.responsibleIds){ a.responsibleIds = a.responsibleId?[a.responsibleId]:[]; delete a.responsibleId; } });
  DB.activities.forEach(a=>{ if(a.readyForSite===undefined) a.readyForSite=false; if(a.reviewerId!==undefined) delete a.reviewerId;
    if(a.otDocType===undefined) a.otDocType=''; if(a.otConsecutivo===undefined) a.otConsecutivo='';
    if(!a.executorBlocks) a.executorBlocks={};

async function pullFromCloud(isInitial){
  if(!SYNC.client) return;
  const {data,error}=await SYNC.client.from('ccd_app_data').select('*').eq('id',1).maybeSingle();
  if(error){ SYNC.status='error'; SYNC.lastError=syncErrMsg(error); console.warn('Error leyendo de la nube',error); return; }
  SYNC.lastError='';
  if(!data || !data.data || Object.keys(data.data).length===0){
    SYNC.status='empty';
    if(isInitial) offerInitialPush();
    return;
  }
  if(data.version===SYNC.version){ SYNC.status='synced'; return; }

  const authed=!document.body.classList.contains('not-authed');
  /* Mi identidad en ESTE dispositivo se toma directo de la memoria (no de una
     relectura de localStorage), para que nunca se pierda por una sincronización
     que llegue mientras trabajas — es la causa de los cierres de sesión inesperados. */
  const myId = authed ? DB.currentUserId : null;
  const remoteUsers = (data.data && data.data.users) || [];
  const stillExists = !myId || remoteUsers.some(x=>x.id===myId);

  if(myId && !stillExists){

  } else {

  if(myId && stillExists) DB.currentUserId=myId; // restaura SIEMPRE mi propia sesión, pase lo que pase en la nube
  saveLocalOnly();
  SYNC.status='synced';

  if(myId && !stillExists){ logout(); return; } // confirmado varias veces: de verdad ya no existe esta cuenta
  if(authed){ if(!isInitial) toast(STATE.lang==='en'?'Data updated from the cloud.':'Datos actualizados desde la nube.'); renderAll(); }
  else renderLoginScreen();

function scheduleCloudPush(){

async function pushToCloud(){
  if(!SYNC.client) return;
  /* Antes de guardar, revisamos si la nube tiene usuarios que nuestra copia local
     todavía no conoce (por ejemplo, alguien recién creado por otra persona) y los
     conservamos, para nunca borrar por accidente una cuenta al sincronizar. */
  try{
    const {data:remote}=await SYNC.client.from('ccd_app_data').select('data,version').eq('id',1).maybeSingle();
    if(remote && remote.data && Array.isArray(remote.data.users)){
      const localIds=new Set(DB.users.map(u=>u.id));
      const missing=remote.data.users.filter(u=>!localIds.has(u.id));
      if(missing.length) DB.users=DB.users.concat(missing);
      if(remote.version && remote.version>SYNC.version) SYNC.version=remote.version;
    }
  }catch(e){ /* si esto falla, seguimos con el guardado normal de todas formas */ }
  SYNC.version++;
  const {error}=await SYNC.client.from('ccd_app_data').update({data:cloudPayload(),version:SYNC.version,updated_at:new Date().toISOString()}).eq('id',1);
  if(error){ SYNC.status='error'; SYNC.lastError=syncErrMsg(error); console.warn('Error guardando en la nube',error); }
  else { SYNC.status='synced'; SYNC.lastError=''; saveLocalOnly(); }
  if(document.getElementById('syncBtn')) renderTopbar();
}

/* ---------------- DERIVED LOGIC ---------------- */
function computedEnd(a){ if(a.actualEndDate) return a.actualEndDate; return addBusinessDays(a.startDate, a.duration); }
function isOverdue(a){ return a.status!=='completada' && a.status!=='cancelada' && a.dueDate < iso(today()); }
function daysToDue(a){ return diffDays(a.dueDate, iso(today())); }
function slack(a){ return diffDays(a.dueDate, computedEnd(a)); }
function visualStatus(a){
  if(a.status==='completada') return {label:statusLabel('completada'),cls:'b-ok'};
  if(a.status==='cancelada') return {label:statusLabel('cancelada'),cls:'b-muted'};
  if(a.status==='bloqueada') return {label:statusLabel('bloqueada'),cls:'b-block'};
  if(isOverdue(a)) return {label:statusLabel('vencida'),cls:'b-late'};
  if(a.status==='en_revision') return {label:statusLabel('en_revision'),cls:'b-review'};
  if(a.status==='devuelta') return {label:statusLabel('devuelta'),cls:'b-warn'};
  const d=daysToDue(a);
  if(d<=1) return {label:statusLabel('proxima'),cls:'b-warn'};
  return {label:statusLabel(a.status),cls:'b-muted'};
}
function riskLevel(a){
  if(a.status==='completada'||a.status==='cancelada') return null;
  if(isOverdue(a)) return 'Crítico';
  if(a.blocked && a.priority==='P1') return 'Crítico';
  const s=slack(a);
  if(a.priority==='P1' && s<=1) return 'Alto';
  if(s<0) return 'Alto';
  if(s<=2) return 'Medio';
  return 'Bajo';
}
function isCritical(a){
  if(a.status==='completada'||a.status==='cancelada') return false;
  return a.priority==='P1' || isOverdue(a) || a.blocked || dependents(a.id).length>=2;
}
/* Bloqueo por ejecutor: un ejecutor puede estar bloqueado (esperando a otro) sin bloquear la actividad entera */
function execBlockInfo(a,execId){ return (a.executorBlocks&&a.executorBlocks[execId]) || {blocked:false,reason:''}; }
function execBlockedCount(a){ if(!a.executorBlocks) return 0; return Object.values(a.executorBlocks).filter(x=>x.blocked).length; }
function toggleExecutorBlock(aid,execId,val){
  const a=byId(DB.activities,aid); if(!a.executorBlocks) a.executorBlocks={};
  if(!a.executorBlocks[execId]) a.executorBlocks[execId]={blocked:false,reason:''};
  a.executorBlocks[execId].blocked=val;
  pushHistory(a,currentUser(),'executor-block',userName(execId),val?(STATE.lang==='en'?'blocked':'bloqueado'):(STATE.lang==='en'?'unblocked':'desbloqueado'));
  notify(`${val?'🟣':'🟢'} ${a.code}: ${userName(execId)} ${val?(STATE.lang==='en'?'is blocked':'está bloqueado'):(STATE.lang==='en'?'is unblocked':'se desbloqueó')}`,val?'bloqueo':'nueva',a.id);
  saveDB(); renderAll();
}
function setExecutorBlockReason(aid,execId,val){
  const a=byId(DB.activities,aid); if(!a.executorBlocks) a.executorBlocks={};
  if(!a.executorBlocks[execId]) a.executorBlocks[execId]={blocked:false,reason:''};
  a.executorBlocks[execId].reason=val; saveDB();
}
function normRole(u){ return u.role && u.role.trim ? u.role.trim() : u.role; }
function perm(role,key){ const p=DB.settings.permissions[role]; return p ? p[key] : false; }
function navAllowed(role,viewId){ const p=DB.settings.permissions[role]; return p && p.views.includes(viewId); }
function can(action){ const u=currentUser(); return u && perm(normRole(u),action); }
function canManageUsers(){ const r=normRole(currentUser()); return r==='subdirector'||r==='coordinador'; }
/* Un líder solo puede eliminar registros creados por él mismo o por alguien de su propia disciplina (su equipo) */
function canDeleteRecord(creatorId){
  const u=currentUser(); const role=normRole(u);
  if(role==='subdirector'||role==='coordinador') return can('delete');
  if(isLiderRole(role)){
    if(!perm(role,'delete')) return false;
    if(!creatorId) return false;
    if(creatorId===u.id) return true;
    const creator=byId(DB.users,creatorId);
    return !!(creator && userDiscOverlap(creator,u));
  }
  return can('delete');
}
function scopeForUser(u){
  if(!u) return [];
  const role=normRole(u);
  if(role==='subdirector'||role==='coordinador'||role==='visitante') return DB.activities;
  if(isLiderRole(role)) return DB.activities.filter(a=> (a.responsibleIds||[]).includes(u.id) || (a.disciplines||[]).some(d=>userHasDisc(u,d)) || a.createdBy===u.id);
  return DB.activities.filter(a=> (a.executorIds||[]).includes(u.id) || (a.responsibleIds||[]).includes(u.id));
}

function peopleOf(a){ return [...(a.responsibleIds||[]),...(a.executorIds||[])]; }
function findScheduleConflicts(peopleIds,start,end,excludeId){
  if(!peopleIds||!peopleIds.length) return [];
  return DB.activities.filter(a=> a.id!==excludeId && !a.parentId && !['completada','cancelada'].includes(a.status)
    && peopleOf(a).some(p=>peopleIds.includes(p)) && !(computedEnd(a)<start || a.startDate>end));
}

function unreadCount(){ const u=currentUser(); if(!u) return 0; return DB.notifications.filter(n=> !n.read && notificationVisibleTo(n,u)).length; }
function liveAlerts(){
  const alerts=[]; const [d7]=DB.settings.alertDays;
  DB.activities.filter(a=>!['completada','cancelada'].includes(a.status)).forEach(a=>{
    const d=daysToDue(a);
    if(isOverdue(a)) alerts.push({level:'red',icon:'🔴',text:`${a.code} · ${a.name}`,a});
    else if(d<=1) alerts.push({level:'orange',icon:'🟠',text:`${a.code} · ${a.name}`,a});
    else if(d<=3) alerts.push({level:'amber',icon:'🟡',text:`${a.code} · ${a.name}`,a});
    else if(d<=d7) alerts.push({level:'green',icon:'🟢',text:`${a.code} · ${a.name}`,a});
    if(a.blocked) alerts.push({level:'purple',icon:'🟣',text:`${a.code} · ${a.name}`,a});
  });
  return alerts;
}
function escalationAlerts(){
  const out=[];
  DB.activities.filter(a=>isOverdue(a)&&!['completada','cancelada'].includes(a.status)).forEach(a=>{
    const d=Math.abs(daysToDue(a)); let escTo=roleLabel('lider');
    if(d>=DB.settings.escalationDaysSubdirector || a.priority==='P1') escTo=roleLabel('subdirector');
    else if(d>=DB.settings.escalationDaysCoordinador) escTo=roleLabel('coordinador');
    out.push({a,escTo,dias:d});
  });
  return out;
}

/* ---------------- DEPENDENCY / SCHEDULE ENGINE ---------------- */
function impactOf(activityId){
  const seen=new Set(); const queue=[activityId]; const affected=[];
  while(queue.length){ const cur=queue.shift();
    dependents(cur).forEach(dep=>{ if(!seen.has(dep.id)){ seen.add(dep.id); affected.push(dep); queue.push(dep.id); } });
  }
  const p1Hit=affected.filter(a=>a.priority==='P1').length;
  return {affected,p1Hit};
}
function recalcFrom(activityId){
  const start=byId(DB.activities,activityId); const queue=[start]; let moved=0;
  while(queue.length){
    const cur=queue.shift(); const end=computedEnd(cur);
    dependents(cur.id).forEach(dep=>{
      const rel=dep.dependencies.find(d=>d.id===cur.id); let newStart=dep.startDate;
      if(rel.type==='FS') newStart=end; else if(rel.type==='SS') newStart=cur.startDate;
      else if(rel.type==='FF') newStart=addBusinessDays(end,-dep.duration); else if(rel.type==='SF') newStart=addBusinessDays(cur.startDate,-dep.duration);
      if(newStart!==dep.startDate){ dep.startDate=newStart; dep.dueDate=addBusinessDays(newStart,dep.duration); moved++; queue.push(dep); }
    });
  }
  return moved;
}

/* Preserva foco/cursor de inputs (buscadores) al re-renderizar, para poder escribir letra por letra */
function withFocusPreserved(renderFn){
  const active=document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart==='number')? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd==='number')? active.selectionEnd : null;
  renderFn();
  if(activeId){
    const el=document.getElementById(activeId);
    if(el){ el.focus({preventScroll:true}); if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart,selEnd); }catch(e){} } }
  }
}

/* Un líder ve, además de lo suyo, las notificaciones de los profesionales de su(s) disciplina(s) a cargo */
function notificationVisibleTo(n,u){
  const role=normRole(u);
  if(role==='subdirector'||role==='coordinador'||role==='visitante') return true;
  if(n.activityId){
    const a=byId(DB.activities,n.activityId);
    if(a){
      if(isLiderRole(role)){
        if((a.responsibleIds||[]).includes(u.id)) return true;
        if((a.disciplines||[]).some(d=>userHasDisc(u,d))) return true;
        if(a.createdBy===u.id) return true;
        const execUsers=(a.executorIds||[]).map(id=>byId(DB.users,id)).filter(Boolean);
        if(execUsers.some(eu=>userDiscOverlap(eu,u))) return true;
        return n.toUserIds? n.toUserIds.includes(u.id) : false;
      }
      if(role==='profesional'){
        return (a.executorIds||[]).includes(u.id) || (a.responsibleIds||[]).includes(u.id);
      }
    }
  }
  return n.toUserIds? n.toUserIds.includes(u.id) : (role==='subdirector'||role==='coordinador');
}
function viewNotificaciones(){
  const u=currentUser();
  let list=DB.notifications.filter(n=>notificationVisibleTo(n,u));
  list.forEach(n=>n.read=true);

  // Agrupar: si hay varias notificaciones de la misma actividad, solo mostrar la más reciente (+contador de las demás)
  const byActivity={}; const grouped=[];
  list.forEach(n=>{
    if(!n.activityId){ grouped.push({n,extra:0}); return; }
    if(byActivity[n.activityId]===undefined){ byActivity[n.activityId]=grouped.length; grouped.push({n,extra:0}); }
    else grouped[byActivity[n.activityId]].extra++;
  });

  const typeFilter=STATE.notifTypeFilter||'';
  const NOTIF_TYPES=['asignacion','completada','bloqueo','fecha','prioridad','conflicto','nueva'];
  const typeLabel=k=>({
    asignacion:{es:'Asignadas a mí',en:'Assigned to me',zh:'分配给我'},
    completada:{es:'Completadas',en:'Completed',zh:'已完成'},
    bloqueo:{es:'Bloqueadas',en:'Blocked',zh:'已阻塞'},
    fecha:{es:'Cambios de fecha',en:'Date changes',zh:'日期变更'},
    prioridad:{es:'Cambios de prioridad',en:'Priority changes',zh:'优先级变更'},
    conflicto:{es:'Conflictos de agenda',en:'Schedule conflicts',zh:'日程冲突'},
    nueva:{es:'Otras actualizaciones',en:'Other updates',zh:'其他更新'},
  }[k][STATE.lang]||k);
  let filtered = typeFilter? grouped.filter(g=>g.n.type===typeFilter || (typeFilter==='asignacion' && g.n.toUserIds && g.n.toUserIds.includes(u.id))) : grouped;
  // Por defecto, las notificaciones dirigidas a mí ("asignadas a mí") aparecen primero
  filtered=[...filtered].sort((a,b)=>{
    const am=(a.n.toUserIds&&a.n.toUserIds.includes(u.id))?0:1;
    const bm=(b.n.toUserIds&&b.n.toUserIds.includes(u.id))?0:1;
    return am-bm;
  });

  return `<div class="pagehead"><div><h1>${t('nav_notif')}</h1></div>
    <button class="btn btn-ghost btn-sm" onclick="STATE.showEscalation=!STATE.showEscalation;renderAll()">${STATE.showEscalation?(STATE.lang==='en'?'Hide':'Ocultar'):(STATE.lang==='en'?'Show':'Ver')} escalamiento</button></div>
    ${STATE.showEscalation?`<div class="card" style="margin-bottom:14px"><div class="section-title">${STATE.lang==='en'?'Automatic escalation':'Escalamiento automático'}</div>
      ${escalationAlerts().slice(0,10).map(e=>`<div class="alert-line" onclick="setView('actividades','${e.a.id}')">
        <div class="ic">${e.escTo===roleLabel('subdirector')?'🔴':'🟠'}</div><div>${e.a.code} · ${esc(e.a.name)} — ${e.dias}d → ${e.escTo}</div></div>`).join('')||`<div class="empty">${t('empty_generic')}</div>`}
      </div>`:''}
    <div class="filterbar">
      <button class="btn btn-sm ${!typeFilter?'btn-primary':''}" onclick="STATE.notifTypeFilter='';renderAll()">${STATE.lang==='en'?'All':'Todas'}</button>
      ${NOTIF_TYPES.map(k=>`<button class="btn btn-sm ${typeFilter===k?'btn-primary':''}" onclick="STATE.notifTypeFilter='${k}';renderAll()">${typeLabel(k)}</button>`).join('')}
    </div>
    <div class="card">
    ${filtered.length?filtered.map(({n,extra})=>`<div class="alert-line" style="cursor:pointer" onclick="${n.activityId?`openActivityHistoryModal('${n.activityId}')`:''}">
      <div class="ic">${notifIcon(n.type)}</div>
      <div style="flex:1">
        <div style="font-size:11px;color:var(--accent);font-weight:700;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px">
          ${n.actorId?esc(userName(n.actorId)):(STATE.lang==='en'?'System':STATE.lang==='zh'?'系统':'Sistema')}
          <span style="color:var(--text-faint);font-weight:500;text-transform:none;letter-spacing:0">— ${n.date}</span>
        </div>
        <div>${esc(n.text)}</div>
        ${extra>0?`<div style="font-size:11px;color:var(--accent);margin-top:3px;text-decoration:underline">+${extra} ${STATE.lang==='en'?'more update(s) — click to see full history':'actualización(es) más — clic para ver el historial completo'}</div>`:''}
      </div></div>`).join(''):`<div class="empty"><div class="big">🔔</div>${t('empty_notifs')}</div>`}
    </div>`;
}

function applyFilters(list){
  const f=STATE.filters;
  const me=currentUser();
  return list.filter(a=>{
    if(f.mine && me && !((a.responsibleIds||[]).includes(me.id) || (a.executorIds||[]).includes(me.id))) return false;
    if(f.q){ const q=f.q.toLowerCase(); if(!(a.name.toLowerCase().includes(q)||a.code.toLowerCase().includes(q)||(a.description||'').toLowerCase().includes(q))) return false; }
    if(f.area && a.area!==f.area) return false;
    if(f.discipline && !(a.disciplines||[]).includes(f.discipline)) return false;
    if(f.front && a.front!==f.front) return false;
    if(f.otDocType && a.otDocType!==f.otDocType) return false;
    if(f.responsible && !(a.responsibleIds||[]).includes(f.responsible)) return false;
    if(f.executor && !(a.executorIds||[]).includes(f.executor)) return false;
    if(f.priority && a.priority!==f.priority) return false;
    if(f.status && a.status!==f.status) return false;
    return true;
  });
}
function viewActividades(){
  if(STATE.activityId){ return activityDetail(STATE.activityId); }
  const scope=applyFilters(scopeForUser(currentUser()).filter(a=>!a.parentId));
  return `<div class="pagehead"><div><h1>${t('nav_actividades')}</h1><div class="sub">${scope.length}</div></div>
    ${can('create')?`<button class="btn btn-primary" onclick="openNewActivity()">${t('btn_new_activity')}</button>`:''}</div>
    ${activityFilterBar()}${activityTable(scope)}`;
}
function sortIndicator(key){ return STATE.sort.key===key ? (STATE.sort.dir>0?' ▲':' ▼') : ''; }
function sortBy(key){ if(STATE.sort.key===key) STATE.sort.dir*=-1; else {STATE.sort.key=key; STATE.sort.dir=1;} renderAll(); }
function activityTable(list){
  const {key,dir}=STATE.sort;
  const sorted=[...list].sort((a,b)=>{ let va=a[key], vb=b[key];
    if(key==='responsibleId'){va=responsibleNames(a);vb=responsibleNames(b);}
    if(key==='discipline'){va=discNames(a.disciplines);vb=discNames(b.disciplines);}
    if(va===undefined) va=''; if(vb===undefined) vb='';
    return va>vb?dir:va<vb?-dir:0; });
  if(!sorted.length) return `<div class="card"><div class="empty"><div class="big">◻</div>${t('empty_activities')}</div></div>`;
  const anyDelCol=sorted.some(a=>canDeleteRecord(a.createdBy));
  return `<div class="tbl-wrap"><table><thead><tr>
    <th onclick="sortBy('code')">${t('th_id')}${sortIndicator('code')}</th>
    <th onclick="sortBy('name')">${t('th_activity')}${sortIndicator('name')}</th>
    <th onclick="sortBy('discipline')">${t('th_discipline')}${sortIndicator('discipline')}</th>
    <th onclick="sortBy('front')">${t('th_front')}</th>
    <th onclick="sortBy('responsibleId')">${t('th_responsible')}${sortIndicator('responsibleId')}</th>
    <th>${t('th_executor')}</th>
    <th onclick="sortBy('priority')">${t('th_priority')}${sortIndicator('priority')}</th>
    <th onclick="sortBy('dueDate')">${t('th_due')}${sortIndicator('dueDate')}</th>
    <th>${t('th_progress')}</th><th>${t('th_status')}</th>${anyDelCol?'<th></th>':''}</tr></thead><tbody>
    ${sorted.map(a=>{ const delOk=canDeleteRecord(a.createdBy); return `<tr class="row-click" onclick="setView('actividades','${a.id}')">
      <td class="tag" style="border-left:4px solid ${PRIORITY_COLOR[a.priority]||'transparent'}">${a.code}</td>
      <td>${esc(a.name)}${subtasksOf(a.id).length?` <span class="tag">${subtasksOf(a.id).length}</span>`:''}${a.readyForSite?` <span class="badge b-site"><span class="d"></span>🚧</span>`:''}${execBlockedCount(a)>0?` <span class="badge b-block"><span class="d"></span>${execBlockedCount(a)}👤</span>`:''}</td>
      <td>${discNames(a.disciplines)}</td><td>${frontName(a.front)}</td><td>${responsibleNamesShort(a)}</td><td>${executorNamesShort(a)}</td>
      <td><span class="badge b-${a.priority.toLowerCase()}"><span class="d"></span>${priorityLabel(a.priority)}</span></td>
      <td style="font-family:var(--font-mono)">${fmtDate(a.dueDate)}</td>
      <td><div class="progress"><i style="width:${a.progress}%"></i></div></td>
      <td>${(()=>{const v=visualStatus(a);return `<span class="badge ${v.cls}"><span class="d"></span>${v.label}</span>`;})()}</td>
      ${anyDelCol?`<td>${delOk?`<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();confirmDeleteActivity('${a.id}')">✕</button>`:''}</td>`:''}
    </tr>`;}).join('')}
  </tbody></table></div>`;
}

/* ---- ACTIVITY ACTIONS ---- */
function updateProgress(id,val){ const a=byId(DB.activities,id); const before=a.progress; a.progress=+val; pushHistory(a,currentUser(),'progress',before+'%',val+'%');
  if(+val!==before) notify(`📈 ${a.code}: ${STATE.lang==='en'?'progress':'avance'} ${before}% → ${val}%`,'nueva',a.id);
  saveDB(); renderTopbar(); }
function updateStatus(id,val){
  const a=byId(DB.activities,id); const before=a.status;
  if(val==='completada'){
    const pend=subtasksOf(a.id).filter(s=>s.status!=='completada'&&s.status!=='cancelada');
    if(pend.length){ toast(STATE.lang==='en'?'Cannot complete: pending subtasks remain.':'No se puede completar: existen subtareas pendientes.'); renderAll(); return; }
    a.actualEndDate=iso(today()); a.progress=100;
  }
  a.status=val; a.blocked=(val==='bloqueada'); pushHistory(a,currentUser(),'status',before,val);
  notify(`${a.code}: ${statusLabel(before)} → ${statusLabel(val)}`, val==='completada'?'completada':'nueva', a.id);
  if(val==='bloqueada') notify(`🟠 ${a.code} · ${a.name}`,'bloqueo',a.id);
  reindexAffected(a);
  saveDB(); renderAll();
}
function setBlockReason(id,val){ const a=byId(DB.activities,id); a.blockReason=val; saveDB(); }
function setField(id,field,val){ const a=byId(DB.activities,id); const before=a[field]; a[field]=val; pushHistory(a,currentUser(),field,before,val); saveDB(); renderAll(); }
function setResponsibles(id,selectEl){ const a=byId(DB.activities,id); const before=responsibleNames(a); a.responsibleIds=[...selectEl.selectedOptions].map(o=>o.value); pushHistory(a,currentUser(),'responsibleIds',before,responsibleNames(a)); saveDB(); renderAll(); }
function toggleReadyForSite(id,val){ const a=byId(DB.activities,id); a.readyForSite=val; pushHistory(a,currentUser(),'readyForSite',!val,val); notify(`🚧 ${a.code} ${val?(STATE.lang==='en'?'marked ready for site':'marcada lista para obra'):(STATE.lang==='en'?'unmarked ready for site':'desmarcada lista para obra')}`,'nueva',a.id); saveDB(); renderAll(); }
function addComment(id){ const inp=document.getElementById('commentInput'); if(!inp.value.trim()) return;
  const a=byId(DB.activities,id); a.comments.push({userId:currentUser().id,text:inp.value.trim(),date:nowStamp()}); saveDB(); renderAll(); }
function addDoc(id){ const n=document.getElementById('docName').value.trim(), u=document.getElementById('docUrl').value.trim();
  if(!n||!u) return; const a=byId(DB.activities,id); a.documents.push({name:n,url:u}); saveDB(); renderAll(); }
function removeDoc(id,i){ const a=byId(DB.activities,id); a.documents.splice(i,1); saveDB(); renderAll(); }
function removeDependency(id,depId){ const a=byId(DB.activities,id); a.dependencies=a.dependencies.filter(d=>d.id!==depId); saveDB(); renderAll(); }
function doRecalc(id){ const moved=recalcFrom(id); saveDB(); toast((STATE.lang==='en'?'Activities recalculated: ':'Actividades recalculadas: ')+moved); renderAll(); }
function confirmDeleteActivity(id){
  const a=byId(DB.activities,id); if(!a) return;
  if(!canDeleteRecord(a.createdBy)){ toast(t('no_permission')); return; }
  const subs=subtasksOf(id);
  const msg=(STATE.lang==='en'?'Delete activity ':'Eliminar la actividad ')+a.code+(subs.length?(STATE.lang==='en'?` and its ${subs.length} subtasks`:` y sus ${subs.length} subtareas`):'')+'?';
  if(!confirm(msg)) return;
  const idsToRemove=new Set([id,...subs.map(s=>s.id)]);
  const affectedDiscs=new Set(a.disciplines||[]);
  DB.activities=DB.activities.filter(x=>!idsToRemove.has(x.id));
  DB.activities.forEach(x=>{ x.dependencies=x.dependencies.filter(d=>!idsToRemove.has(d.id)); });
  affectedDiscs.forEach(d=>reindexDiscipline(d)); saveDB();
  if(STATE.activityId && idsToRemove.has(STATE.activityId)) STATE.activityId=null;
  toast(STATE.lang==='en'?'Activity deleted.':'Actividad eliminada.'); renderAll();
}

  let primary = (discIds&&discIds.length) ? pool.filter(u=>userDiscIds(u).some(d=>discIds.includes(d))) : pool;

function viewGantt(){
  const range=STATE.ganttRange;
  const list=applyFilters(scopeForUser(currentUser()).filter(a=>!a.parentId)).slice(0,30);
  const start=addDays(today(),-5); const end=addDays(start,range); const totalDays=diffDays(end,start);
  const todayPct=diffDays(iso(today()),start)/totalDays*100;
  return `<div class="pagehead"><div><h1>${t('nav_gantt')}</h1><div class="sub">${fmtDate(start)} — ${fmtDate(end)}</div></div>
    <div class="filterbar">${[30,45,90].map(r=>`<button class="btn btn-sm ${range===r?'btn-primary':''}" onclick="STATE.ganttRange=${r};renderAll()">${r}d</button>`).join('')}</div></div>
    ${activityFilterBar()}
    <div class="card tight">
    ${list.map(a=>{
      const s=Math.max(0,diffDays(a.startDate,start)); const e=Math.min(totalDays,diffDays(computedEnd(a),start));
      const left=s/totalDays*100, width=Math.max(1,(e-s)/totalDays*100);
      const color= a.status==='completada'?'var(--green)': isOverdue(a)?'var(--red)': a.blocked?'var(--purple)': PRIORITY_COLOR[a.priority]||'var(--accent)';

        <div class="gantt-track"><div class="gantt-grid-lines">${Array.from({length:Math.round(totalDays/7)}).map(()=>'<div></div>').join('')}</div>
          <div class="gantt-today" style="left:${todayPct}%"></div>
          <div class="gantt-bar" style="left:${left}%;width:${width}%;background:${color}" title="${a.name}"><span>${a.progress}%</span></div></div>
      </div>`;
    }).join('') || `<div class="empty">${t('empty_activities')}</div>`}
    </div>`;
}

function viewCalendario(){
  const y=STATE.calYear, m=STATE.calMonth;
  const first=new Date(y,m,1); const startWeekDay=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate(); const cells=[];
  for(let i=0;i<startWeekDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  const monthName=first.toLocaleDateString(STATE_LOCALE(),{month:'long',year:'numeric'});
  const acts=DB.activities.filter(a=>a.status!=='cancelada');
  const dows=STATE.lang==='en'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const showVac=STATE.calShowVacations!==false;
  const vacUserFilter=STATE.calVacUser||'';
  const usersWithVac=DB.users.filter(u=>(u.vacations||[]).length);
  const usersOnVacationOn=(dateStr)=> DB.users.filter(u=> (!vacUserFilter||u.id===vacUserFilter) && isOnVacation(u,dateStr));
  return `<div class="pagehead"><div><h1>${t('nav_calendario')}</h1><div class="sub" style="text-transform:capitalize">${monthName}</div></div>
    <div class="filterbar"><button class="btn btn-sm" onclick="calNav(-1)">‹</button>
      <button class="btn btn-sm" onclick="STATE.calMonth=new Date().getMonth();STATE.calYear=new Date().getFullYear();renderAll()">${STATE.lang==='en'?'Today':'Hoy'}</button>
      <button class="btn btn-sm" onclick="calNav(1)">›</button>
      <span class="sep"></span>
      <button class="btn btn-sm ${showVac?'btn-primary':'btn-ghost'}" onclick="STATE.calShowVacations=${!showVac};renderAll()">🏖 ${STATE.lang==='en'?'Vacations':'Vacaciones'}</button>
      ${showVac?`<select onchange="STATE.calVacUser=this.value;renderAll()"><option value="">${STATE.lang==='en'?'Everyone':'Todos'}</option>${usersWithVac.map(u=>`<option value="${u.id}" ${vacUserFilter===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`:''}
    </div></div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(d=>{ if(!d) return '<div class="cal-cell out"></div>';
        const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const isToday=dateStr===iso(today());
        const dayActs=acts.filter(a=>a.dueDate===dateStr);
        const onVac=showVac?usersOnVacationOn(dateStr):[];
        return `<div class="cal-cell ${isToday?'today':''}" ${onVac.length?'style="border-left:3px solid var(--amber);background:var(--amber-dim)"':''}><div class="dn">${d}</div>
          ${onVac.slice(0,2).map(u=>`<div class="cal-dot" style="background:var(--amber-dim);color:var(--amber);font-weight:600" title="${STATE.lang==='en'?'On vacation':'De vacaciones'}: ${esc(u.name)}">🏖 ${esc(u.name.split(' ')[0])}</div>`).join('')}
          ${onVac.length>2?`<div class="cal-dot" style="color:var(--amber)">🏖 +${onVac.length-2}</div>`:''}
          ${dayActs.slice(0,3).map(a=>`<div class="cal-dot" style="background:${a.priority==='P1'?'var(--red-dim)':'var(--panel-3)'};color:${a.priority==='P1'?'var(--red)':'var(--text-dim)'}" onclick="setView('actividades','${a.id}')" title="${esc(a.name)}">${esc(a.name)}</div>`).join('')}
          ${dayActs.length>3?`<div class="cal-dot">+${dayActs.length-3}</div>`:''}</div>`;
      }).join('')}</div>`;
}

/* ============================ GESTOR DE CONTRATOS ============================ */
const CURRENCIES=['COP','USD','EUR'];
function contratoDiasRestantes(c){ if(!c.fechaFin) return null; return diffDays(c.fechaFin, iso(today())); }
function contratoEstadoCalc(c){
  if(c.estado==='liquidado') return 'liquidado';
  if(c.estado==='suspendido') return 'suspendido';
  const d=contratoDiasRestantes(c);
  if(d===null) return 'vigente';
  if(d<0) return 'vencido';
  if(d<=30) return 'por_vencer';
  return 'vigente';
}
function contratoEstadoLabel(key){
  const m={vigente:{es:'Vigente',en:'Active'},por_vencer:{es:'Por vencer',en:'Expiring soon'},vencido:{es:'Vencido',en:'Expired'},
    liquidado:{es:'Liquidado',en:'Settled'},suspendido:{es:'Suspendido',en:'Suspended'}};
  return (m[key]&&m[key][STATE.lang])||(m[key]&&m[key].es)||key;
}
function contratoBadgeClass(key){ return {vigente:'b-ok',por_vencer:'b-warn',vencido:'b-late',liquidado:'b-muted',suspendido:'b-block'}[key]||'b-muted'; }
function fmtMoney(v,curr){
  if(v===null||v===undefined||v==='') return '—';
  curr=curr||'COP';
  const sym={COP:'$',USD:'US$',EUR:'€'}[curr]||curr+' ';
  return sym+Number(v).toLocaleString(STATE_LOCALE());
}
function valoresDisplay(c){ return (c.valores&&c.valores.length)? c.valores.map(v=>fmtMoney(v.monto,v.moneda)).join(' + ') : '—'; }
function valorFinalPorMoneda(c){
  const sums={};
  (c.valores||[]).forEach(v=>{ sums[v.moneda]=(sums[v.moneda]||0)+Number(v.monto||0); });
  return sums;
}
function valorFinalDisplay(c){
  const sums=valorFinalPorMoneda(c); const keys=Object.keys(sums);
  if(!keys.length) return '—';
  return keys.map(k=>fmtMoney(sums[k],k)).join(' + ');
}
function valorTotalTodosContratos(){
  const sums={};
  DB.contratos.forEach(c=>{ (c.valores||[]).forEach(v=>{ sums[v.moneda]=(sums[v.moneda]||0)+Number(v.monto||0); }); });
  return sums;
}
function viewContratos(){
  if(!canManageUsers()) return `<div class="pagehead"><div><h1>${t('nav_contratos')}</h1></div></div><div class="card"><div class="empty">${t('no_permission')}</div></div>`;
  const list=[...DB.contratos].sort((a,b)=>{
    const order={vencido:0,por_vencer:1,vigente:2,suspendido:3,liquidado:4};
    return (order[contratoEstadoCalc(a)]-order[contratoEstadoCalc(b)]) || (a.fechaFin||'').localeCompare(b.fechaFin||'');
  });
  const alertas=list.filter(c=>['por_vencer','vencido'].includes(contratoEstadoCalc(c)));
  const totales=valorTotalTodosContratos(); const totalKeys=Object.keys(totales);
  return `<div class="pagehead"><div><h1>${t('nav_contratos')}</h1><div class="sub">${STATE.lang==='en'?'Direction & Coordination only':'Solo Dirección y Coordinación'}</div></div>
    <button class="btn btn-primary" onclick="openNewContrato()">${STATE.lang==='en'?'+ New contract':'+ Nuevo contrato'}</button></div>
    <div class="grid grid-3" style="margin-bottom:14px">

function otActivities(){ return DB.activities.filter(a=>!a.parentId && a.area==='oficina_tecnica'); }
function otObsPending(a){ return (a.otObservaciones||[]).filter(o=>!o.atencion).length; }
function rondaEstado(r){ if(r.fechaRespuestaReal) return 'respondida'; if(r.fechaRespuestaEsperada && iso(today())>r.fechaRespuestaEsperada) return 'vencida'; return 'enviada'; }
function otRondaVencidaCount(a){ return ((a.otTracking&&a.otTracking.rondas)||[]).filter(r=>rondaEstado(r)==='vencida').length; }
function otEstadoResumen(a){
  const tk=a.otTracking||{};
  if(a.status==='completada') return {label:STATE.lang==='en'?'Closed':'Cerrado',cls:'b-ok'};
  if(otObsPending(a)>0) return {label:STATE.lang==='en'?'Pending observations':'Con observaciones pendientes',cls:'b-late'};
  if(otRondaVencidaCount(a)>0) return {label:STATE.lang==='en'?'Review round overdue':'Ronda de revisión vencida',cls:'b-late'};
  if(tk.requiereInterventoria){
    const rondas=tk.rondas||[];
    const last=rondas[rondas.length-1];
    if(last && !last.fechaRespuestaReal) return {label:(STATE.lang==='en'?'Round ':'Ronda ')+last.numero+' '+(STATE.lang==='en'?'in review':'en revisión'),cls:'b-review'};
    if(last && last.fechaRespuestaReal) return {label:STATE.lang==='en'?'Reviewed by inspection':'Revisado por interventoría',cls:'b-ok'};
    if(tk.fechaEnvioInterventoria) return {label:STATE.lang==='en'?'Sent to inspection':'Enviado a interventoría',cls:'b-warn'};
  }
  if(tk.fechaEnvioConstruccion) return {label:STATE.lang==='en'?'Sent to construction':'Enviado a construcción',cls:'b-muted'};
  return {label:STATE.lang==='en'?'In progress':'En elaboración',cls:'b-muted'};
}

function addObsImages(aid,obsId,input){
  const a=byId(DB.activities,aid); const obs=(a.otObservaciones||[]).find(o=>o.id===obsId); if(!obs) return;
  if(!canRespondObs(a,obs)){ toast(t('no_permission')); return; }
  const files=[...input.files]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=e=>{
      obs.imagenes=obs.imagenes||[]; obs.imagenes.push({id:uid('IMG'),dataUrl:e.target.result,name:f.name});
      pending--; if(pending===0){ saveDB(); renderAll(); }

async function exportOtReporteExcel(aid){
  const a=byId(DB.activities,aid);
  if(typeof ExcelJS==='undefined'){ toast(STATE.lang==='en'?'Excel library failed to load (check your internet connection).':'No se pudo cargar la librería de Excel (revisa tu conexión a internet).'); return; }
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(STATE.lang==='en'?'Report':'Reporte');
  ws.columns=[
    {header:STATE.lang==='en'?'Observation date':'Fecha de observación',key:'f1',width:16},
    {header:STATE.lang==='en'?'Observation':'Observación',key:'f2',width:42},
    {header:STATE.lang==='en'?'Source':'Fuente',key:'f3',width:14},
    {header:STATE.lang==='en'?'Response date':'Fecha de respuesta',key:'f4',width:16},
    {header:STATE.lang==='en'?'Response owner':'Responsable de respuesta',key:'f5',width:24},
    {header:STATE.lang==='en'?'Response':'Respuesta',key:'f6',width:48},
  ];
  ws.getRow(1).font={bold:true};
  const obsList=a.otObservaciones||[];
  for(let i=0;i<obsList.length;i++){
    const o=obsList[i];
    const row=ws.addRow({f1:fmtDate(o.fecha),f2:o.texto,f3:o.fuente||'',f4:o.fechaAtencion?fmtDate(o.fechaAtencion):'',
      f5:o.atendidoPor?userName(o.atendidoPor):'',f6:o.atencion||''});
    row.alignment={wrapText:true,vertical:'top'};
    if(o.imagenes && o.imagenes.length){
      row.height=72;
      const img=o.imagenes[0];
      const m=img.dataUrl.match(/^data:image\/(\w+);base64,/);
      const ext=m&&m[1]==='jpeg'?'jpeg':'png';
      try{
        const imgId=wb.addImage({base64:img.dataUrl,extension:ext});
        ws.addImage(imgId,{tl:{col:5.05,row:row.number-1+0.05},ext:{width:88,height:64}});
      }catch(e){}
      if(o.imagenes.length>1) row.getCell(2).value=row.getCell(2).value+` (+${o.imagenes.length-1} ${STATE.lang==='en'?'more image(s)':'imagen(es) más'})`;
    }
  }
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob); const link=document.createElement('a');
  link.href=url; link.download=(a.otConsecutivo||a.code)+'-reporte.xlsx'; link.click();
  toast(STATE.lang==='en'?'Excel report downloaded.':'Reporte Excel descargado.');
}

function avEstadoLabel(key){
  const m={
    bloqueada:{es:'Bloqueada',en:'Blocked',zh:'已阻塞'},
    en_revision:{es:'En revisión',en:'In review',zh:'审核中'},
    proceso_no_objecion:{es:'Proceso no objeción',en:'No-objection process',zh:'无异议流程中'},
    no_objetado:{es:'No objetado (aprobado)',en:'No objections (approved)',zh:'无异议（已批准）'},
  };
  return (m[key]&&m[key][STATE.lang])||(m[key]&&m[key].es)||key;
}
function avTipoName(id){ return (byId(DB.avanceTipos,id)||{}).name||'—'; }
function avTipoIcon(id){ return (byId(DB.avanceTipos,id)||{}).icon||'📐'; }
/* El estado de un elemento se calcula a partir de sus disciplinas: si alguna está
   bloqueada, el elemento está bloqueado; si no, si alguna sigue en revisión, etc.
   Solo cuando TODAS sus disciplinas están "No objetado" el elemento llega al 100%. */
function avElementEstado(x){
  const des=x.disciplinasEstado||[];
  if(!des.length) return 'en_revision';
  const order=['bloqueada','en_revision','proceso_no_objecion'];
  for(const k of order) if(des.some(d=>d.estado===k)) return k;
  return 'no_objetado';
}
function avElementPct(x){
  const des=x.disciplinasEstado||[]; if(!des.length) return 0;
  return Math.round(des.filter(d=>d.estado==='no_objetado').length/des.length*100);
}
function avElementLastApprovalDate(x){
  const dates=(x.disciplinasEstado||[]).filter(d=>d.estado==='no_objetado'&&d.fecha).map(d=>d.fecha).sort();
  return dates.length? dates[dates.length-1] : '';
}
function avScopeList(){
  const scope=STATE.avScope||'parcial'; // 'parcial' | 'general'
  let list=[...DB.avanceDiseno];
  if(scope==='parcial') list=list.filter(x=>x.funcionamientoParcial);
  if(STATE.avTipoFilter) list=list.filter(x=>x.tipoId===STATE.avTipoFilter);
  if(STATE.avDiscFilter) list=list.filter(x=>(x.disciplinasEstado||[]).some(d=>d.disciplinaId===STATE.avDiscFilter));
  return list;
}
function avStats(list){
  const counts={}; AV_ESTADOS.forEach(k=>counts[k]=0);
  list.forEach(x=>{ const e=avElementEstado(x); if(counts[e]!==undefined) counts[e]++; });
  const total=list.length;
  const pct={}; AV_ESTADOS.forEach(k=>pct[k]= total? Math.round(counts[k]/total*1000)/10 : 0);
  return {counts,total,pct};
}
function avDonutHtml(stats){
  if(!stats.total) return `<div class="av-donut" style="background:var(--panel-3)"></div>`;
  let acc=0; const stops=[];
  AV_ESTADOS.forEach(k=>{ const start=acc; acc+=stats.pct[k]; stops.push(`${AV_COLOR[k]} ${start}% ${acc}%`); });
  return `<div class="av-donut" style="background:conic-gradient(${stops.join(',')})">
    <div class="av-donut-label"><b>${stats.pct.no_objetado}%</b><span>${STATE.lang==='en'?'approved':STATE.lang==='zh'?'已批准':'aprobado'}</span></div>
  </div>`;
}

function createAvanceItem(){
  const nombre=document.getElementById('av_nombre').value.trim(); if(!nombre) return;
  const estado=document.getElementById('av_estado').value;
  const discIds=[...document.getElementById('av_disc').selectedOptions].map(o=>o.value);
  const mkRow=d=>({id:uid('AVD'),disciplinaId:d,estado,fecha:iso(today()),motivo:estado==='bloqueada'?(STATE.lang==='en'?'Pending':'Pendiente'):''});
  const disciplinasEstado = discIds.length? discIds.map(mkRow) : [mkRow(null)];
  DB.avanceDiseno.push({id:uid('AVI'),tipoId:document.getElementById('av_tipo').value,nombre,
    disciplinasEstado, funcionamientoParcial:document.getElementById('av_scope').value==='true',
    planosEnviadosFirma:false,fechaEnviados:'',planosFirmados:false,fechaFirmados:'',
    notas:'',createdBy:currentUser().id});
  saveDB(); closeModal(); renderAll();
}
function setAvField(id,field,val){
  if(!isDirector()){ toast(t('no_permission')); return; }
  const x=byId(DB.avanceDiseno,id); if(!x) return;
  x[field]=val; saveDB();
}
function setAvDiscField(itemId,rowId,field,val){
  if(!isDirector()){ toast(t('no_permission')); return; }
  const x=byId(DB.avanceDiseno,itemId); const row=(x.disciplinasEstado||[]).find(d=>d.id===rowId); if(!row) return;
  row[field]=val; saveDB(); openEditAvanceItem(itemId);
}
function addAvDisciplina(itemId){
  if(!isDirector()){ toast(t('no_permission')); return; }
  const x=byId(DB.avanceDiseno,itemId);
  const discId=document.getElementById('av_new_disc').value||null;
  const estado=document.getElementById('av_new_estado').value;
  const fecha=document.getElementById('av_new_fecha').value||iso(today());

  x.disciplinasEstado.push({id:uid('AVD'),disciplinaId:discId,estado,fecha,motivo:estado==='bloqueada'?(STATE.lang==='en'?'Pending':'Pendiente'):''});

function removeAvDisciplina(itemId,rowId){
  if(!isDirector()){ toast(t('no_permission')); return; }
  const x=byId(DB.avanceDiseno,itemId);
  if((x.disciplinasEstado||[]).length<=1){ toast(STATE.lang==='en'?'An element needs at least one discipline row.':'Un elemento necesita al menos una fila de disciplina.'); return; }
  x.disciplinasEstado=(x.disciplinasEstado||[]).filter(d=>d.id!==rowId); saveDB(); openEditAvanceItem(itemId);
}

function deleteAvanceItem(id){
  const x=byId(DB.avanceDiseno,id); if(!x) return;
  if(!isDirector()){ toast(t('no_permission')); return; }
  if(!confirm(STATE.lang==='en'?'Delete this element?':'¿Eliminar este elemento?')) return;
  DB.avanceDiseno=DB.avanceDiseno.filter(a=>a.id!==id); saveDB(); closeModal(); renderAll();
}
function avChip(x){
  const e=avElementEstado(x), pct=avElementPct(x);
  return `<div class="av-chip" style="background:${AV_COLOR[e]}" onclick="openEditAvanceItem('${x.id}')" title="${esc(x.nombre)} — ${avEstadoLabel(e)} (${pct}%)">
    <span class="ic">${avTipoIcon(x.tipoId)}</span><span class="nm">${esc(x.nombre)}</span><span class="pct">${pct}%</span></div>`;
}

function saveThresholds(){
  const u=+document.getElementById('th_urgente').value||1, a=+document.getElementById('th_alta').value||u+1, m=+document.getElementById('th_media').value||a+1;
  DB.settings.priorityThresholds={urgente:u,alta:Math.max(a,u+1),media:Math.max(m,a+1)};
  reindexAllDisciplines(DB); saveDB(); toast(STATE.lang==='en'?'Thresholds updated.':'Umbrales actualizados.'); renderAll();
}

function createUser(){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  const name=document.getElementById('u_name').value.trim(); if(!name) return;
  const email=document.getElementById('u_email').value.trim()||name.toLowerCase().replace(/\s+/g,'.')+'@proyecto-ferreo.com';
  let username=document.getElementById('u_username').value.trim()||email.split('@')[0];
  if(DB.users.some(u=>(u.username||'').toLowerCase()===username.toLowerCase())){ toast(STATE.lang==='en'?'Username already exists.':'Ese usuario ya existe.'); return; }
  DB.users.push({id:uid('U'),name,role:document.getElementById('u_role').value,cargo:document.getElementById('u_cargo').value.trim(),
    disciplinaIds:[...document.getElementById('u_disc').selectedOptions].map(o=>o.value), email, username, password:document.getElementById('u_password').value||'1234',
    hireDate:document.getElementById('u_hire').value||'', birthday:document.getElementById('u_birthday').value||'', vacations:[], licenses:[],
    notifPrefs:{nuevas:true,vencimientos:true,bloqueos:true,prioridad:true,fechas:true,devoluciones:true}});
  saveDB(); closeModal(); renderAll();
}
