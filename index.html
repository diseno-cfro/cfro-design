function saveEditUser(id){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  const u=byId(DB.users,id);
  const newUsername=document.getElementById('eu_username').value.trim()||u.username;
  if(DB.users.some(x=>x.id!==id && (x.username||'').toLowerCase()===newUsername.toLowerCase())){ toast(STATE.lang==='en'?'Username already exists.':'Ese usuario ya existe.'); return; }
  u.name=document.getElementById('eu_name').value.trim()||u.name;
  u.cargo=document.getElementById('eu_cargo').value.trim();
  u.role=document.getElementById('eu_role').value;
  u.disciplinaIds=[...document.getElementById('eu_disc').selectedOptions].map(o=>o.value);
  u.email=document.getElementById('eu_email').value.trim();
  u.hireDate=document.getElementById('eu_hire').value||'';
  u.birthday=document.getElementById('eu_birthday').value||'';
  u.username=newUsername;
  u.password=document.getElementById('eu_password').value||u.password;
  saveDB(); closeModal(); renderAll(); toast(STATE.lang==='en'?'User updated.':'Usuario actualizado.');
}
function addVacation(userId){
  const s=document.getElementById('vac_start').value, e=document.getElementById('vac_end').value;
  if(!s||!e||e<s) return;
  const u=byId(DB.users,userId); u.vacations=u.vacations||[]; u.vacations.push({id:uid('VAC'),start:s,end:e});
  saveDB(); openEditUser(userId);
}
function removeVacation(userId,vacId){ const u=byId(DB.users,userId); u.vacations=(u.vacations||[]).filter(v=>v.id!==vacId); saveDB(); openEditUser(userId); }
function addLicense(userId){
  const n=document.getElementById('lic_name').value.trim(), e=document.getElementById('lic_expiry').value;
  if(!n||!e) return;
  const u=byId(DB.users,userId); u.licenses=u.licenses||[]; u.licenses.push({id:uid('LIC'),name:n,expiry:e});
  saveDB(); openEditUser(userId);
}
function removeLicense(userId,licId){ const u=byId(DB.users,userId); u.licenses=(u.licenses||[]).filter(l=>l.id!==licId); saveDB(); openEditUser(userId); }
function toggleLicenseExempt(userId,val){ const u=byId(DB.users,userId); u.licenseExempt=val; saveDB(); openEditUser(userId); }
function deleteUser(id){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  const used=DB.activities.some(a=>(a.responsibleIds||[]).includes(id)||(a.executorIds||[]).includes(id));
  const msg=used?(STATE.lang==='en'?'This person is referenced in activities. Delete anyway?':'Esta persona está referenciada en actividades. ¿Eliminar de todas formas?'):(STATE.lang==='en'?'Delete this user?':'¿Eliminar este usuario?');
  if(!confirm(msg)) return;
  DB.users=DB.users.filter(u=>u.id!==id); saveDB(); renderAll();
}
function adminLicencias(){
  if(!canManageUsers()) return `<div class="card"><div class="empty">${t('no_permission')}</div></div>`;
  const now=iso(today());
  const groups=DB.users.filter(u=>(u.licenses||[]).length).map(u=>({
    u, licenses:[...u.licenses].sort((a,b)=>diffDays(a.expiry,now)-diffDays(b.expiry,now))
  })).sort((a,b)=>Math.min(...a.licenses.map(l=>diffDays(l.expiry,now))) - Math.min(...b.licenses.map(l=>diffDays(l.expiry,now))));
  const totalLicenses=groups.reduce((s,g)=>s+g.licenses.length,0);
  const sinLicencia=DB.users.filter(u=>!(u.licenses||[]).length && !u.licenseExempt);
  return `
  <div class="grid grid-3" style="margin-bottom:14px">
    <div class="kpi k-accent"><div class="n">${totalLicenses}</div><div class="l">${STATE.lang==='en'?'Total licenses on file':'Licencias registradas en total'}</div></div>
    <div class="kpi k-amber"><div class="n">${groups.reduce((s,g)=>s+g.licenses.filter(l=>{const d=diffDays(l.expiry,now);return d>=0&&d<=30;}).length,0)}</div><div class="l">${STATE.lang==='en'?'Expiring within 30 days':'Vencen en 30 días'}</div></div>
    <div class="kpi k-red"><div class="n">${groups.reduce((s,g)=>s+g.licenses.filter(l=>diffDays(l.expiry,now)<0).length,0)}</div><div class="l">${STATE.lang==='en'?'Expired':'Vencidas'}</div></div>
  </div>
  ${sinLicencia.length?`<div class="card" style="margin-bottom:14px;border-color:var(--amber)">
    <div class="section-title" style="color:var(--amber)">${STATE.lang==='en'?'Users with no license on file':'Usuarios sin licencia registrada'} <span class="tag">${sinLicencia.length}</span></div>
    <p class="hint" style="margin-bottom:8px">${STATE.lang==='en'?'If someone genuinely doesn\'t need one, mark "Does not require a license" on their user profile so they stop appearing here.':'Si alguien de verdad no necesita, marca "No requiere licencia" en su ficha para que deje de aparecer aquí.'}</p>
    <div class="mini-list">${sinLicencia.map(u=>`<div class="mini-list-row"><span>${esc(u.name)} <span style="color:var(--text-faint);font-size:11px">${roleLabel(normRole(u))}</span></span><button class="btn btn-ghost btn-sm" onclick="openEditUser('${u.id}')">${t('btn_edit')}</button></div>`).join('')}</div>
  </div>`:''}
  <div class="card"><div class="section-title">${STATE.lang==='en'?'Licenses in use':'Licencias en uso'} (${totalLicenses})
      <button class="btn btn-sm btn-primary" onclick="exportLicensesExcel()">⇩ Excel</button></div>
    <p class="hint" style="margin-bottom:10px">${STATE.lang==='en'?'Edit a user to add or remove licenses. Direction and Coordination are notified automatically 30 days before a license expires.':'Edita un usuario para agregar o quitar licencias. Dirección y Coordinación reciben una alerta automática 30 días antes del vencimiento.'}</p>
    <div class="tbl-wrap" style="border:none"><table><thead><tr><th>${t('th_name')}</th><th>${t('th_role')}</th><th>${STATE.lang==='en'?'License':'Licencia'}</th><th>${STATE.lang==='en'?'Expires':'Vence'}</th><th>${STATE.lang==='en'?'Status':'Estado'}</th></tr></thead><tbody>
    ${groups.length?groups.map(g=>g.licenses.map((l,i)=>{
      const d=diffDays(l.expiry,now); const cls= d<0?'b-late': d<=30?'b-warn':'b-ok'; const lbl= d<0?(STATE.lang==='en'?'Expired':'Vencida'): d<=30?(STATE.lang==='en'?`${d}d left`:`${d}d restantes`):(STATE.lang==='en'?'OK':'Vigente');
      return `<tr class="row-click" onclick="openEditUser('${g.u.id}')">
        ${i===0?`<td rowspan="${g.licenses.length}">${esc(g.u.name)}</td><td rowspan="${g.licenses.length}">${roleLabel(normRole(g.u))}</td>`:''}
        <td>${esc(l.name)}</td><td>${fmtDate(l.expiry)}</td><td><span class="badge ${cls}"><span class="d"></span>${lbl}</span></td>
      </tr>`;
    }).join('')).join('') : `<tr><td colspan="5"><div class="empty">${t('empty_generic')}</div></td></tr>`}
    </tbody></table></div></div>`;
}
async function exportLicensesExcel(){
  if(typeof ExcelJS==='undefined'){ toast(STATE.lang==='en'?'Excel library failed to load (check your internet connection).':'No se pudo cargar la librería de Excel (revisa tu conexión a internet).'); return; }
  const wb=new ExcelJS.Workbook(); const ws=wb.addWorksheet(STATE.lang==='en'?'Licenses':'Licencias');
  ws.columns=[
    {header:t('th_name'),key:'f1',width:24},{header:t('th_role'),key:'f2',width:18},{header:t('th_discipline'),key:'f3',width:22},
    {header:STATE.lang==='en'?'License':'Licencia',key:'f4',width:22},{header:STATE.lang==='en'?'Expires':'Vence',key:'f5',width:14},
    {header:STATE.lang==='en'?'Status':'Estado',key:'f6',width:16},
  ];
  ws.getRow(1).font={bold:true};
  DB.users.forEach(u=>{
    if(!(u.licenses||[]).length){ ws.addRow({f1:u.name,f2:roleLabel(normRole(u)),f3:userDiscNames(u),f4:'—',f5:'—',f6:STATE.lang==='en'?'No license':'Sin licencia'}); return; }
    u.licenses.forEach(l=>{ const d=diffDays(l.expiry,iso(today())); const est=d<0?(STATE.lang==='en'?'Expired':'Vencida'):d<=30?(STATE.lang==='en'?`${d}d left`:`${d}d restantes`):(STATE.lang==='en'?'OK':'Vigente');
      ws.addRow({f1:u.name,f2:roleLabel(normRole(u)),f3:userDiscNames(u),f4:l.name,f5:fmtDate(l.expiry),f6:est}); });
  });
  const buf=await wb.xlsx.writeBuffer(); const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob); const link=document.createElement('a'); link.href=url; link.download='licencias.xlsx'; link.click();
  toast(STATE.lang==='en'?'Excel downloaded.':'Excel descargado.');
}
/* Alerta a Dirección/Coordinación 30 días antes de que venza una licencia (una sola vez por licencia) */
function checkLicenseAlerts(){
  let changed=false;
  const managers=DB.users.filter(x=>normRole(x)==='subdirector'||normRole(x)==='coordinador').map(x=>x.id);
  DB.users.forEach(u=>{
    (u.licenses||[]).forEach(l=>{
      const d=diffDays(l.expiry,iso(today()));
      if(!l.alertEnviada && d!==null && d<=30 && d>=0){
        notify(`🟡 ${STATE.lang==='en'?'License expiring soon':'Licencia próxima a vencer'}: ${u.name} — ${l.name} (${fmtDate(l.expiry)})`,'licencia',null,managers);
        l.alertEnviada=true; changed=true;
      }
      if(l.alertEnviada && (d===null||d>30)) l.alertEnviada=false;
    });
  });
  if(changed) saveDB();
}
function isDirector(){ return normRole(currentUser())==='subdirector'; }
/* Dirección edita toda la matriz de roles; Coordinación solo puede editar las columnas de Líder y Profesional */
function canEditRoleColumn(role){ if(role==='subdirector'||role==='coordinador') return isDirector(); return canManageUsers(); }
function adminRoles(){
  if(!canManageUsers()) return `<div class="card"><div class="empty">${t('no_permission')}</div></div>`;
  const perms=DB.settings.permissions;
  return `<div class="card" style="margin-bottom:14px">
    <div class="section-title">${STATE.lang==='en'?'Visible sections per role':'Secciones visibles por rol'}
      ${isDirector()?`<button class="btn btn-sm btn-ghost" onclick="restoreDefaultPermissions()">${STATE.lang==='en'?'Restore defaults':'Restaurar valores por defecto'}</button>`:''}</div>
    ${!isDirector()?`<p class="hint" style="margin-bottom:10px">${STATE.lang==='en'?'Coordination can only edit the Discipline Lead and Staff Member columns. Direction and Coordination columns are managed by Direction.':'Coordinación solo puede editar las columnas de Líder de disciplina y Profesional. Las columnas de Dirección y Coordinación las administra Dirección.'}</p>`:''}
    <div class="tbl-wrap" style="border:none"><table><thead><tr><th>${STATE.lang==='en'?'Section':'Sección'}</th>${ROLES.map(r=>`<th>${roleLabel(r)}${!canEditRoleColumn(r)?' 🔒':''}</th>`).join('')}</tr></thead><tbody>
    ${VIEW_IDS.map(v=>{
      const navItem=NAV.flatMap(g=>g.items).find(it=>it.id===v);
      return `<tr><td>${navItem?t(navItem.label):v}</td>${ROLES.map(r=>`<td style="text-align:center"><input type="checkbox" ${perms[r].views.includes(v)?'checked':''} ${canEditRoleColumn(r)?'':'disabled'} onchange="togglePermView('${r}','${v}',this.checked)"></td>`).join('')}</tr>`;
    }).join('')}
    </tbody></table></div>
  </div>
  <div class="card">
    <div class="section-title">${STATE.lang==='en'?'Capabilities per role':'Capacidades por rol'}</div>
    <p class="hint" style="margin-bottom:10px">${STATE.lang==='en'?'"Assign responsible only" reduces the edit form to a single field. Leave it unchecked for normal full editing.':'"Solo asignar responsable" reduce el formulario de edición a un único campo. Déjala sin marcar para edición completa normal.'}</p>
    <div class="tbl-wrap" style="border:none"><table><thead><tr><th>${STATE.lang==='en'?'Role':'Rol'}</th><th>${STATE.lang==='en'?'Create':'Crear'}</th><th>${t('btn_edit')}</th><th>${t('btn_delete')}</th><th>${STATE.lang==='en'?'Assign responsible only':'Solo asignar responsable'}</th></tr></thead><tbody>
    ${ROLES.map(r=>{ const ed=canEditRoleColumn(r); return `<tr><td>${roleLabel(r)}${!ed?' 🔒':''}</td>
      <td style="text-align:center"><input type="checkbox" ${perms[r].create?'checked':''} ${ed?'':'disabled'} onchange="togglePermCap('${r}','create',this.checked)"></td>
      <td style="text-align:center"><input type="checkbox" ${perms[r].edit?'checked':''} ${ed?'':'disabled'} onchange="togglePermCap('${r}','edit',this.checked)"></td>
      <td style="text-align:center"><input type="checkbox" ${perms[r].delete?'checked':''} ${ed?'':'disabled'} onchange="togglePermCap('${r}','delete',this.checked)"></td>
      <td style="text-align:center"><input type="checkbox" ${perms[r].assignResponsibleOnly?'checked':''} ${ed?'':'disabled'} onchange="togglePermCap('${r}','assignResponsibleOnly',this.checked)"></td>
    </tr>`;}).join('')}
    </tbody></table></div>
  </div>`;
}
function restoreDefaultPermissions(){
  if(!isDirector()){ toast(t('no_permission')); return; }
  if(!confirm(STATE.lang==='en'?'Restore all roles to the default permissions?':'¿Restaurar todos los roles a los permisos por defecto?')) return;
  DB.settings.permissions=defaultPermissions(); saveDB(); toast(STATE.lang==='en'?'Permissions restored.':'Permisos restaurados.'); renderAll();
}
function togglePermView(role,view,checked){
  if(!canEditRoleColumn(role)){ toast(t('no_permission')); return; }
  const p=DB.settings.permissions[role];
  if(checked){ if(!p.views.includes(view)) p.views.push(view); } else { p.views=p.views.filter(v=>v!==view); }
  saveDB(); renderAll();
}
function togglePermCap(role,cap,checked){ if(!canEditRoleColumn(role)){ toast(t('no_permission')); return; } DB.settings.permissions[role][cap]=checked; saveDB(); renderAll(); }
function adminCatalog(key,label){
  const list= key==='disciplines'? sortedDisciplines() : DB[key];
  return `<div class="card"><div class="section-title">${label} (${list.length}) <button class="btn btn-sm" onclick="addCatalogItem('${key}','${label}')">${STATE.lang==='en'?'+ New':'+ Nuevo'}</button></div>
    <div class="chip-select">${list.map(x=>`<div class="chip-opt on">${esc(x.name)}<span class="x" onclick="renameCatalogItem('${key}','${x.id}')" title="${t('btn_edit')}">✎</span><span class="x" onclick="removeCatalogItem('${key}','${x.id}')" title="${t('btn_delete')}">✕</span></div>`).join('')||`<div class="empty">${t('empty_generic')}</div>`}</div></div>`;
}
function addCatalogItem(key,label){
  const name=prompt((STATE.lang==='en'?'New name for ':'Nuevo nombre para ')+label+':'); if(!name||!name.trim()) return;
  DB[key].push({id:uid(key.slice(0,3).toUpperCase()),name:name.trim()}); saveDB(); renderAll();
}
function renameCatalogItem(key,id){
  const item=byId(DB[key],id); const name=prompt(STATE.lang==='en'?'New name:':'Nuevo nombre:',item.name); if(!name||!name.trim()) return;
  item.name=name.trim(); saveDB(); renderAll();
}
function removeCatalogItem(key,id){
  if(!confirm(STATE.lang==='en'?'Delete this item?':'¿Eliminar este elemento?')) return;
  DB[key]=DB[key].filter(x=>x.id!==id); saveDB(); renderAll();
}
function adminEmpresa(){
  return `<div class="card">
    <div class="section-title">${STATE.lang==='en'?'Company branding':'Marca de la empresa'}</div>
    <div class="form-row"><label>${t('company_name')}</label><input type="text" id="emp_name" value="${esc(DB.settings.companyName)}" onchange="setCompanyName(this.value)"></div>
    <div class="form-row"><label>${t('logo_upload')}</label>
      ${DB.settings.logo?`<div style="margin-bottom:10px"><img src="${DB.settings.logo}" class="logo-preview"></div>`:''}
      <input type="file" id="emp_logo" accept="image/*" onchange="uploadLogo(this)">
      <div class="hint">${STATE.lang==='en'?'PNG or SVG with transparent background works best. It will also appear on the sign-in screen.':'Se recomienda PNG o SVG con fondo transparente. También aparecerá en la pantalla de inicio de sesión.'}</div>
      ${DB.settings.logo?`<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="removeLogo()">${STATE.lang==='en'?'Remove logo':'Quitar logo'}</button>`:''}
    </div>
  </div>`;
}
function setCompanyName(v){ DB.settings.companyName=v; saveDB(); renderTopbar(); }
function uploadLogo(input){
  const f=input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=e=>{ DB.settings.logo=e.target.result; saveDB(); renderAll(); toast(STATE.lang==='en'?'Logo updated.':'Logo actualizado.'); };
  reader.readAsDataURL(f);
}
function removeLogo(){ DB.settings.logo=null; saveDB(); renderAll(); }
function adminNotifPrefs(){
  const u=currentUser();
  const prefs=[['nuevas',STATE.lang==='en'?'New activities':'Nuevas actividades'],['vencimientos',STATE.lang==='en'?'Due dates':'Vencimientos'],
    ['bloqueos',STATE.lang==='en'?'Blocks':'Bloqueos'],['prioridad',STATE.lang==='en'?'Priority changes':'Cambios de prioridad'],
    ['fechas',STATE.lang==='en'?'Date changes':'Cambios de fecha']];
  return `<div class="card"><div class="section-title">${STATE.lang==='en'?'Notification preferences — ':'Preferencias de notificación — '}${esc(u.name)}</div>
    ${prefs.map(([k,l])=>`<div class="kv"><b>${l}</b><input type="checkbox" ${u.notifPrefs?.[k]?'checked':''} onchange="toggleNotifPref('${k}',this.checked)"></div>`).join('')}
  </div>`;
}
function toggleNotifPref(k,val){ const u=currentUser(); u.notifPrefs=u.notifPrefs||{}; u.notifPrefs[k]=val; saveDB(); }

/* ============================ IMPORT / EXPORT / BORRAR TODO ============================ */
function viewDatos(){
  return `<div class="pagehead"><div><h1>${t('nav_datos')}</h1></div></div>
  <div class="grid grid-2">
    <div class="card"><div class="section-title">${STATE.lang==='en'?'Export':'Exportar'}</div>
      <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px">${STATE.lang==='en'?'Download a full JSON backup of all data.':'Descarga un respaldo completo de los datos en JSON.'}</p>
      <button class="btn btn-primary" onclick="exportJSON()">⇩ JSON</button></div>
    <div class="card"><div class="section-title">${STATE.lang==='en'?'Import':'Importar'}</div>
      <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px">${STATE.lang==='en'?'Load a previous backup. This replaces all current data.':'Carga un respaldo previo. Esto reemplaza todos los datos actuales.'}</p>
      <input type="file" accept="application/json" id="importFile" style="margin-bottom:10px">
      <button class="btn btn-danger" onclick="importJSON()">${STATE.lang==='en'?'Replace data':'Reemplazar datos'}</button></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="section-title">${STATE.lang==='en'?'Reset with sample data':'Reiniciar con datos de prueba'}</div>
    <button class="btn btn-danger" onclick="resetSeed()">${STATE.lang==='en'?'Reset':'Reiniciar'}</button></div>
  ${canManageUsers()?`<div class="card" style="margin-top:14px;border-color:var(--red)">
    <div class="section-title" style="color:var(--red)">${STATE.lang==='en'?'Delete everything':'Borrar todo'}</div>
    <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px">${STATE.lang==='en'?'Permanently deletes all activities and notifications (users and catalogs are kept so no one is locked out). Requires your password.':'Elimina permanentemente todas las actividades y notificaciones (los usuarios y catálogos se conservan para que nadie pierda el acceso). Requiere tu contraseña.'}</p>
    <button class="btn btn-danger" onclick="openWipeConfirm()">${STATE.lang==='en'?'Delete all activity data…':'Borrar todos los datos de actividades…'}</button>
  </div>`:''}`;
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='centro-control-personal-backup-'+iso(today())+'.json'; a.click();
  toast(STATE.lang==='en'?'Backup downloaded.':'Respaldo descargado.');
}
function importJSON(){
  const f=document.getElementById('importFile').files[0]; if(!f){ toast(STATE.lang==='en'?'Choose a file first.':'Selecciona un archivo primero.'); return; }
  const reader=new FileReader();
  reader.onload=e=>{ try{ DB=JSON.parse(e.target.result); if(!DB.settings.permissions) DB.settings.permissions=defaultPermissions();
      DB.activities.forEach(a=>{ if(!a.responsibleIds){ a.responsibleIds=a.responsibleId?[a.responsibleId]:[]; delete a.responsibleId; } if(a.readyForSite===undefined) a.readyForSite=false; });
      DB.users.forEach(u=>{ if(!u.username) u.username=(u.email||u.name).split('@')[0]; if(!u.password) u.password='1234';
        if(!u.hireDate) u.hireDate=''; if(!u.vacations) u.vacations=[]; if(!u.licenses) u.licenses=[];
        if(!u.disciplinaIds){ u.disciplinaIds=u.disciplinaId?[u.disciplinaId]:[]; delete u.disciplinaId; } });
      reindexAllDisciplines(DB); saveDB();
      if(!checkSession()){ toast(STATE.lang==='en'?'Data imported. Please sign in again.':'Datos importados. Inicia sesión nuevamente.'); logout(); return; }
      toast(STATE.lang==='en'?'Data imported.':'Datos importados.'); renderAll(); }
    catch(err){ toast(STATE.lang==='en'?'Invalid file.':'Archivo inválido.'); } };
  reader.readAsText(f);
}
function resetSeed(){
  if(!confirm(STATE.lang==='en'?'This will erase all current data. Continue?':'Esto borrará todos los datos actuales. ¿Continuar?')) return;
  localStorage.removeItem(DB_KEY); localStorage.removeItem(SESSION_KEY);
  DB=seed(); saveDB();
  document.body.classList.add('not-authed'); document.body.classList.remove('authed');
  STATE={view:'dashboard',filters:{},sort:{key:'dueDate',dir:1},lang:STATE.lang,orderDisc:''};
  renderLoginScreen(); toast(STATE.lang==='en'?'Sample data regenerated. Please sign in.':'Datos de prueba regenerados. Inicia sesión.');
}
function openWipeConfirm(){
  if(!canManageUsers()){ toast(t('no_permission')); return; }
  openModal(STATE.lang==='en'?'⚠ Delete all activity data':'⚠ Borrar todos los datos de actividades',`
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:14px">${STATE.lang==='en'?'This cannot be undone. Enter your password to confirm.':'Esta acción no se puede deshacer. Escribe tu contraseña para confirmar.'}</p>
    <div class="form-row"><label>${t('th_password')}</label><input type="password" id="wipe_pass"></div>
    <div id="wipeError" style="color:var(--red);font-size:12px"></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-danger" onclick="doWipeAll()">${STATE.lang==='en'?'Delete everything':'Borrar todo'}</button>`);
}
function doWipeAll(){
  const pass=document.getElementById('wipe_pass').value;
  if(pass!==currentUser().password){ document.getElementById('wipeError').textContent=t('login_error'); return; }
  DB.activities=[]; DB.notifications=[]; DB.counters.activity=1;
  saveDB(); closeModal(); STATE.activityId=null; STATE.filters={};
  toast(STATE.lang==='en'?'All activity data deleted.':'Todos los datos de actividades fueron eliminados.'); renderAll();
}

/* ============================ INIT ============================ */
document.documentElement.lang=STATE.lang;
const sessUserId=checkSession();
if(sessUserId){ DB.currentUserId=sessUserId; document.body.classList.remove('not-authed'); document.body.classList.add('authed'); renderAll(); }
else { renderLoginScreen(); }
initSync();
</script>
